input[type=text]{background:#efe2c4;border:1px solid var(--line2);border-radius:3px;padding:8px 10px;width:100%;max-width:340px}

'use strict';
/* ============ utilitaires ============ */
const $=(s,r=document)=>r.querySelector(s);
const rand=(a,b)=>a+Math.random()*(b-a);
const ri=(a,b)=>Math.floor(rand(a,b+1));
const pick=a=>a[Math.floor(Math.random()*a.length)];
const clamp=(v,a,b)=>Math.max(a,Math.min(b,v));
const shuffle=a=>{for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a};
const wpick=w=>{let t=w.reduce((a,b)=>a+b,0),r=Math.random()*t;for(let i=0;i<w.length;i++){r-=w[i];if(r<0)return i}return w.length-1};

const fmt=n=>n>=1e6?(n/1e6).toFixed(1)+' M':n>=1e4?(n/1e3).toFixed(1)+' k':Math.floor(n).toLocaleString('fr-FR');
const r1=v=>Math.round(v*10)/10;

  bag.forEach((e,i)=>{ if(skip&&skip.includes(e)) return; const [w,h]=SIZE(e.o);
    for(let y=e.y;y<e.y+h&&y<GH;y++) for(let x=e.x;x<e.x+w&&x<GW;x++) g[y][x]=i });
  return g;
}
function fitsAt(bag,x,y,w,h,skip){
  if(x<0||y<0||x+w>GW||y+h>GH) return false;
  const g=occGrid(bag,skip);
  for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) if(g[yy][xx]>=0) return false;
  return true;
}
function findSpot(bag,w,h){
  const g=occGrid(bag);
  for(let x=0;x<=GW-w;x++) for(let y=0;y<=GH-h;y++){
    let ok=true; for(let yy=y;yy<y+h&&ok;yy++) for(let xx=x;xx<x+w;xx++) if(g[yy][xx]>=0){ok=false;break}
    if(ok) return [x,y];
  }
  return null;
}
function bagAddMat(bag,k,n){
  n=Math.max(0,Math.floor(n||0));
  for(const e of bag){ if(n<=0) break; const c=e.o; if(c.mat===k&&c.n<STACK){const m=Math.min(STACK-c.n,n);c.n+=m;n-=m} }

  return n;
}
function bagAddItem(bag,it){const sp=findSpot(bag,...SIZE(it)); if(!sp) return false; bag.push({x:sp[0],y:sp[1],o:it}); return true}

function migrate(d){
  if(Array.isArray(d.bag)){
    const isNew=d.bag.length&&d.bag.every(e=>e&&e.o&&typeof e.x==='number');
    if(!isNew){
      const objs=d.bag.map(e=>e&&e.o?e.o:e).filter(Boolean),nb=[]; let gold=0,sold=0;
      const items=objs.filter(o=>!o.mat).sort((a,b)=>{const A=SIZE(a),B=SIZE(b);return B[0]*B[1]-A[0]*A[1]||b.rarity-a.rarity});
      for(const it of items) if(!bagAddItem(nb,it)){gold+=sellValue(it);sold++}
      const tot={}; for(const o of objs) if(o.mat) tot[o.mat]=(tot[o.mat]||0)+o.n;
      for(const [k,n] of Object.entries(tot)) bagAddMat(nb,k,n);
      d.bag=nb; d.gold=(d.gold||0)+gold;
      if(objs.length) MIG_MSG='Nouvel inventaire : les objets occupent maintenant plusieurs cases.'+(sold?` ${sold} objet${sold>1?'s':''} sans place vendu${sold>1?'s':''} pour ${fmt(gold)} or.`:'');
    }else d.bag=d.bag.filter(e=>e.x>=0&&e.y>=0);
  }else{
    const bag=bagNew(),mats=d.mats||{}; let lost=0,gold=0;
    for(const k of MATS) lost+=bagAddMat(bag,k,mats[k]||0);
    const items=(d.inv||[]).slice().sort((a,b)=>b.rarity-a.rarity||b.ilvl-a.ilvl);
    let sold=0; for(const it of items) if(!bagAddItem(bag,it)){gold+=sellValue(it);sold++}
    d.gold=(d.gold||0)+gold; d.bag=bag;
    if(d.mats||d.inv) MIG_MSG='Vos matériaux et objets sont maintenant dans l’onglet Inventaire.'+(sold?` ${sold} objet${sold>1?'s':''} en trop vendu${sold>1?'s':''} pour ${fmt(gold)} or.`:'');

}

function v3(d){

    if(!it||it.mat) return it;
    const old=it.base||'',nb=it.slot==='ring'?'Anneau':it.slot==='amulet'?'Amulette':(MAPB[old]||BASES.find(b=>b.slot===it.slot).n);
    const base=BASES.find(b=>b.n===nb),m=RAR[it.rarity].m,imp={};
    for(const [s,b,p] of base.imp){const v=(b+p*it.ilvl)*m; imp[s]=PCT.has(s)?Math.max(.5,r1(v)):Math.max(1,Math.round(v))}

    const pool=affPool(it.cls),ok=s=>pool.some(a=>a.s===s),aff=[];
    for(const a of it.aff||[]){
      if(ok(a.s)&&!aff.some(x=>x.s===a.s)){aff.push(a);continue}
      const n=pick(pool.filter(x=>!aff.some(y=>y.s===x.s)&&!(it.aff||[]).some(y=>y.s===x.s&&ok(y.s)))); if(n) aff.push({s:n.s,v:rollAff(n,it.ilvl,m)});
    }
    it.aff=aff; return it;
  };
  (d.bag||[]).forEach(e=>conv(e&&e.o?e.o:e));
  let changed=false;
  for(const h of d.heroes||[]){
    const nc=h.cls==='voleur'?'guerrier':h.cls==='clerc'?'mage':h.cls;
    if(nc!==h.cls){
      changed=true; h.cls=nc; h.learned={}; h.loadout=[]; h.sp=h.lvl;

}

const itemCost=it=>it.cost||estCost(it);
function addCost(it,c){ if(!it.cost) it.cost=estCost(it); for(const [k,v] of Object.entries(c)) if(v) it.cost[k]=(it.cost[k]||0)+v }
function salvageValue(it){
  const v={}; for(const [k,x] of Object.entries(itemCost(it))){const n=Math.floor(x*.25); if(n>0) v[k]=n}
  return v;
}
const resTxt=v=>Object.entries(v).map(([k,n])=>fmt(n)+' '+MAT_N[k].toLowerCase()).join(', ')||'rien';
const resChips=v=>Object.entries(v).map(([k,n])=>matChip(k,n)).join('')||'<span class="mute">rien</span>';
function addInv(it){
  if(bagAddItem(S.bag,it)){markNew();return true}
  gain(salvageValue(it)); return false;
}
function markNew(){ if(UI.tab!=='heroes') S.bagDot=true }
function gain(c){for(const [k,v] of Object.entries(c)){ if(k==='gold')S.gold+=v; else if(isMatK(k)){const left=storeMat(k,v); if(left>0) noteLost(k,left)} else {const left=bagAddMat(S.bag,k,v); if(left>0) noteLost(k,left); if(Math.floor(v)-left>0) markNew()} }}
const DBG=()=>ACC.dbg||(ACC.dbg={});
const FREE=()=>!!DBG().free;
const hasGold=c=>FREE()||S.gold>=c;
const canPay=c=>FREE()||Object.entries(c).every(([k,v])=>(k==='gold'?S.gold:matCount(k))>=v);
function pay(c){if(FREE())return;for(const [k,v] of Object.entries(c)){ if(k==='gold')S.gold-=v; else removeMat(k,v) }}
const costHTML=c=>`<span class="cost">${Object.entries(c).filter(([,v])=>v>0).map(([k,v])=>{const have=k==='gold'?S.gold:matCount(k);return `<span class="${have>=v?'ok':'no'}" title="${MAT_N[k]}">${matIcon(k)}${fmt(v)}<span class="sr">${MAT_N[k]}</span></span>`}).join('')}</span>`;

const xpNeed=l=>Math.round(30*Math.pow(l,1.6));
function newHero(name,cls,hue,lvl=1){
  const h={id:++S.uid,name,cls,hue,lvl,xp:0,sp:lvl,stars:0,learned:{},loadout:[],equip:{}};
  const first=CLASSES[cls].skills.find(s=>s.t==='a'&&s.lvl===1);
  h.learned[first.id]=1; h.loadout.push(first.id);
  h.equip.weapon=genItem('weapon',lvl,0,null,cls);
  h.equip.armor=genItem('armor',lvl,0,null,cls);
  return h;
}
const partyHeroes=()=>S.party.map(id=>S.heroes.find(h=>h.id===id)).filter(Boolean);
function gearStats(h){
  const t={};
  for(const s of SLOTS){const it=h.equip[s]; if(it) for(const [k,v] of Object.entries(itemStats(it))) t[k]=(t[k]||0)+v}
  return t;
}
function passMods(h){
  const t={};
  for(const sk of heroSkills(h)){
    if(sk.t!=='p'||!sk.mods) continue; const r=h.learned[sk.id]||0; if(!r) continue;
    for(const [k,v] of Object.entries(sk.mods)) t[k]=(t[k]||0)+v*r;
  }
  return t;
}
function heroStats(h){
  const c=CLASSES[h.cls],lv=h.lvl-1,star=1+.1*h.stars,g=gearStats(h),p=passMods(h);
  const b=k=>(c.base[k]+c.grow[k]*lv)*star;
  const pc=k=>(g[k+'Pct']||0)+(p[k+'Pct']||0);
  return {
    hp:(b('hp')+(g.hp||0))*(1+pc('hp')/100),
    atk:(b('atk')+(g.atk||0))*(1+pc('atk')/100),
    mag:(b('mag')+(g.mag||0))*(1+pc('mag')/100),
    def:(b('def')+(g.def||0))*(1+pc('def')/100),
    res:(b('res')+(g.res||0))*(1+pc('res')/100),
    spd:(b('spd')+(g.spd||0))*(1+pc('spd')/100),
    crit:Math.min(CRIT_CAP,5+(g.crit||0)+(p.crit||0)),
    critDmg:Math.min(CDMG_CAP,150+(g.critDmg||0)+(p.critDmg||0)),
    dodge:Math.min(30,(g.dodge||0)+(p.dodge||0)),
    lifesteal:Math.min(20,(g.lifesteal||0)+(p.lifesteal||0)),
    dmgPct:g.dmgPct||0,goldFind:g.goldFind||0,dropRate:g.dropRate||0,
    regen:p.regen||0,healPow:p.healPow||0,
    ap:5+(g.ap||0)+(p.ap||0),
    ...Object.fromEntries(RES_K.map(k=>[k,Math.min(RES_CAP,(g[k]||0)+(p[k]||0))])),
  };
}
function heroPower(h){
  const s=heroStats(h);
  return s.hp/8+Math.max(s.atk,s.mag)*2.2+s.def+s.res+s.spd*2+s.crit*1.5+s.critDmg*.2+s.dodge*2+s.lifesteal*3+s.dmgPct*3;
}
function gainXp(h,xp){
  h.xp+=xp; let ups=0;
  while(h.lvl<MAXL&&h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);h.lvl++;h.sp++;ups++}
  if(h.lvl>=MAXL)h.xp=0;
  return ups;
}
const sc=r=>1+.12*(r-1);
function skDesc(sk,rank,role,gx,asLines){

const refreshAll=()=>C.units.forEach(refresh);

function dmg(t,d,crit,src,label){
  let left=d;
  if(t.shield>0){const a=Math.min(t.shield,left);t.shield-=a;left-=a}
  t.hp-=left; if(t.hp<0)t.hp=0;
  floatTxt(t,(crit?'✦ ':'')+d,crit?'crit':'');
  const el=unitEl(t); if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),300)}
  logLine(`${t.name} subit ${d} dégâts${label?' ('+label+')':''}${crit?' — coup critique !':''}`,crit?'cr':'');
  if(t.hp<=0){logLine(`${t.name} est vaincu.`,'ev');t.st=[]}
  else if(src&&t.gx&&t.gx.ult&&t.gx.ult.trig==='hurt') ultGain(t,m=>{logLine(m,'hl')});
  refresh(t);
}
function heal(t,a,silent){
  a=Math.round(a); if(a<=0||t.hp<=0) return;
  const real=Math.min(a,t.maxHp-t.hp); t.hp+=real;
  floatTxt(t,'+'+real,'heal'); if(!silent||real>0) logLine(`${t.name} récupère ${real} PV.`,'hl'); refresh(t);
}
const resMul=(t,st,el)=>(1-Math.min(RES_CAP,t[st==='mag'?'rMag':'rPhys']||0)/100)*(el&&ELEM[el]?1-Math.min(RES_CAP,t[ELEM[el].k]||0)/100:1);
function hit(u,t,mult,st,sk){
  if(Math.random()*100<(t.dodge||0)){floatTxt(t,'Esquive','miss');logLine(`${t.name} esquive l’attaque.`);return}
  const ds=st==='mag'?'res':'def';
  const K=100+15*(u.lvl||1); /* plus l’attaquant est haut niveau, moins la défense le freine */
  let d=effStat(u,st)*mult*K/(K+effStat(t,ds));
  d*=1+(u.dmgPct||0)/100;
  d*=resMul(t,st,sk&&sk.el);
  d*=skMul(u,t,sk);
  const rs=u.boss?DIFF[C.diff||'normal'].rage:30;
  if(u.team==='e'&&C.round>rs) d*=1+(C.round-rs)*(u.boss&&rs<30?.08:.1);
  if(sk&&sk.exec&&t.hp/t.maxHp<sk.exec.thr/100) d*=1+sk.exec.bonus;
  d*=rand(.92,1.08);
  const crit=Math.random()*100<(u.crit||0); if(crit) d*=(u.critDmg||150)/100;
  d=Math.max(1,Math.round(d));

  if(u.lifesteal&&u.hp>0) heal(u,d*u.lifesteal/100,true);
  { const ul=(u.st||[]).find(q=>q.k==='ult'&&q.ls); if(ul&&u.hp>0) heal(u,d*ul.ls/100,true) }
  return d;
}
function applyFx(u,t,f,k,sk){
  if(t.hp<=0) return;
  const st=sk.st||u.role;
  if(f.k==='dot'){
    if(Math.random()*100>=fxCh(f,sk,u.gx)) return;
    t.st=t.st.filter(s=>!(s.k==='dot'&&s.n===f.n));
    t.st.push({k:'dot',n:f.n,v:effStat(u,st)*f.v*k*resMul(t,st,sk.el)*fxPow(f,u.gx),dur:fxDur(f,u.gx)});
    if(f.ch!=null) logLine(`${t.name} subit ${f.n}.`,'ev');
  }else if(f.k==='para'){
    if(Math.random()*100<(fxCh(f,sk,u.gx)+ulPara(u))*(t.boss?.5:1)){ t.st=t.st.filter(s=>s.k!=='para'); t.st.push({k:'para',p:paraPow(u.gx),dur:f.dur}); floatTxt(t,'Paralysie','miss'); logLine(`${t.name} est paralysé !`,'ev') }
  }else if(f.k==='det'){
    const q=t.st.find(x=>x.k==='dot'&&x.n===f.n); if(q){ t.st=t.st.filter(x=>x!==q); dmg(t,Math.max(1,Math.round(q.v*q.dur*f.m*k)),false,u,f.n+' : détonation') }
  }else if(f.k==='stun'){
    const ch=(f.ch||100)*(t.boss?.5:1);
    if(Math.random()*100<ch&&!t.st.some(s=>s.k==='stun')){t.st.push({k:'stun',dur:f.dur});logLine(`${t.name} est étourdi !`,'ev')}
  }else if(f.k==='shield'){
    const a=f.of==='hp'?t.maxHp*f.v*k:effStat(u,'mag')*f.v*k;
    t.shield=Math.min(t.maxHp,t.shield+a); floatTxt(t,'Bouclier','heal');
  }else if(f.k==='heal'){
    heal(t,effStat(u,f.of||'mag')*f.v*k*(1+(u.healPow||0)/100)*rand(.95,1.05));
  }else if(f.k==='buff'||f.k==='debuff'){
    const v=f.v*(f.k==='buff'?k:Math.abs(k));
    t.st=t.st.filter(s=>!(s.k==='buff'&&s.stat===f.stat&&Math.sign(s.v)===Math.sign(v)));
    t.st.push({k:'buff',stat:f.stat,v:f.k==='debuff'?-Math.abs(v):v,dur:f.dur});
  }else if(f.k==='taunt'){
    t.st=t.st.filter(s=>s.k!=='taunt'); t.st.push({k:'taunt',dur:f.dur});
  }
  refresh(t);
}
async function exec(u,sk,tgt){
  const rank=sk.id==='atk'?1:(u.ranks[sk.id]||1),k=sc(rank);
  if(sk.cd) u.cds[sk.id]=sk.cd+1;
  if(sk.ap) u.ap=Math.max(0,(u.ap||0)-sk.ap);
  if(sk.self){ const c=Math.min(u.hp-1,Math.round(u.maxHp*sk.self)); if(c>0){ u.hp-=c; floatTxt(u,'-'+c,''); logLine(`${u.name} sacrifie ${c} PV.`,'cr'); refresh(u) } }
  const foesA=alive(foes(u)),friA=alive(friends(u));
  if((sk.tg==='one')&&(!tgt||tgt.hp<=0)) tgt=foesA[0];
  let fT=[],aT=[];
  if(sk.tg==='one') fT=tgt?[tgt]:[];
  else if(sk.tg==='all') fT=foesA;
  else if(sk.tg==='self') aT=[u];
  else if(sk.tg==='allies') aT=friA;
  else if(sk.tg==='lowAlly') aT=[friA.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]];
  logLine(sk.id==='atk'?`${u.name} attaque${tgt?' '+tgt.name:''}.`:`${u.name} utilise ${sk.n}.`);
  const el=unitEl(u); if(el){el.style.transform='scale(1.03)';setTimeout(()=>{el.style.transform=''},220)}
  await sleep(260);
  const st=sk.st||u.role;
  if(sk.mult) for(const t of fT) for(let i=0;i<(sk.hits||1);i++){ if(t.hp<=0)break; const d=hit(u,t,sk.mult*k,st,sk); if(sk.ls&&d&&u.hp>0) heal(u,d*sk.ls/100) }
  for(const f of sk.fx||[]){
    const on=f.on||(sk.tg==='one'||sk.tg==='all'?'foe':'friend');
    const ts=on==='foe'?fT:on==='allies'?alive(friends(u)):aT;
    for(const t of ts) applyFx(u,t,f,k,sk);
  }
  ultAfterCast(u,sk,fT,m=>{logLine(m,'hl');floatTxt(u,m.split(' : ').pop(),'heal')});
  refreshAll();
  await sleep(420);
}
const AP_REGEN=1;
const PA_POT=2,PA_CD=6;
function stTick(u){ u.st.forEach(s=>s.dur--); for(const s of u.st) if(s.k==='apb'&&s.dur<=0){ u.maxAp=Math.max(0,(u.maxAp||0)-s.v); u.ap=Math.min(u.ap||0,u.maxAp) } u.st=u.st.filter(s=>s.dur>0) }
function addApb(u){ u.st=u.st.filter(s=>{ if(s.k==='apb'){u.maxAp-=s.v; return false} return true }); u.st.push({k:'apb',v:PA_POT,dur:3}); u.maxAp=(u.maxAp||0)+PA_POT; u.ap=(u.ap||0)+PA_POT }
const canAct=u=>u.hp>0&&(!u.atkUsed||u.skills.some(id=>(u.cds[id]||0)===0&&(u.ap||0)>=(SK[id].ap||0)));
function tauntOf(list){return list.find(x=>x.hp>0&&x.st.some(s=>s.k==='taunt'))}
function ai(u,noAtk){
  const foesA=alive(foes(u)),friA=alive(friends(u));
  const usable=u.skills.filter(id=>(u.cds[id]||0)===0&&(u.ap||0)>=(SK[id].ap||0)).map(id=>({sk:SK[id],rank:u.ranks[id]||1}));
  const isHeal=x=>x.sk.tg==='lowAlly'&&x.sk.fx&&x.sk.fx.some(f=>f.k==='heal');
  const low=friA.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
  const healer=usable.find(isHeal);
  if(healer&&low&&low.hp/low.maxHp<.55) return {skill:healer.sk,target:low};
  let best=null,bs=1;
  for(const x of usable){
    const sk=x.sk; if(isHeal(x)) continue; if(sk.self&&u.hp/u.maxHp<.4) continue;
    let s=(sk.mult||0)*(sk.tg==='all'?foesA.length*.8:1)*sc(x.rank);
    { const dt=(sk.fx||[]).find(f=>f.k==='det'); if(dt) s*=foesA.some(f=>hasSt(f,'dot',dt.n))?2.4:.35; }

    if(!sk.mult){
      const need=(sk.fx||[]).some(f=>(f.k==='buff'&&friA.every(a=>!a.st.some(q=>q.k==='buff'&&q.stat===f.stat)))||(f.k==='shield'&&u.shield<u.maxHp*.1&&(sk.tg!=='self'||true)));
      s=need?1.7:0;

  }
  return {skill,target};
}
function playerChoice(u){
  return new Promise(res=>{C.waiting={u,res};C.pending=null;renderActbar();refreshAll()});
}
async function turn(u){
  C.turn=u.id; if(u.maxAp) u.ap=u.maxAp; refreshAll();
  for(const s of u.st.filter(s=>s.k==='dot')) if(u.hp>0) dmg(u,Math.max(1,Math.round(s.v)),false,null,s.n);
  if(u.regen&&u.hp>0) heal(u,u.maxHp*u.regen/100,true);
  if(u.hp<=0){C.turn=null;refreshAll();return}
  let skip=false;
  if(u.st.some(s=>s.k==='stun')){logLine(`${u.name} est étourdi et passe son tour.`,'ev');skip=true;await sleep(500)}
  else { const pa=u.st.find(s=>s.k==='para'); if(pa&&Math.random()*100<(pa.p||50)){ logLine(`${u.name} est paralysé et perd son tour.`,'ev'); floatTxt(u,'Paralysé','miss'); skip=true; await sleep(500) } }
  if(!skip){
    u.atkUsed=false;
    if(u.team==='h'){
      for(let n=0;n<12;n++){
        if(!canAct(u)) break;
        let ch;
        if(!S.auto){ ch=await playerChoice(u); if(C.abort) return; if(!ch||ch.end) break }
        else { await sleep(300); ch=ai(u,u.atkUsed); if(!ch) break }
        if(ch.skill.id==='atk') u.atkUsed=true;
        await exec(u,ch.skill,ch.target);
        if(C.abort||checkEnd()) break;
      }
      C.waiting=null; C.pending=null; renderActbar();
    }else{
      await sleep(380);
      const ch=ai(u); await exec(u,ch.skill,ch.target);
    }
  }
  stTick(u);
  for(const id of Object.keys(u.cds)) u.cds[id]=Math.max(0,u.cds[id]-1);
  C.turn=null; refreshAll();
}
function checkEnd(){
  if(!alive(C.units.filter(u=>u.team==='e')).length) return 'win';
  if(!alive(C.units.filter(u=>u.team==='h')).length) return 'lose';
  return null;
}
async function loop(id){
  while(true){
    if(C.abort||C.id!==id) return;
    C.round++; logLine(`Tour ${C.round}`,'rd');
    if(C.round===31) logLine('Les ennemis entrent en rage : leurs dégâts augmentent à chaque tour.','cr');
    { const rb=DIFF[C.diff||'normal'].rage; if(rb<30&&C.round===rb+1&&C.units.some(x=>x.boss&&x.hp>0)) logLine('Le boss entre en rage : ses dégâts augmentent à chaque tour !','cr') }
    const order=alive(C.units).sort((a,b)=>effStat(b,'spd')-effStat(a,'spd')||Math.random()-.5);
    for(const u of order){
      if(C.abort||C.id!==id) return;
      if(u.hp<=0) continue;
      await turn(u);
      if(C.abort||C.id!==id) return;
      const r=checkEnd(); if(r){await finish(r);return}
    }
  }

async function finish(r){

  const D=DIFF[C.diff||'normal'],party=partyHeroes(),L=D.L||C.zone*10+C.stage,boss=C.stage===10,lb=(1+(C.bonus?C.bonus.loot:0)/100)*D.rw;

  const si=SITES.find(s=>s.id===id),st=S.sites[id],got={},items=[]; let lost=false;
  const n=st.ready||0,amt={};
  for(const m of Object.keys(si.out)){ let k=n; if(tal(st)['r_'+m+'X']) for(let i=0;i<n;i++) if(Math.random()<.1) k++; amt[m]=k*siteBatch(si,st,m) }

async function pvpSearch(){
  if(!pvpReady()){toast('Chargez un personnage pour faire un duel.');return}
  if(inFight()){toast('Terminez d’abord votre combat en cours.');return}
  if(PV.match||RD.match) return; if(RD.searching) rdStopSearch(); PV.searching=true; render();

  await put(); let n=0;
  const poll=async()=>{
    if(!PV.searching||PV.match) return;
    if(++n%7===0) put();
    try{ const qs=await pvpQ().orderBy('ts').limit(25).get();
      const c=qs.docs.map(d=>d.data()).filter(x=>x.uid!==me&&Date.now()-(x.tms||0)<60000);
      const o=c[0]; if(o&&me>o.uid&&!PV.match) await pvpPropose(o.uid,o.name,o.char,'search');
    }catch(e){}

}

/* moteur de combat (calculé par le joueur actif) */
const pvEff=(u,k)=>{let x=0; for(const s of u.st||[]) if(s.k==='buff'&&s.stat===k) x+=s.v; return (u[k]||0)*Math.max(.25,1+x/100)};
function pvHit(u,t,mult,st,sk,L){
  if(Math.random()*100<(t.dodge||0)){L.push(`${t.name} esquive.`);return}
  const K=100+15*(u.lvl||1),ds=st==='mag'?'res':'def';
  let d=pvEff(u,st)*mult*K/(K+pvEff(t,ds)); d*=1+(u.dmgPct||0)/100; d*=resMul(t,st,sk&&sk.el); d*=skMul(u,t,sk); d*=rand(.92,1.08);
  const cr=Math.random()*100<(u.crit||0); if(cr) d*=(u.critDmg||150)/100; d=Math.max(1,Math.round(d));
  let a=d; if(t.shield>0){const s=Math.min(t.shield,a); t.shield-=s; a-=s}
  t.hp=Math.max(0,t.hp-a); L.push(`${t.name} subit ${d} dégâts${cr?' (critique !)':''}.`);
  if(t.hp>0&&t.gx&&t.gx.ult&&t.gx.ult.trig==='hurt') ultGain(t,m=>L.push(m));
  { const ul=(u.st||[]).find(q=>q.k==='ult'&&q.ls); if(ul&&u.hp>0){ const hh=Math.min(u.maxHp-u.hp,Math.round(d*ul.ls/100)); if(hh>0) u.hp+=hh } }
  if(u.lifesteal&&u.hp>0){const hh=Math.min(u.maxHp-u.hp,Math.round(d*u.lifesteal/100)); if(hh>0){u.hp+=hh}}
  if(sk&&sk.ls&&u.hp>0){const hh=Math.min(u.maxHp-u.hp,Math.round(d*sk.ls/100)); if(hh>0){u.hp+=hh; L.push(`${u.name} récupère ${hh} PV.`)}}

function pvSelf(u,sk,L){ if(!sk.self) return; const c=Math.min(u.hp-1,Math.round(u.maxHp*sk.self)); if(c>0){ u.hp-=c; L.push(`${u.name} sacrifie ${c} PV.`) } }
function pvExec(u,t,sk,L){

function pvFx(u,tg,f,k,sk,L){
  const st=sk.st||u.role; if(tg.hp<=0) return;
  {
    if(f.k==='dot'){ if(Math.random()*100>=fxCh(f,sk,u.gx)) return; tg.st=tg.st.filter(s=>!(s.k==='dot'&&s.n===f.n)); tg.st.push({k:'dot',n:f.n,v:Math.round(pvEff(u,st)*f.v*k*resMul(tg,st,sk.el)*fxPow(f,u.gx)),dur:fxDur(f,u.gx)}); L.push(`${tg.name} subit ${f.n}.`)}

    else if(f.k==='taunt'){tg.st=tg.st.filter(s=>s.k!=='taunt'); tg.st.push({k:'taunt',dur:f.dur}); L.push(`${tg.name} provoque l’adversaire.`)}

/* fin du tour courant -> prochain joueur (les tours du boss sont joués automatiquement) */

    V.ap=V.maxAp;
    for(const s of V.st.filter(s=>s.k==='dot')){ const d=Math.max(1,s.v); V.hp=Math.max(0,V.hp-d); x.L.push(`${V.name} subit ${d} dégâts (${s.n}).`) }
    if(V.hp<=0){ x.L.push(`${V.name} est vaincu.`); continue }
    if(V.st.some(s=>s.k==='stun')){ x.L.push(`${V.name} est étourdi et passe son tour.`); rdEndOf(V); continue }
    { const pa=V.st.find(s=>s.k==='para'); if(pa&&Math.random()*100<(pa.p||50)){ x.L.push(`${V.name} est paralysé et perd son tour.`); rdEndOf(V); continue } }

const userDoc=uid=>FB.db.collection(COL('users')).doc(uid);
async function cloudPull(uid){
  const snap=await userDoc(uid).get(), d=snap.exists?snap.data():null;
  const localHas=Array.from({length:MAXCH},(_,i)=>charRaw(i)).some(Boolean);
  if(!d){ /* première connexion : la partie de cet appareil devient celle du compte */
    if(ACC.owner&&ACC.owner!==uid) clearLocalChars();
    ACC.owner=uid; ACC.offline=false; saveAcc(); await cloudPush(true); return }
  if(ACC.owner===uid&&(ACC.ts||0)>(d.ts||0)){ ACC.offline=false; await cloudPush(true); return }
  if(localHas&&!ACC.owner){ /* partie hors ligne : on la garde de côté */
    const bak={acc:ACC,chars:Array.from({length:MAXCH},(_,i)=>lsGet(CHAR_KEY(i)))}; lsSet(KP+'bak_'+Date.now(),JSON.stringify(bak));
    setTimeout(()=>toast('Votre partie hors ligne a été mise de côté : la sauvegarde du compte est chargée.'),800) }
  for(let i=0;i<MAXCH;i++){const c=d['c'+i]; if(c) lsSet(CHAR_KEY(i),c); else lsDel(CHAR_KEY(i))}
  ACC=Object.assign({gold:80,cur:null,seenVer:null},d.acc||{},{owner:uid,ts:d.ts||Date.now(),offline:false,cur:null});
  lsSet(ACC_KEY,JSON.stringify(ACC)); S=null;
}

    if(r.test){ el.innerHTML=`<div class="result ${r.win?'':'lose'}"><h2 class="${r.win?'':'lose'}" style="margin-bottom:6px">${r.win?'Victoire':'Défaite'} — combat de test</h2><p style="margin:0 0 10px">Aucune récompense ni progression.</p><div class="row"><button class="btn pri" data-act="bestBack">Retour au Bestiaire</button><button class="btn" data-act="back">Fermer</button></div></div>`; return }

}

/* --- potions en combat --- */
const ownPots=()=>Object.keys(POTS).filter(k=>!POTS[k].nocombat&&matCount(k)>0&&(!POTS[k].cls||POTS[k].cls===S.heroes[0].cls));
function potBar(){
  const ks=ownPots(); if(!ks.length) return '<small class="mute" style="align-self:center">Aucune potion : achetez-en chez le Marchand.</small>';
  return `<div class="potbar">${ks.map(k=>{const used=(k==='p_xp'&&C.bonus.xp)||(k==='p_loot'&&C.bonus.loot),cd=potLeft(k),cs=potShow(k,cd);
    return `<button class="potb ${used||cd?'off':''}" data-act="usePot" data-k="${k}" data-tip="pot:${k}" aria-label="${esc(POTS[k].n)}${cd?', recharge '+cs+' tours':used?', déjà utilisée':''}">${matIcon(k)}<span class="num">${matCount(k)}</span>${cd?`<span class="cdo">${cs}</span>`:used?'<span class="cdo">✓</span>':''}</button>`}).join('')}</div>`;
}
const POT_CD=3;
const potLeft=k=>{ const P=POTS[k]; if(!P||!C.pcd||C.pcd[k]==null) return 0; return Math.max(0,(P.cd||0)+1-(C.round-C.pcd[k])) };
const potShow=(k,n)=>Math.min(n,(POTS[k]&&POTS[k].cd)||n);
function usePot(k){
  if(!inFight()||!matCount(k)||potLeft(k)) return;
  const u=C.units.find(x=>x.team==='h'&&x.hp>0); if(!u) return;
  const B=(stat,v)=>{u.st=u.st.filter(s=>!(s.k==='buff'&&s.stat===stat&&s.v>0&&s.pot));u.st.push({k:'buff',stat,v,dur:3,pot:1})};
  if(k==='p_vie') heal(u,u.maxHp*.4);
  else if(k==='p_res'){B('def',40);B('res',40)}
  else if(k==='p_for') B('atk',30);
  else if(k==='p_int') B('mag',30);
  else if(k==='p_pa') addApb(u);
  else if(k==='p_xp'){ if(C.bonus.xp) return; C.bonus.xp=50 }
  else if(k==='p_loot'){ if(C.bonus.loot) return; C.bonus.loot=50 }
  if(POTS[k].cd) C.pcd[k]=C.round; removeMat(k,1); logLine(`${u.name} boit : ${POTS[k].n}.`,'hl'); floatTxt(u,POTS[k].n,'heal'); refresh(u); save(); renderActbar();
}

/* --- marchand --- */
function viewShop(){
  const h=S.heroes[0];
  const cards=Object.entries(POTS).map(([k,p])=>{
    const pr=potPrice(k),own=matCount(k),lock=p.cls&&p.cls!==h.cls;
    const b=q=>p.fix?(q>1?'':`<button class="btn sm pri" data-act="buyPot" data-k="${k}" data-q="1" ${canPay(p.fix)?'':'disabled'}>Acheter</button>${costHTML(p.fix)}`):`<button class="btn sm ${q===1?'pri':''}" data-act="buyPot" data-k="${k}" data-q="${q}" ${!lock&&hasGold(pr*q)?'':'disabled'}>Acheter ×${q} <span class="num">(${fmt(pr*q)} or)</span></button>`;
    return `<article class="shopc ${lock?'lock':''}"><div class="row" style="gap:10px;align-items:flex-start"><span class="potico">${matIcon(k)}</span><div style="flex:1;min-width:0"><b>${p.n}</b><p class="hint" style="margin:2px 0 6px">${p.d}</p>${lock?`<small style="color:var(--blood);font-weight:700">Réservée au ${CLASSES[p.cls].n}</small>`:`<small class="mute">Possédées : <b class="num">${own}</b></small>`}</div></div>

}

/* --- inventaire --- */
function targetSlot(h,it){
  if(it.slot!=='ring') return it.slot;
  if(UI.invSel==='ring'||UI.invSel==='ring2') return UI.invSel;
  if(!h.equip.ring) return 'ring';
  if(!h.equip.ring2) return 'ring2';
  return 'ring';
}
function swapDelta(h,it){
  if(!canWear(it)) return null;
  const ts=targetSlot(h,it),old=h.equip[ts],p0=heroPower(h);
  h.equip[ts]=it; const p1=heroPower(h); h.equip[ts]=old;
  return p1-p0;
}

const RUNE_ORDER=['helm','amulet','armor','legs','boots','ring2','weapon','ring'];
function runeDollHTML(h,forge){
  const W=300,H=340,cx=150,cy=170,R=122,sz=48,c=CLASSES[h.cls];
  const slots=RUNE_ORDER.map((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/RUNE_ORDER.length,x=cx+R*Math.cos(a)-sz/2,y=cy+R*Math.sin(a)-sz/2,it=h.equip[k];
    return `<button class="dslot ${it?'full':''} ${(forge?it&&it.id===UI.fItem:UI.invSel===k)?'sel':''}" data-act="${forge?'fPutSlot':'dollSlot'}" data-slot="${k}" data-tip="${k}" aria-label="${SLOT_N[k]}${it?' : '+esc(it.name):' (vide)'}" style="left:${x/W*100}%;top:${y/H*100}%;width:${sz/W*100}%;${it?`--rc:var(--r${it.rarity})`:''}">${icon(it?itemIcon(it):slotIcon(k))}${it&&it.up?`<em>+${it.up}</em>`:''}</button>`}).join('');
  const center=PORTRAIT[h.cls]?`<image href="${PORTRAIT[h.cls]}" x="${cx-72}" y="${cy-72}" width="144" height="144"/>`:`<circle cx="${cx}" cy="${cy}" r="60" fill="hsl(${h.hue} 30% 26%)"/>`;
  const runes='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊ'.split('').map((r,i)=>{const a=i*2*Math.PI/16+Math.PI/16;return `<text x="${cx+96*Math.cos(a)}" y="${cy+96*Math.sin(a)+4}" text-anchor="middle">${r}</text>`}).join('');
  return `<div class="doll rune" id="doll"><svg class="body" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <defs><radialGradient id="rg" cx="50%" cy="50%" r="62%"><stop offset="0" stop-color="#8a6842"/><stop offset=".65" stop-color="#6a4c2f"/><stop offset="1" stop-color="#4e3622"/></radialGradient></defs>
    <rect width="${W}" height="${H}" rx="4" fill="url(#rg)"/>
    <circle cx="${cx}" cy="${cy}" r="${R+6}" fill="none" stroke="#d6aa55" stroke-width="1.5" opacity=".75"/>
    <circle cx="${cx}" cy="${cy}" r="${R-6}" fill="none" stroke="#d6aa55" stroke-width="1" stroke-dasharray="2 6" opacity=".6"/>
    <g fill="#d6aa55" opacity=".55" font-size="11" font-family="serif">${runes}</g>
    <circle cx="${cx}" cy="${cy}" r="80" fill="none" stroke="#d6aa55" stroke-width="1" opacity=".5"/>
    ${center}</svg>${slots}</div>`;
}

  const items=S.bag.map((e,i)=>{
    const c=e.o,[w,h]=SIZE(c),pos=`grid-column:${e.x+1}/span ${w};grid-row:${e.y+1}/span ${h}`;
    const sel=UI.multi?(UI.pick.has(c)?' pick':''):UI.tab==='forge'?((UI.bagSel===c||(c.id&&c.id===UI.fItem))?' sel':''):(UI.bagSel===c?' sel':'');
    if(c.mat) return `<button class="cell full gi mat${sel}" style="${pos}" data-act="bagCell" data-i="${i}" data-tip="bag:${i}" aria-label="${MAT_OBJ[c.mat]}, ${c.n}">${matSvg(c.mat)}<span class="q">${c.n}</span></button>`;

}

function sortBag(){
  const {k,dir}=UI.bagSort,tot={},ent=[],old=S.bag;
  for(const e of S.bag){ if(e.o.mat) tot[e.o.mat]=(tot[e.o.mat]||0)+e.o.n; else ent.push(e.o) }
  for(const [m,n] of Object.entries(tot)){let r=n;while(r>0){const q=Math.min(STACK,r);ent.push({mat:m,n:q});r-=q}}
  const q=c=>c.mat?c.n:1;
  const byName=(a,b)=>cellName(a).localeCompare(cellName(b),'fr',{sensitivity:'base'});
  const tie=(a,b)=>(b.rarity||0)-(a.rarity||0)||(b.ilvl||0)-(a.ilvl||0);
  ent.sort(k==='name'?(a,b)=>dir*(byName(a,b)||q(b)-q(a)||tie(a,b)):(a,b)=>dir*(q(b)-q(a)||byName(a,b)||tie(a,b)));
  const place=list=>{const b=[];for(const o of list){const sp=findSpot(b,...SIZE(o)); if(!sp) return null; b.push({x:sp[0],y:sp[1],o})} return b};
  const area=o=>{const [w,h]=SIZE(o);return w*h};
  S.bag=place(ent)||place(ent.slice().sort((a,b)=>area(b)-area(a)))||old;
  if(S.bag===old) toast('Impossible de tout ranger : faites un peu de place.');
}
/* déplacer une entrée vers (tx,ty) : déplacement, fusion de piles ou échange */
function overlaps(x,y,w,h,skip){return S.bag.filter(e=>{ if(e===skip) return false; const [ew,eh]=SIZE(e.o); return x<e.x+ew&&e.x<x+w&&y<e.y+eh&&e.y<y+h })}
function moveEntry(i,tx,ty){
  const E=S.bag[i]; if(!E) return; const [w,h]=SIZE(E.o);
  if(tx===E.x&&ty===E.y) return;
  if(tx<0||ty<0||tx+w>GW||ty+h>GH){toast('Pas assez de place ici.');return}
  const ov=overlaps(tx,ty,w,h,E);
  if(!ov.length){E.x=tx;E.y=ty}
  else if(ov.length===1&&E.o.mat&&ov[0].o.mat===E.o.mat){
    const B=ov[0].o; if(B.n>=STACK){toast('Cette pile est pleine.');return}
    const m=Math.min(STACK-B.n,E.o.n); B.n+=m; E.o.n-=m; if(!E.o.n){S.bag.splice(i,1); if(UI.bagSel===E.o) UI.bagSel=B}
  }else if(ov.length===1){
    const B=ov[0],ox=E.x,oy=E.y,bx=B.x,by=B.y,[bw,bh]=SIZE(B.o);
    E.x=tx;E.y=ty;
    const rest=S.bag.filter(e=>e!==E&&e!==B);
    if(fitsAt(rest,tx,ty,w,h)&&fitsAt([...rest,E],ox,oy,bw,bh)){B.x=ox;B.y=oy}
    else{ const sp=fitsAt(rest,tx,ty,w,h)?findSpot([...rest,E],bw,bh):null;
      if(sp){B.x=sp[0];B.y=sp[1]} else {E.x=ox;E.y=oy;B.x=bx;B.y=by;toast('Pas assez de place pour échanger.');return} }
  }else{toast('Pas assez de place ici.');return}
  save(); render();
}
/* glisser-déposer (souris et tactile) entre l'inventaire et le mannequin */
let DRAG=null,noClick=false;
const dragItem=d=>d.src==='bag'?(S.bag[d.from]&&S.bag[d.from].o):d.src==='forge'?(findItem(d.from)||{}).it:S.heroes[0].equip[d.from];
function equipFromCell(i,slot){
  const h=S.heroes[0],E=S.bag[i],it=E&&E.o; if(!it||it.mat) return;
  if(slotType(slot)!==it.slot){toast('Cet objet ne va pas dans cet emplacement.');return}
  if(!canWear(it)){toast(`Réservé au ${CLASSES[it.cls].n}.`);return}
  const old=h.equip[slot];
  S.bag.splice(i,1);
  if(old){
    if(fitsAt(S.bag,E.x,E.y,...SIZE(old))) S.bag.push({x:E.x,y:E.y,o:old});
    else if(!bagAddItem(S.bag,old)){S.bag.splice(i,0,E);toast('Pas de place pour ranger l’objet porté.');return}
  }
  h.equip[slot]=it; if(UI.bagSel===it) UI.bagSel=null; save(); render();
}
function unequipTo(slot,tx,ty){
  const h=S.heroes[0],it=h.equip[slot]; if(!it) return; const [w,hh]=SIZE(it);
  if(tx!=null){
    const ov=overlaps(tx,ty,w,hh,null),inb=tx>=0&&ty>=0&&tx+w<=GW&&ty+hh<=GH;
    if(inb&&!ov.length){S.bag.push({x:tx,y:ty,o:it});delete h.equip[slot];save();render();return}
    if(inb&&ov.length===1&&!ov[0].o.mat&&ov[0].o.slot===it.slot&&canWear(ov[0].o)){
      const B=ov[0],rest=S.bag.filter(e=>e!==B);
      if(fitsAt(rest,tx,ty,w,hh)){S.bag=rest;S.bag.push({x:tx,y:ty,o:it});h.equip[slot]=B.o;save();render();return}
    }
  }
  if(!bagAddItem(S.bag,it)){toast('Inventaire plein.');return}
  delete h.equip[slot]; save(); render();
}
function gridCellAt(px,py){
  const b=$('#bag'); if(!b) return null; const r=b.getBoundingClientRect();
  if(px<r.left||px>r.right||py<r.top||py>r.bottom) return null;
  const pad=8,gap=3,cw=(r.width-2*pad-(GW-1)*gap)/GW;
  return [clamp(Math.floor((px-r.left-pad+gap/2)/(cw+gap)),0,GW-1),clamp(Math.floor((py-r.top-pad+gap/2)/(cw+gap)),0,GH-1)];
}
function showFoot(tx,ty,w,h,ok){
  let f=$('#foot'); const b=$('#bag'); if(!b) return;
  if(!f){f=document.createElement('div');f.id='foot';b.append(f)}
  const cx=clamp(tx,0,GW-1),cy=clamp(ty,0,GH-1),cw=Math.max(1,Math.min(w,GW-cx)),ch=Math.max(1,Math.min(h,GH-cy));
  f.style.gridColumn=`${cx+1}/span ${cw}`; f.style.gridRow=`${cy+1}/span ${ch}`; f.className=ok?'ok':'bad';
}
const hideFoot=()=>{const f=$('#foot'); if(f) f.remove()};

document.addEventListener('pointermove',e=>{
  if(!DRAG) return;
  if(!DRAG.on){
    if(Math.hypot(e.clientX-DRAG.x,e.clientY-DRAG.y)<6) return;
    DRAG.on=true; hideTip();
    const g=DRAG.el.cloneNode(true); g.id='ghost'; g.removeAttribute('data-act'); g.removeAttribute('data-tip'); g.classList.remove('sel');
    g.style.width=DRAG.el.offsetWidth+'px'; g.style.height=DRAG.el.offsetHeight+'px'; document.body.append(g); DRAG.ghost=g; DRAG.el.classList.add('drag');
    if(DRAG.src==='eq'||DRAG.src==='forge'){g.style.width='46px';g.style.height='46px';DRAG.gx=23;DRAG.gy=23}
    const it=dragItem(DRAG);
    if(DRAG.src==='bag'&&it&&!it.mat&&canWear(it)) document.querySelectorAll('#doll .dslot').forEach(d=>{if(slotType(d.dataset.slot)===it.slot)d.classList.add('fit')});
  }
  e.preventDefault();
  DRAG.ghost.style.left=(e.clientX-DRAG.gx)+'px'; DRAG.ghost.style.top=(e.clientY-DRAG.gy)+'px';
  const t=document.elementFromPoint(e.clientX,e.clientY),cell=t&&t.closest&&t.closest(DRAG.src==='forge'?'#fslot':'#doll .dslot, #fslot');
  const ok=cell&&cell!==DRAG.el?cell:null;
  if(DRAG.over&&DRAG.over!==ok) DRAG.over.classList.remove('over');
  if(ok) ok.classList.add('over');
  DRAG.over=ok; DRAG.tgt=null;
  const gc=!ok&&DRAG.src!=='forge'&&gridCellAt(e.clientX,e.clientY);
  if(gc){ const it=dragItem(DRAG),[w,h]=SIZE(it),tx=gc[0]-DRAG.off[0],ty=gc[1]-DRAG.off[1];
    const self=DRAG.src==='bag'?S.bag[DRAG.from]:null,inb=tx>=0&&ty>=0&&tx+w<=GW&&ty+h<=GH,ov=inb?overlaps(tx,ty,w,h,self):[];
    DRAG.tgt=[tx,ty]; showFoot(tx,ty,w,h,inb&&ov.length<=1) }
  else hideFoot();
},{passive:false});
function endDrag(e,drop){
  if(!DRAG) return; const d=DRAG; DRAG=null;
  if(!d.on) return;
  noClick=true; setTimeout(()=>{noClick=false},0);
  if(d.ghost) d.ghost.remove(); d.el.classList.remove('drag'); if(d.over) d.over.classList.remove('over'); hideFoot();
  document.querySelectorAll('#doll .fit').forEach(x=>x.classList.remove('fit'));
  if(!drop) return;
  if(d.src==='forge'){ if(!(d.over&&d.over.id==='fslot')){ UI.fItem=null; render(); toast('Objet retiré de l’enclume.') } return }
  if(!d.over&&d.tgt){ if(d.src==='bag') moveEntry(d.from,d.tgt[0],d.tgt[1]); else unequipTo(d.from,d.tgt[0],d.tgt[1]); return }
  if(!d.over) return;
  const o=d.over,toBag=false;
  if(o.id==='fslot'){const it=dragItem(d); if(it&&!it.mat){UI.fItem=it.id;UI.fMode='up';render()} else if(it) toast('Les matériaux ne peuvent pas être améliorés.'); return}
  if(d.src==='bag'){ equipFromCell(d.from,o.dataset.slot) }
  else{
    { const h=S.heroes[0],to=o.dataset.slot; if(slotType(to)!==slotType(d.from)) return; [h.equip[d.from],h.equip[to]]=[h.equip[to],h.equip[d.from]]; if(!h.equip[d.from])delete h.equip[d.from]; save(); render() }
  }
}

    ['Force','Dégâts du Guerrier.','Toutes les attaques et compétences du Guerrier se basent sur la Force. Le Sorcier n’a pas de Force.'],
    ['Intelligence','Dégâts du Sorcier.','Toutes les attaques, brûlures et barrières du Sorcier se basent sur l’Intelligence. Le Guerrier n’a pas d’Intelligence.'],
    ['Défense','Réduit les dégâts physiques reçus.','Dégâts reçus × K / (K + Défense), avec K = 100 + 15 × niveau de l’attaquant. La Défense protège donc moins contre les ennemis de haut niveau.'],
    ['Défense magique','Réduit les dégâts magiques reçus.','Même formule que la Défense, contre les ennemis qui utilisent la magie (chamans, nécromanciens, sorcières, mages de braise, oracles, Seigneur de Cendre).'],
    ['Points d’action (PA)','Énergie pour lancer les compétences.','5 PA de base pour chaque classe. Chaque compétence coûte des PA (l’attaque de base est gratuite, une fois par tour) et tous vos PA sont rechargés au début de chacun de vos tours. Vous pouvez enchaîner plusieurs actions dans le même tour tant qu’il vous reste des PA, puis appuyer sur « Fin de tour ». Barre jaune segmentée sous la barre de vie.'],
    ['Résistance physique','Réduit les dégâts physiques reçus en %.','S’applique après la Défense. Plafonnée à 75 %.'],
    ['Résistance magique','Réduit les dégâts magiques reçus en %.','S’applique après la Défense magique. Plafonnée à 75 %.'],
    ['Résistances élémentaires','Feu, Glace, Foudre, Terre.','Réduisent en % les dégâts des compétences de cet élément (brûlures comprises). Plafonnées à 75 %. Une résistance négative est une faiblesse : les dégâts sont augmentés.'],
    ['Vitesse','Ordre d’action.','À chaque tour, les unités agissent de la plus rapide à la plus lente.'],
    ['Critique','Chance de coup critique.','5 % de base, plafonnée à 70 %. Un coup critique multiplie les dégâts par les Dégâts critiques.'],
    ['Dégâts critiques','Puissance des critiques.','150 % de base, plafonnés à 200 % : un critique inflige de 1,5 à 2 fois les dégâts.'],
    ['Esquive','Chance d’éviter une attaque.','L’attaque est annulée entièrement. Plafonnée à 30 %.'],
    ['Vol de vie','Soin sur les dégâts infligés.','Rend ce pourcentage des dégâts infligés en PV. Plafonné à 20 %.'],
    ['Dégâts bonus','Augmente tous vos dégâts.','+X % appliqué après la réduction par la Défense ou la Résistance.'],
    ['PV %','Augmente vos PV max.','S’applique sur le total (base + équipement).'],
    ['Or trouvé','Plus d’or en fin de combat.','+X % d’or gagné après une victoire.'],
    ['Puissance','Score global.','Indicateur qui résume vos statistiques pour comparer deux équipements (▲ / ▼ dans les infobulles). Il n’a pas d’effet en combat.'],
  ]);
  const dmg=`<p>Pour chaque coup : <b>stat d’attaque × multiplicateur de la compétence × K / (K + Défense ou Résistance de la cible)</b>, puis :</p>
    <ul><li>× (1 + Dégâts bonus) ;</li><li>× (1 − Résistance physique ou magique de la cible) ;</li><li>× (1 − Résistance à l’élément de la compétence, si elle en a un) ;</li><li>× un tirage aléatoire entre 92 % et 108 % ;</li><li>× Dégâts critiques en cas de coup critique ;</li><li>minimum 1 dégât.</li></ul>
    <p>K vaut 100 + 15 × niveau de l’attaquant. Les boucliers absorbent les dégâts avant les PV. Une Esquive réussie annule le coup.</p>`;
  const aff=T(['Effet','Type','Fonctionnement'],[
    ['<span class="b-dot">Saignement</span>','Dégâts sur la durée','Inflige un pourcentage de la stat d’attaque du lanceur au début de chaque tour de la cible. Un nouveau Saignement remplace l’ancien.'],
    ['<span class="b-dot">Brûlure</span>','Dégâts sur la durée','Comme le Saignement. Appliquée par la Boule de feu ou par les ennemis de feu.'],
    ['<span class="b-dot">Poison</span>','Dégâts sur la durée','Comme le Saignement, souvent plus long (4 tours).'],
    ['<span class="b-stun">Étourdi</span>','Contrôle','La cible passe son prochain tour. Les boss n’ont que la moitié des chances d’être étourdis.'],
    ['<span class="b-stun">Paralysie</span>','Contrôle (2 tours)','À chaque tour, la cible a 50 % de chances de perdre son tour (plus avec le talent Choc nerveux). Les boss n’ont que la moitié des chances d’être paralysés.'],
    ['<span class="b-taunt">Provoque</span>','Contrôle','Les ennemis doivent attaquer l’unité qui provoque (Mur de boucliers du Guerrier).'],
    ['Bouclier','Protection','Absorbe des dégâts avant les PV, jusqu’à épuisement. Ne peut pas dépasser les PV max.'],
  ]);
  const buffs=T(['Effet','Valeur','Source'],[
    ['<span class="b-buff">FOR +X %</span>','+25 % (rang 1) pendant 3 tours','Cri de guerre (Guerrier) ; Hurlement des ennemis : +30 %.'],
    ['<span class="b-buff">FOR / INT +30 %</span>','3 tours','Potion de force ou d’intelligence.'],
    ['<span class="b-buff">DEF / RÉS +40 %</span>','3 tours','Potion de résistance.'],
    ['<span class="b-dot">DEF −30 %</span>','3 tours','Malédiction des sorcières et oracles (malus).'],
  ])+`<p class="hint">Les bonus et malus d’une même statistique s’additionnent, mais une statistique ne descend jamais sous 25 % de sa valeur. La durée diminue à la fin du tour de l’unité concernée. Les compétences gagnent +12 % d’efficacité par rang au-delà du premier.</p>`;
  const rage=T(['Mode','Monstres','Boss'],[
    ['Normal','Rage dès le tour 31 : +10 % de dégâts par tour','Pareil que les monstres'],
    ['Héroïque','Rage dès le tour 31','Rage dès le tour 11 : +8 % de dégâts par tour'],
    ['Mythique','Rage dès le tour 31','Rage dès le tour 9 : +8 % par tour, et la Frappe dévastatrice (230 % de dégâts)'],
  ]);
  const diff=T(['Mode','Niveau des monstres','Particularités','Récompenses'],[
    ['Normal','Zone × 10 + étape (1 à 50)','—','Normales'],
    ['Héroïque','50','Débloqué au niveau 50 du héros. Monstres et surtout boss bien plus forts','Boss : +50 % d’XP et d’or'],
    ['Mythique','60','Débloqué en atteignant le dernier boss héroïque','Or, XP et matériaux ×2 ; Prisme divin à 25 %'],
  ]);
  const pots=T(['Potion','Effet'],Object.values(POTS).map(p=>[p.n,p.d+(p.cls?` <small class="mute">(${CLASSES[p.cls].n})</small>`:'')]))
    +`<p class="hint">Les potions se boivent en combat (et pendant les 10 secondes de préparation) sans utiliser votre tour. Chaque potion a son propre temps de recharge : vie, résistance, force et intelligence 4 tours, action 6 tours. L’Élixir de savoir et le Philtre de fortune ne s’utilisent qu’une fois par combat.</p>`;
  const rar=T(['Rareté','Affixes','Multiplicateur de stats'],RAR.map((r,i)=>[`<span style="color:var(--r${i});font-weight:700">${r.n}</span>`,r.aff+(r.leg?' + pouvoir légendaire':'')+(r.max?' (au maximum de la plage)':''),'×'+String(r.m).replace('.',',')]))
    +`<p class="hint">Niveau d’objet : il augmente toutes les valeurs de l’objet. Chaque amélioration (+1 à +10) ajoute 5 % à toutes ses stats. Les armes donnent Force ou Intelligence, les armures de la vie, de la défense et de la résistance magique, les bijoux uniquement des affixes aléatoires.</p>`
    +T(['Affixe','Rareté','Chances (1er affixe, Guerrier)'],(()=>{const pool=affPool('guerrier'),tot=pool.reduce((x,a)=>x+a.w,0);return AFX.slice().sort((a,b)=>b.w-a.w).map(a=>[STAT_N[a.s]+(PCT.has(a.s)&&!/^r/.test(a.s)?' %':''),affTier(a.w),pool.includes(a)?r1(a.w/tot*100)+' %':'—'])})());
  const asc=`<p>L’ascension demande le niveau maximum (${MAXL}). Chaque étoile ajoute <b>+10 %</b> aux statistiques de base du héros (hors équipement). Palier n : ${fmt(5000)} × n or et 5 × n Prismes divins, jusqu’à 5 étoiles.</p>`;
  return `<h2 style="margin-bottom:4px">Aide</h2><p class="hint" style="margin-bottom:16px">Tout ce qu’il faut savoir sur les statistiques et les effets de combat. Cliquez sur une section pour l’ouvrir ou la fermer.</p>
    ${sec('Statistiques',stats,true)}${sec('Calcul des dégâts',dmg)}${sec('Afflictions et effets de contrôle',aff)}${sec('Bonus et malus',buffs)}
    ${sec('Rage des ennemis',rage)}${sec('Difficultés',diff)}${sec('Potions',pots)}${sec('Rareté et équipement',rar)}${sec('Ascension',asc)}`;
}

/* --- nouveautés --- */
const VERSION='0.3.1';
const PATCH=[
 {v:'0.3.1',t:"Raids, spécialisations et équilibrage",sec:[
  ["Compétences et spécialisations",["Nouveau système de compétences pour chaque classe : 3 compétences de base jusqu’au niveau 10, puis une spécialisation à choisir dans la fenêtre Personnage.","Chaque spécialisation a son propre arbre de talents (8 talents, actifs et passifs, reliés par des traits) : un talent se débloque quand le talent auquel il est relié est appris et que le niveau requis est atteint (10, 12, 15, 20, 25 et 30).","Le choix est définitif. La nouvelle Potion d’oubli (Marchand : 5 000 or et 5 Prismes divins) réinitialise toutes les compétences et la spécialisation, avec remboursement des points.","Compétences affichées sous forme d’icônes ; une infobulle détaille l’effet, le rang actuel, le rang suivant et les conditions. Cliquez sur une icône pour l’apprendre ou l’équiper. Les passifs sont ronds, les actives carrées.","Fiches de compétences plus lisibles : coût en PA, recharge, élément et cible en étiquettes, effets en paragraphes séparés et rang suivant à part.","Barre de sorts : jusqu’à 5 compétences actives (avant 3), à placer par glisser-déposer dans la fenêtre Personnage, et affichées en icônes avec le coût en PA et la recharge restante, dans les combats d’aventure, les duels et les raids.","Talents communs (dans chaque arbre, sans lien) : Guerrier — Puissance brute (+2 % Force, 5 rangs), Précision mortelle (+2 % critique, 3 rangs), Robustesse (+2 % PV, 5 rangs), Célérité (+2 % vitesse, 3 rangs), Peau d’acier (+2 % défense physique et magique, 3 rangs). Sorcier — Érudition (+2 % Intelligence, 5 rangs), Précision mortelle, Vitalité (+2 % PV), Célérité, Égide (mêmes valeurs).","Talent ultime dans chaque arbre (niveau 35, 20 points dépensés dans l’arbre requis) : Flamme intérieure (Feu), Cœur de l’orage (Foudre), Frénésie sanglante (Saignement), Rage indomptable (Barbarie).","Les talents qui modifient un effet ou une statistique ne sont plus reliés : Feu persistant, Plaies profondes, Choc nerveux, Vif-argent et Berserker se prennent librement (niveau requis conservé).","Points : un arbre complet demande 57 points (37 de spécialisation, 19 communs, 1 ultime) en plus des 15 points des compétences de base, alors qu’un héros niveau 50 n’en possède que 51 : il faut faire des choix.","Toutes les sauvegardes existantes : les compétences sont réinitialisées et tous les points de compétence sont remboursés."]],
  ["Personnage",["Nouvelle disposition : en haut, la présentation du personnage et ses statistiques à gauche, la roue d’équipement à droite, de la même taille ; en dessous, les compétences et talents.","Forge : l’inventaire n’est plus affiché dans l’onglet Forge ; glissez un objet depuis la fenêtre d’inventaire sur l’enclume (bouton « Ouvrir l’inventaire »). Glissez l’objet hors de l’enclume pour l’en retirer.","Inventaire dans une fenêtre que l’on peut déplacer : elle s’ouvre en cliquant sur un emplacement d’équipement ou avec la touche I, depuis n’importe quel onglet (sauf pendant un combat), et se ferme avec la croix, la touche I ou Échap. Boutons de tri et de destruction regroupés en haut, détails de l’objet sélectionné dans la fenêtre.","Nouvelle barre de sorts (5 emplacements) au-dessus des compétences : glissez-déposez une compétence active apprise dans un emplacement, déplacez-la d’un emplacement à l’autre pour changer l’ordre, ou glissez-la hors de la barre pour la retirer. L’ordre de la barre est celui des combats."]],
  ["Guerrier",["Compétences de base : Frappe puissante (niv. 1, 200 % FOR, 2 PA), Mur de boucliers (niv. 3, bouclier de 30 % des PV + provocation), Tourbillon (niv. 6, 130 % FOR sur tous les ennemis).","Spécialisation Saignement : Entaille (150 % FOR, 50 % de chances d’infliger Saignement : 40 % FOR par tour, 3 tours), Lames dentelées (+10 % de chances de Saignement avec Entaille par rang, jusqu’à 100 %), Hémorragie (+10 % de dégâts des Saignements et +1 % de vol de vie par rang), Éventration (160 % FOR, +60 % contre une cible qui saigne), Lacération (100 % FOR sur tous les ennemis, 60 % de chances de Saignement), Odeur du sang (+5 % de dégâts contre les cibles qui saignent et +3 % PV par rang), Plaies profondes (+1 tour de Saignement par rang, 2 rangs), Exsanguination (140 % FOR et détonation : 150 % des dégâts de Saignement restants infligés immédiatement).","Ultimes du Guerrier : Frénésie sanglante — chaque compétence qui touche une cible qui saigne octroie 1 charge de Soif ; à 5 charges, Frénésie : +20 % de dégâts et +6 % de vol de vie pendant 3 tours. Rage indomptable — chaque coup subi octroie 1 point de Rage ; à 5 points, Déchaînement : +20 % de dégâts et −15 % de dégâts subis pendant 3 tours.","Spécialisation Barbarie : Frappe sauvage (160 % FOR, +7 % de dégâts par tranche de 10 % de PV manquants), Fureur (+1,2 % de dégâts par tranche de 10 % de PV manquants par rang), Instinct de survie (−5 % de dégâts subis sous 35 % de PV et +3 % PV par rang), Pacte de sang (sacrifie 10 % des PV max, 210 % FOR, +5 % par tranche de 10 % de PV manquants), Cri de guerre (+25 % de Force pendant 3 tours), Carnage (115 % FOR sur tous les ennemis, +5 % par tranche de 10 % de PV manquants), Berserker (+4 % vitesse, +2 % critique et +1 % vol de vie par rang, 3 rangs), Folie meurtrière (200 % FOR, +8 % par tranche de 10 % de PV manquants, rend 15 % des dégâts en PV)."]],
  ["Sorcier",["Compétences de base : Projectile arcanique (niv. 1, 180 % INT, 2 PA), Barrière arcanique (niv. 3, bouclier de 220 % INT sur les alliés), Nova arcanique (niv. 6, 95 % INT sur tous les ennemis).","Spécialisation Feu : Immolation (150 % INT de feu, 50 % de chances d’infliger Brûlure : 40 % INT par tour, 3 tours), Embrasement (+10 % de chances de Brûlure avec Immolation par rang, jusqu’à 100 %), Chaleur intense (+10 % de dégâts des Brûlures et +3 % INT par rang), Combustion (80 % INT et détonation : 150 % des dégâts de Brûlure restants infligés immédiatement), Vague de flammes (100 % INT sur tous les ennemis, 50 % de chances de Brûlure), Pyromanie (+5 % de dégâts contre les cibles en feu et +1 % critique par rang), Feu persistant (+1 tour de Brûlure par rang, 2 rangs), Météore (220 % INT sur tous les ennemis, 60 % de chances de Brûlure).","Spécialisation Foudre : Arc électrique (180 % INT de foudre, 30 % de chances de paralyser 2 tours), Électricité statique (+7 % de chances de paralyser et +3 % INT par rang), Vif-argent (+4 % vitesse et +2 % critique par rang, 3 rangs), Éclair en chaîne (100 % INT sur tous les ennemis, 15 % de chances de paralyser), Choc nerveux (+10 % de chances qu’une cible paralysée perde son tour par rang, 3 rangs), Surtension (+8 % de dégâts contre les cibles paralysées et +1 % critique par rang), Tempête (140 % INT sur tous les ennemis, 20 % de chances de paralyser), Jugement de foudre (260 % INT, dégâts doublés contre une cible paralysée).","Ultimes du Sorcier : Flamme intérieure — chaque sort de feu lancé octroie 1 degré de Chauffe ; à 5 degrés, Surchauffe : +20 % de dégâts de feu pendant 3 tours. Cœur de l’orage — chaque sort de foudre lancé octroie 1 Charge ; à 5 Charges, Surcharge : +20 % de dégâts de foudre et +15 % de chances de paralyser pendant 3 tours.","Nouvel effet Paralysie (2 tours) : à chaque tour, la cible a 50 % de chances de perdre son tour (jusqu’à 80 % avec Choc nerveux). Les boss n’ont que la moitié des chances d’être paralysés."]],
  ["Raids",["Nouveau mode « ☠ Raid » dans l’onglet Aventure : combat coopératif à 2 joueurs contre un boss unique et très puissant.","Trois boss de raid : Colosse de Braise (niveau 25, niveau 20 requis), Wyrm des Glaces (niveau 40, niveau 35 requis) et Avatar de l’Abîme (niveau 50, niveau 50 requis).","Paliers : chaque victoire débloque le palier suivant (+1) pour ce boss. La difficulté est exponentielle : PV, attaque et défense du boss ×1,05 par palier (palier +10 : ×1,63 ; palier +20 : ×2,65). Le palier se choisit dans un menu déroulant avant le combat ; les deux joueurs doivent l’avoir débloqué.","Recherchez un partenaire (même boss, même palier) ou invitez un ami depuis la liste d’amis (nouveau bouton « Raid » sous « Duel »).","Le boss agit deux fois par tour et entre en rage au tour 16 (+8 % de dégâts par tour). Les héros étourdis passent leur tour automatiquement.","Récompenses (palier +0, multipliées par 1,05 par palier pour l’or) : Colosse 1 150 or, Wyrm 1 600 or, Avatar 1 900 or, plus 2 runes (+1 tous les 3 paliers), 6 essences et 6 cristaux (+1 par palier).","Un joueur inactif pendant 90 secondes peut voir son tour passé par son partenaire. Si un joueur abandonne, son partenaire peut continuer seul."]],
  ["Combat",["Les PA sont désormais entièrement rechargés au début de chaque tour (avant : +1 PA par tour), en aventure, en duel et en raid.","Chaque potion a désormais son propre temps de recharge (vie, résistance, force et intelligence : 4 tours ; action : 6 tours) : plusieurs potions différentes peuvent être bues dans le même tour.","Préparation de 10 secondes avant chaque combat (aventure, duel et raid) pour boire vos potions. En duel et en raid, les deux joueurs se préparent en même temps ; le combat commence dès que les deux sont prêts. Les combats enchaînés automatiquement n’ont pas de préparation.","Toutes les compétences des héros sont utilisables dès le premier tour ; leur recharge commence une fois lancées.","Les dégâts et les soins s’affichent sur la cible puis disparaissent lentement en fondu, en aventure comme en duel et en raid.","Infobulles sur les compétences et les potions pendant les combats (aventure, duel et raid) : coût, recharge, cible et effets.","Le bouton « Fuir » devient « Abandonner » (double clic pour confirmer) : l’abandon est compté comme une défaite. Même bouton en duel et en raid.","Chat de combat à droite de la scène, réservé aux deux joueurs du duel ou du raid."]],
  ["Marchand",["Nouvelle Potion d’action (70 or de base) : +2 PA (et +2 PA maximum) pendant 3 tours.","En aventure et en raid : utilisable à n’importe quel tour (et pendant la préparation), 6 tours de recharge.","En duel PvP : utilisable uniquement pendant la préparation ou à votre premier tour (ne coûte pas de PA).","Nouvelle Potion d’oubli : 5 000 or et 5 Prismes divins, réinitialise compétences et spécialisation."]],
  ["Équipement",["Nouvelle stat fixe sur les armures : Résistance magique. Guerrier (niveau 50, Épique) : heaume 4,3 %, cuirasse 6,7 %, jambières 5,1 %, bottes 3,4 %. Sorcier : capuche 6,1 %, robe 8,5 %, jambières 6,7 %, sandales 4,3 %. Les objets existants la reçoivent aussi.","Rareté des affixes : chaque affixe a désormais un poids de tirage. Très courants : PV, Force, Intelligence (16). Courants : Défense, Vitesse (9), résistances élémentaires (7). Peu courants : PV %, Résistance physique, Résistance magique, Or trouvé (5). Rares : Dégâts % (4), Critique, Dégâts critiques, Esquive (3). Très rare : Vol de vie (2).","Exemple pour le premier affixe d’un objet de Guerrier : PV ou Force ≈ 14 % chacun, Critique ≈ 2,7 %, Vol de vie ≈ 1,8 %. Le tableau complet est dans l’Aide (Rareté et équipement). Le remplacement d’affixe à la Forge suit les mêmes chances."]],
  ["Équilibrage : plafonds",["Chances de coup critique plafonnées à 70 % (base 5 %).","Dégâts critiques plafonnés à 200 % (base 150 %) : un critique inflige au maximum le double des dégâts."]],
  ["Équilibrage : affixes",["Valeurs maximales d’un affixe sur un objet Épique de niveau 50 (avant → après) :","PV : 205 → 168 (−18 %) · Force / Intelligence : 57 → 39 (−32 %) · Défense : 48 → 39 (−19 %) · Vitesse : 8,5 → 7,3 (−14 %).","PV % : 9,8 → 8,5 (−13 %) · Dégâts % : 11 → 7,9 (−28 %) · Critique : 6,7 → 5,5 % (−18 %) · Dégâts critiques : 37,8 → 9,8 % (−74 %, à cause du nouveau plafond).","Esquive : 3,9 → 3,4 % (−14 %) · Vol de vie : 2,5 → 2 % (−22 %). Résistances et Or trouvé : inchangés.","Objets existants : chaque affixe garde sa qualité de tirage (sa position entre le minimum et le maximum) dans la nouvelle plage. Les stats fixes des objets sont recalculées."]],
  ["Équilibrage : objets divins",["Les objets Divins n’ont plus de pouvoir passif et n’ont plus que 3 affixes aléatoires, mais toujours au maximum de leur plage (multiplicateur ×1,5 inchangé).","Les objets Divins existants sont convertis : pouvoir retiré, 3 premiers affixes conservés et portés à leur valeur maximale."]],
  ["Équilibrage : classes",["Guerrier : PV +13 par niveau (avant 14) ; Force +2,6 par niveau (avant 2,4).","Sorcier : PV de base 100 (avant 90), +13 par niveau (avant 10,5) ; Défense de base 6 (avant 5), +1,5 par niveau (avant 1).","Équipement du Sorcier plus résistant : Défense fixe des capuches, robes, sandales et jambières augmentée d’environ 20 à 25 %.","Simulations (équipement Légendaire +10, boss Mythique, 12 à 20 combats par spécialisation) : Barbarie ≈ 50 % de victoires, Saignement ≈ 25 à 40 %, Feu ≈ 30 %, Foudre ≈ 30 %. Barbarie a été réduite après les premiers essais (Fureur 2 → 1,2 %, Folie meurtrière 240 → 200 %, vol de vie 25 → 15 %, Pacte de sang 240 → 210 % et sacrifice 12 → 10 %) et Foudre renforcée (Arc électrique 160 → 180 %, Jugement de foudre 240 → 260 %, Surtension 6 → 8 %)."]],
  ["Équilibrage : ennemis",["Attaque des monstres +14 % environ à tous les niveaux (formule 7 + 2,9 × niv + 0,07 × niv²).","Normal : attaque des boss +15 %.","Héroïque : attaque des monstres ×2,6 (avant ×3,2), PV des boss ×1,6 (avant ×2), attaque des boss ×2,9 (avant ×3,8).","Mythique : attaque des monstres ×2,9 (avant ×3,6), PV des boss ×1,7 (avant ×2,4), attaque des boss ×2,2 (avant ×3,2).","Objectif (simulations avec un équipement du niveau du héros) : en Normal, les boss laissent environ 60 à 90 % des PV ; le Mythique demande un équipement Légendaire +10 et le boss Mythique reste réservé aux meilleurs (environ 1 victoire sur 2 en Guerrier, 1 sur 4 en Sorcier)."]],
  ["Aide et notes",["L’Aide indique les nouveaux plafonds, la recharge des PA et des potions.","Nouvelle mise en page des notes de mise à jour : titres centrés, plus grands et en gras.","Aide : nouvel effet Paralysie et tableau de rareté des affixes."]]
 ]},
 {v:'0.3.0',t:"Combat 2.0 - Stat - PVP",sec:[
  ["Duels PvP",["Nouveau mode « Duel PvP » dans l’onglet Aventure : recherchez un adversaire parmi les joueurs connectés.","Une confirmation s’affiche quand un adversaire est trouvé. Le duel se joue au tour par tour dans une fenêtre au centre de l’écran : PV, PA, compétences et potions des deux joueurs.","À la fin, le nom du vainqueur s’affiche puis un butin de 500 or récompense la victoire.","Défiez directement un ami : cliquez sur son nom dans la liste d’amis, puis sur « Duel ».","Un joueur qui ne joue pas pendant 90 secondes peut être déclaré perdant ; bouton « Abandonner » disponible."]],
  ["Combat",["Points d’action (PA) : 5 de base pour chaque classe. Les compétences coûtent des PA, l’attaque de base est gratuite mais utilisable une seule fois par tour, et chaque unité récupère 1 PA au début de son tour.","Votre héros peut enchaîner plusieurs actions dans le même tour tant qu’il lui reste des PA ; nouveau bouton « Fin de tour ».","Barre de PA segmentée sous la barre de vie de chaque combattant ; le coût en PA est affiché sur chaque compétence.","Nouvelles statistiques : Résistance physique, Résistance magique et résistances au Feu, à la Glace, à la Foudre et à la Terre (en %, plafonnées à 75 %). L’ancienne Résistance devient « Défense magique ».","Compétences élémentaires : Boule de feu (Feu), Éclair en chaîne (Foudre), Météore (Terre) ; côté ennemis, Trait de feu, Crachat toxique et Déferlante. Certains monstres résistent à un élément, d’autres y sont faibles.","Nouveaux affixes de résistance sur l’équipement."]],
  ["Forge",["Nouvelles chances de rareté : Forge ordinaire 80 % Commun / 20 % Magique ; Forge fine 40 % Commun / 50 % Magique / 10 % Rare ; Forge de maître 10 % Magique / 45 % Rare / 45 % Épique ; Forge légendaire 20 % Rare / 70 % Épique / 10 % Légendaire.","Affixes aléatoires : Commun 0, Magique 1, Rare 2, Épique 3, Légendaire 3 + un pouvoir légendaire.","Pouvoir légendaire (écrit en orange) : +6 % de chances de coup critique et +10 % de dégâts critiques. Un pouvoir nommé pour chaque type d’équipement ; les objets légendaires existants le reçoivent aussi."]],
  ["Personnage",["Caractéristiques regroupées en trois catégories : Principale, Secondaire et Résistance. « Défense » devient « Défense physique ».","Les valeurs affichées sont les totaux (base + équipement) ; un bouton affiche le détail entre parenthèses (base + équipement).","« Or trouvé » et « Dégâts bonus » ne sont plus affichés dans la fiche."]],
  ["Amis",["Amis classés en deux catégories : En ligne et Hors ligne.","Chat entre amis : cliquez sur le nom d’un ami puis sur « Chat ». Une pastille rouge signale un nouveau message sur le bouton Amis et sur l’ami concerné."]]
 ]},
 {v:'0.1.1',t:"Fiche de personnage",sec:[
  ["Amis",["Nouveau système d’amis : liste fixée en bas à droite de l’écran, avec le nombre d’amis connectés.","Ajoutez un joueur avec son nom de compte ; il accepte ou refuse la demande. Vous voyez si vos amis sont en ligne et quel personnage ils jouent.","Nom de compte : à la première connexion, chaque joueur choisit un nom unique, commun à tous ses personnages."]],
  ["Personnage",["Les onglets Personnage et Inventaire sont fusionnés dans l’onglet Personnage.","En haut : l’équipement (roue) à gauche et la présentation du héros à droite (portrait, niveau, statistiques avec le bonus d’équipement en vert, ascension).","En dessous : l’inventaire, puis les compétences. La zone de détails s’affiche sous l’équipement quand un objet est sélectionné.","La roue d’équipement est agrandie et occupe toute la hauteur de la présentation du héros."]]
 ]},
 {v:'0.0.9',t:'Entrepôts et débogage',sec:[
  ['Compte',['Connexion par e-mail et mot de passe, ou avec Google (création de compte et mot de passe oublié).','Sauvegarde en ligne : vos personnages et l’or partagé sont liés à votre compte et synchronisés automatiquement entre vos appareils.','« Jouer sans compte » garde la sauvegarde sur l’appareil. À la première connexion, la partie de l’appareil devient celle du compte.','Le compte connecté et un bouton « Se déconnecter » sont affichés en haut à droite du menu.']],
  ['Collecte',['Entrepôt : chaque rang augmente de 100 le stock maximum (affiché en haut de la page) des ressources produites par la zone. Grand entrepôt double ce bonus (+2 000 au maximum).','Les zones ne gardent plus de récoltes en réserve : quand la jauge est pleine, il faut collecter.','En haut de l’arbre de talents, la case « Réserve » est remplacée par « Stock maximum ».']],
  ['Débogage',['Nouvelle section Débogage dans les Options : composants à 0 ou au maximum, or, niveaux et points de compétence, objets divins ou légendaires, inventaire, Aventure, récoltes prêtes, arbres de talents, et remise à zéro complète de la progression du personnage.','Réglages : « Aucun coût » (forge, améliorations, arbres, zones, achats) et « Récoltes accélérées » (une récolte toutes les 5 secondes).']],
 ]},
 {v:'0.0.8',t:'Arbre de collecte',sec:[
  ['Menu',['Le bouton « Menu » en jeu ouvre un menu déroulant : Options, Nouveautés et Changer de personnage.','Options et Nouveautés s’ouvrent depuis la partie, avec un bouton « Retour au jeu ».','« Changer de personnage » demande une confirmation, puis ouvre l’écran de choix des personnages.']],
  ['Collecte',['Les niveaux de zone sont remplacés par un arbre d’améliorations : bouton flèche en haut à droite de chaque zone.','Branches de 10 rangs payés en or : Cadence (+5 % de vitesse par rang), Entrepôt (+1 récolte en réserve) et une branche par ressource de la zone (+15 % de cette ressource par récolte). Chaque branche complète débloque un talent étoilé : +25 % de vitesse, réserve ×2, ou 10 % de chances de doubler cette ressource (Filon de fer, Veine d’or, Clairière fertile, Grand gibier, Géode, Source vive, Glyphe ancien).','L’or dépensé dans les anciens niveaux de zone est remboursé.','Nouvelle mise en page des zones : nom centré en haut, bouton Collecter centré.']],
  ['Équilibrage',['Les branches de ressource donnent maintenant +15 % par rang (+150 % au maximum).','Stock maximum réduit à 1 000 par matériau (au lieu de 10 000).','Coûts de la Forge revus à la baisse : Forge ordinaire ~19 fer et 10 cuirs, Forge légendaire ~115 fer, 56 cuirs, 46 cristaux, 20 essences et 8 runes.','Améliorer, relancer et remplacer une affixe coûtent moins de matériaux (l’or ne change pas).']],
  ['Récoltes',['Les zones ne produisent plus en continu : elles livrent une récolte toutes les 5 minutes (barre et compte à rebours sur chaque zone).','La Forêt ne donne plus de cristaux, les Ruines plus d’essence, et le Marais ne garde que l’essence et les runes.','Récolte de base : 15 fer et 15 or à la Mine ; 9 herbes et 9 cuirs à la Forêt ; 15 cristaux et 1 rune aux Ruines ; 6 essences et 1 rune au Marais.','La branche Cadence réduit le temps entre deux récoltes (jusqu’à environ 2 min 50 avec le talent étoilé).','Chaque zone affiche la quantité de chaque récolte et une grande jauge avec le temps restant ; les jauges de stock par ressource sont retirées.','Quand la jauge est pleine, la zone attend : il faut appuyer sur « Collecter » pour récupérer la récolte et relancer la jauge. La branche Entrepôt permet de garder des récoltes en réserve (+1 par rang, ×2 avec Grand entrepôt).','Niveau de zone : chaque amélioration achetée dans l’arbre augmente le niveau de la zone de 1.','Récolte automatique : se débloque dans l’arbre à partir du niveau de zone 25, puis s’active avec l’engrenage en haut à gauche de la zone (menu déroulant).','Les icônes des ressources de chaque zone sont affichées en bas à gauche.','Les boutons « Collecte auto » et « Tout collecter » sont retirés ; les titres Collecte, Forge et Marchand sont centrés et en gras.','Un point rouge sur l’onglet Collecte signale une récolte prête.']]
 ]},
 {v:'0.0.7',t:'L’Enclume',sec:[
  ['Menu du jeu',['Nouvel écran d’accueil au centre de l’écran : Jouer, Options et Nouveautés.','En jeu, le bouton « Menu » en haut à droite ramène à l’écran d’accueil après une fenêtre de confirmation (Oui / Non). La partie est sauvegardée.','Un point rouge sur « Nouveautés » (et sur le bouton « Menu » en jeu) signale une nouvelle version.','Les Options (sauvegarde) et les Nouveautés sont maintenant accessibles depuis le menu.']],
  ['Personnages',['Jusqu’à 5 personnages, de n’importe quelle classe. « Jouer » ouvre l’écran de choix : jouer, créer ou supprimer un personnage.','Seul l’or est partagé entre les personnages. Inventaire, équipement, matériaux, collecte et progression sont propres à chacun.','Votre partie actuelle devient automatiquement le personnage 1. L’export de sauvegarde contient tous les personnages.']],
  ['Forge',['Forge redessinée (style « Enclume ») : liste des objets à gauche, enclume lumineuse au centre avec le type de forge et le bouton Forger, chances de rareté en barres, coût et dernière création à droite. En Amélioration : roue d’équipement à gauche, objet posé sur l’enclume au centre, actions à droite.']],
  ['Aventure',['Le mode Héroïque demande maintenant d’atteindre le niveau 50. En dessous, le bouton est verrouillé (le mode Mythique aussi).']],
  ['Inventaire',['Zone de détails de retour dans l’Inventaire et la Forge : elle s’affiche uniquement quand un objet est sélectionné, avec ses boutons (équiper, améliorer, détruire…). Sur téléphone, elle apparaît juste sous la grille ou sous le mannequin, et les plages des affixes y sont toujours affichées.','Dans l’Inventaire, la zone de détails est alignée avec la zone du personnage.']]

 {v:'0.0.6',t:'Cercle runique',sec:[

  ['Forge',['En mode Amélioration, la roue d’équipement s’affiche à gauche : cliquez, glissez ou faites un clic droit sur un emplacement pour améliorer l’objet porté.','Les jambières de soie et de plaque s’appellent désormais simplement « Jambières ».']],
  ['Inventaire',['Nouveau mannequin « cercle runique » pour les deux classes : portrait de la classe au centre, entouré d’anneaux dorés et de runes.','Les 8 emplacements sont disposés en cercle autour du portrait ; les emplacements occupés prennent la couleur de la rareté de l’objet.','Fond de la roue d’équipement éclairci, dans toutes les sections.','Grille réduite à 14 × 5 cases (70 cases). Les objets hors de la nouvelle grille sont replacés automatiquement, ou vendus s’il n’y a plus de place.','En-tête allégé : seul le nom du héros reste, agrandi et en gras, au-dessus du mannequin.','Infobulles d’équipement : maintenez Maj (Shift) pour afficher entre parenthèses grises la plage possible de chaque affixe.']]
 ]},

 {v:'0.0.4',t:'Héroïque et Marchand',sec:[

function viewNews(){
  return `<div class="scrhead" style="margin-bottom:4px"><h2>Nouveautés</h2>${backBtn()}</div><p class="hint" style="margin-bottom:18px">Journal des modifications de Cendrelame.</p>`+
    PATCH.map((p,i)=>`<section class="pn"><h3>Version ${p.v}${i===0?'<span class="tagv">Actuelle</span>':''}</h3><small class="mute">${esc(p.t)}</small>
      ${p.sec.map(([h,l])=>`<h4>${esc(h)}</h4><ul>${l.map(x=>`<li>${esc(x)}</li>`).join('')}</ul>`).join('')}</section>`).join('');
}

/* --- sauvegarde --- */
function accExport(){
  if(S&&S.heroes&&S.heroes.length&&ACC.cur!=null&&!UI.scr) save();
  const chars=Array.from({length:MAXCH},(_,i)=>charRaw(i));
  return btoa(unescape(encodeURIComponent(JSON.stringify({acc:1,gold:ACC.gold,seenVer:ACC.seenVer,chars}))));
}
function viewOpts(){
  return `<div class="scrhead"><h2>Options</h2>${backBtn()}</div>
    <h3 style="margin-bottom:10px">Sauvegarde</h3><div class="grid g2"><section class="panel"><h2>Exporter</h2><p class="hint" style="margin-bottom:8px">La partie (tous vos personnages et l’or partagé) est enregistrée dans ce navigateur. Copiez ce code pour la garder ailleurs ou la transférer sur un autre appareil.</p>
      <textarea id="expTxt" readonly>${accExport()}</textarea><div class="row" style="margin-top:8px"><button class="btn" data-act="copyExp">Copier</button></div></section>
    <section class="panel"><h2>Importer</h2><p class="hint" style="margin-bottom:8px">Collez un code exporté. Un code complet remplace tous vos personnages ; un ancien code à un seul héros est ajouté dans un emplacement libre.</p>
      <textarea id="impTxt" placeholder="Code de sauvegarde"></textarea><div class="row" style="margin-top:8px"><button class="btn" data-act="import">Importer</button></div></section>
    <section class="panel"><h2>Tout effacer</h2><p class="hint" style="margin-bottom:8px">Efface définitivement tous les personnages, leurs objets, leur progression et l’or.</p>
      ${UI.confirm==='reset'?`<div class="row"><button class="btn danger" data-act="reset">Oui, tout effacer</button><button class="btn" data-act="cancelReset">Annuler</button></div>`:`<button class="btn danger" data-act="reset">Recommencer à zéro</button>`}</section></div>
    ${adminPanel()}${dbgPanel()}`;
}
function adminPanel(){
  if(!FB.user) return '';
  return `<h3 style="margin:22px 0 4px">Administration</h3><section class="panel"><p class="hint" style="margin-bottom:8px">Identifiant de votre compte (UID) : <code class="uid">${esc(FB.user.uid)}</code> <button class="btn sm" data-act="copyUid">Copier</button></p>${FB.admin?'<button class="btn pri" data-act="scr" data-s="best">Ouvrir le Bestiaire</button> <small class="mute">Réglez les statistiques et les compétences des ennemis pour tous les joueurs.</small>':'<p class="hint" style="margin:0">Le Bestiaire est réservé aux administrateurs.</p>'}</section>`;
}
function dbgPanel(){
  const ok=S&&S.heroes&&S.heroes.length,d=DBG(),h=ok&&S.heroes[0];
  const B=(k,t,cls='')=>`<button class="btn sm ${cls}" data-act="dbg" data-k="${k}" ${ok?'':'disabled'}>${t}</button>`;
  const T=(k,t,on)=>`<label class="optrow dbgt"><input type="checkbox" data-act="dbgT" data-k="${k}" ${on?'checked':''}> ${t}</label>`;
  const rp=UI.confirm==='dbgReset'?`${B('resetChar','Oui, tout remettre à zéro','danger')}<button class="btn sm" data-act="cancelReset">Annuler</button>`:B('resetChar','Remettre à zéro la progression du personnage','danger');
  return `<h3 style="margin:22px 0 4px">Débogage</h3><p class="hint" style="margin-bottom:10px">${ok?`Les actions s’appliquent au personnage chargé : <b>${esc(h.name)}</b> (${CLASSES[h.cls].n}, niveau ${h.lvl}).`:'Chargez un personnage (Jouer) pour utiliser les actions de débogage.'} Les réglages cochés s’appliquent à tous les personnages.</p>
    <div class="grid g2 dbg">
      <section class="panel"><h2>Réglages</h2>${T('free','Aucun coût : forge, améliorations, arbres de talents, ouverture des zones et achats',d.free)}${T('fast','Récoltes accélérées (×60 : une récolte toutes les 5 secondes)',d.fast)}</section>
      <section class="panel"><h2>Ressources</h2><div class="row">${B('mats0','Composants à 0')}${B('matsMax','Composants au maximum')}${B('mats100','+100 de chaque composant')}${B('prism','+5 Prismes divins')}</div>
        <div class="row" style="margin-top:8px">${B('gold0','Or à 0')}${B('gold10k','+10 000 or')}${B('gold1m','+1 000 000 or')}</div></section>
      <section class="panel"><h2>Héros</h2><div class="row">${B('lvlUp','+1 niveau')}${B('lvl10','+10 niveaux')}${B('lvlMax','Niveau maximum')}${B('lvl1','Retour au niveau 1')}${B('sp5','+5 points de compétence')}</div>
        <div class="row" style="margin-top:8px">${B('unequip','Retirer tout l’équipement')}${B('advAll','Débloquer toute l’Aventure')}${B('advReset','Remettre l’Aventure à zéro')}</div></section>
      <section class="panel"><h2>Inventaire et forge</h2><div class="row">${B('itemRand','Objet divin aléatoire')}${B('itemSet','Équipement légendaire complet')}${B('bagClear','Vider l’inventaire')}</div></section>
      <section class="panel"><h2>Collecte</h2><div class="row">${B('harvest','Récoltes prêtes partout')}${B('zonesOpen','Ouvrir toutes les zones')}${B('treeMax','Arbres au maximum')}${B('treeReset','Arbres à zéro')}</div></section>
      <section class="panel"><h2>Divers</h2><div class="row">${B('news','Revoir le point « Nouveautés »')}</div><div class="row" style="margin-top:10px">${rp}</div>
        ${UI.confirm==='dbgReset'?'<p class="hint" style="color:var(--blood);margin-top:6px">Niveau, compétences, équipement, inventaire, matériaux, collecte et Aventure seront remis à zéro. Le nom, la classe et l’or partagé sont conservés.</p>':''}</section>
    </div>`;
}


/* ============ Bestiaire (réglages des ennemis, publiés par l’administrateur) ============ */
