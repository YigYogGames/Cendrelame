<!doctype html><html><head><meta charset=utf8><meta name=viewport content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{color-scheme:light;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}html{scroll-padding-top:env(safe-area-inset-top,0px)}body{margin:0;padding:0;font:14px -apple-system,BlinkMacSystemFont,sans-serif;background:#fff;color:#000}img{max-width:100%}[hidden]:not([hidden=until-found i]){display:none!important}</style></head><body>
<title>Cendrelame</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Alegreya+Sans:wght@400;500;700&family=IM+Fell+English+SC&display=swap">
<style>
/* Concept : un bureau de cuir brun, une grande feuille de parchemin au centre, encre brune et sceau de cire rouge pour l'action principale. */
:root{
  --bg:#2b1c12; --gold:#e8c982; --stitch:#7a5d33;
  --paper:#e2d0a8; --bg2:#d8c496; --bg3:#cab283; --line:#a88d5b; --line2:#85693c;
  --fg:#2c2015; --mute:#68523a;
  --brass:#7b2a1a; --brass-d:#a35a3a; --verd:#4b7a38; --blood:#a5351f; --ok:#3d7a34;
  --r0:#5b5b55; --r1:#174f94; --r2:#6e5000; --r3:#6a2f9e; --r4:#8f3303;
  --display:'IM Fell English SC',Georgia,serif;
  --body:'Alegreya Sans','Trebuchet MS',sans-serif;
}
*{box-sizing:border-box}
html{background:var(--bg)}
body{
  margin:0; background-color:var(--bg); color:#f1e2bd; font:16px/1.45 var(--body);
  background-image:radial-gradient(900px 420px at 50% -100px,#573b25 0%,transparent 70%),
    repeating-linear-gradient(45deg,rgba(0,0,0,.07) 0 1px,transparent 1px 4px),
    repeating-linear-gradient(-45deg,rgba(255,255,255,.025) 0 1px,transparent 1px 5px);
  padding-block:0 48px;
  padding-left:max(16px,env(safe-area-inset-left,0px));
  padding-right:max(16px,env(safe-area-inset-right,0px));
  min-height:100%;
}
button,input,select,textarea{font:inherit;color:inherit}
.wrap{max-width:1140px;margin:0 auto}
h1,h2,h3{font-family:var(--display);font-weight:400;letter-spacing:.04em;margin:0;text-wrap:balance}
h2{font-size:1.35rem;color:var(--brass)}
h3{font-size:1.05rem;color:var(--fg)}
small,.mute{color:var(--mute)}
.num{font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
.mi{width:1.2em;height:1.2em;flex:none;vertical-align:-.25em}

/* en-tête sur le cuir */
.byline{position:absolute;top:calc(6px + env(safe-area-inset-top,0px));left:max(10px,env(safe-area-inset-left,0px));font-size:.68rem;letter-spacing:.06em;color:#b8935a;opacity:.85;pointer-events:none}
.gear{position:absolute;top:calc(8px + env(safe-area-inset-top,0px));right:max(10px,env(safe-area-inset-right,0px));width:38px;height:38px;display:grid;place-items:center;padding:0;border-radius:50%;border:1px solid #5c4228;background:#0003;color:#c9ae82;cursor:pointer;z-index:5}
.gear svg{width:22px;height:22px;fill:currentColor;transition:transform .4s}
.gear:hover{color:var(--gold)}.gear:hover svg{transform:rotate(60deg)}
.gear.on{color:var(--gold);border-color:var(--gold)}
.tabs button{position:relative}
.ndot{position:absolute;top:7px;right:5px;width:9px;height:9px;border-radius:50%;background:#e0412a;box-shadow:0 0 0 2px #2b1c12,0 0 6px #e0412a}
.hero-grid{grid-template-columns:minmax(0,340px) minmax(0,1fr);align-items:start}
@media (max-width:820px){.hero-grid{grid-template-columns:minmax(0,1fr)}}
.top{display:flex;flex-direction:column;align-items:center;gap:12px;padding-block:26px 14px}
.brand{display:flex;align-items:center;gap:20px;font-family:var(--display);font-size:clamp(2.1rem,7vw,3rem);letter-spacing:.1em;color:var(--gold);line-height:1;text-shadow:0 2px 0 #140b05,0 0 18px #0006}
.brand::before,.brand::after{content:"";width:clamp(24px,10vw,120px);height:1px;background:linear-gradient(90deg,transparent,#b8935a)}
.brand::after{transform:scaleX(-1)}
.res{display:flex;flex-wrap:wrap;justify-content:center;gap:8px}
.rs{display:inline-flex;align-items:center;gap:6px;font-variant-numeric:tabular-nums;font-weight:700;color:#f1e2bd;background:#0003;border:1px solid #5c4228;border-radius:99px;padding:3px 12px 3px 6px}
.rs .mi{width:22px;height:22px;vertical-align:0}
.tabs{display:flex;gap:4px;overflow-x:auto;border-bottom:1px solid #6b4c2c;margin-bottom:18px;scrollbar-width:thin}
.tabs button:first-child{margin-left:auto}
.tabs button:last-child{margin-right:auto}
.tabs button{background:none;border:0;border-bottom:2px solid transparent;padding:10px 16px;cursor:pointer;color:#c9ae82;font-weight:500;white-space:nowrap;letter-spacing:.03em}
.tabs button:hover{color:#f5e3b5}
.tabs button[aria-selected=true]{color:var(--gold);border-bottom-color:var(--gold)}
:focus-visible{outline:2px solid var(--brass);outline-offset:2px}
.tabs :focus-visible{outline-color:var(--gold)}

/* feuille de parchemin */
#view{
  color:var(--fg); background-color:var(--paper);
  background-image:radial-gradient(600px 300px at 20% 0%,#ede0bd55,transparent 70%),radial-gradient(500px 260px at 90% 100%,#c9ac7455,transparent 70%);
  border:1px solid #1d1209; border-radius:3px; padding:clamp(14px,3vw,26px);
  box-shadow:inset 0 0 80px #7a521f66,inset 0 0 0 1px #f4e8c855,0 14px 34px #0009;
  outline:1px dashed var(--stitch); outline-offset:-7px; min-height:60vh;
}

/* generic */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:16px;min-width:0;box-shadow:inset 0 0 26px #9a6a2a22}
.panel>h2,.panel>h3{margin-bottom:10px}
.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.btn{background:var(--bg3);border:1px solid var(--line2);border-radius:3px;padding:7px 13px;cursor:pointer;font-weight:500;color:var(--fg)}
.btn:hover:not(:disabled){border-color:var(--brass);color:var(--brass)}
.btn:disabled{opacity:.45;cursor:not-allowed}
.btn.pri{background:var(--brass);color:#f7e9c6;border-color:#4a180e;font-weight:700;box-shadow:inset 0 1px 0 #ffffff26}
.btn.pri:hover:not(:disabled){background:#93331f;color:#fff3d6}
.btn.sm{padding:3px 9px;font-size:.88rem}
.btn.danger:hover:not(:disabled){border-color:var(--blood);color:var(--blood)}
.chip{background:none;border:1px solid var(--line2);border-radius:99px;padding:4px 12px;cursor:pointer;color:var(--mute);font-size:.92rem}
.chip:hover:not(:disabled){color:var(--fg)}
.chip.on{border-color:var(--brass);color:var(--brass);background:#7b2a1a12;font-weight:700}
.chip:disabled{opacity:.4;cursor:not-allowed}
.bar{height:8px;background:#4b3826;border:1px solid var(--line2);border-radius:2px;overflow:hidden}
.bar i{display:block;height:100%;background:var(--verd)}
.bar.xp i{background:#c0902a}
.cost{display:inline-flex;flex-wrap:wrap;gap:2px 12px;font-size:.92rem}
.cost>span{display:inline-flex;align-items:center;gap:4px}
.cost .mi{width:1.15em;height:1.15em;vertical-align:0}
.cost span.no{color:var(--blood);font-weight:700}
.cost span.ok{color:var(--mute)}
.mc{display:inline-flex;align-items:center;gap:3px;margin-left:10px;font-weight:700}
.mc .mi{vertical-align:0}
.hint{color:var(--mute);font-size:.92rem;margin:0}
.sep{height:1px;background:var(--line);margin:12px 0}
.tile{display:inline-grid;place-items:center;width:44px;height:44px;flex:none;border:1px solid hsl(var(--h,30) 40% 22%);background:hsl(var(--h,30) 30% 26%);color:hsl(var(--h,30) 70% 82%);border-radius:3px}
.tile svg{width:26px;height:26px;fill:currentColor}
.tile.lg{width:64px;height:64px}.tile.lg svg{width:38px;height:38px}

/* items */
.itgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,230px),1fr))}
.it{border:1px solid var(--rc);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 14%,var(--bg2)),var(--bg2) 62%);border-radius:3px;padding:10px 12px;display:flex;flex-direction:column;gap:6px;min-width:0;box-shadow:0 0 12px -7px var(--rc)}
.it header b{color:var(--rc);font-family:var(--display);font-weight:400;font-size:1.08rem;letter-spacing:.03em}
.it header em{color:var(--brass);font-style:normal;font-weight:700}
.it header small{display:block}
.it ul{list-style:none;margin:0;padding:0;font-size:.95rem}
.it li.imp{color:var(--mute)}
.it .foot{display:flex;flex-wrap:wrap;gap:6px;margin-top:auto;padding-top:4px}
.dl{font-size:.85rem;font-weight:700}
.dl.up{color:var(--ok)}.dl.dn{color:var(--blood)}
.slotrow{display:flex;gap:10px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line)}
.slotrow:last-child{border:0}
.slotrow .lbl{width:84px;flex:none;color:var(--mute);font-size:.84rem;text-transform:uppercase;letter-spacing:.08em}
.slotrow .nm{flex:1;min-width:0;overflow-wrap:anywhere}

/* hero */
.stats{display:grid;grid-template-columns:1fr auto;gap:2px 16px;font-size:.96rem;margin:0}
.stats dt{color:var(--mute)}.stats dd{margin:0;text-align:right;font-variant-numeric:tabular-nums}
.hchips{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:14px}
.hchip{display:flex;align-items:center;gap:8px;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:6px 12px 6px 6px;cursor:pointer;text-align:left}
.hchip.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.hchip .tile{width:34px;height:34px}.hchip .tile svg{width:20px;height:20px}
.hchip b{display:block;line-height:1.1}
.sk{border:1px solid var(--line);border-radius:3px;padding:10px;display:flex;flex-direction:column;gap:5px;background:#e8d9b533}
.sk.lock{opacity:.55}
.sk.eq{border-color:var(--verd);box-shadow:0 0 0 1px var(--verd)}
.sk p{margin:0;font-size:.92rem;color:var(--mute)}
.pips{display:inline-flex;gap:3px;margin-left:6px;vertical-align:middle}
.pips i{width:8px;height:8px;border:1px solid var(--line2);transform:rotate(45deg)}
.pips i.on{background:var(--brass);border-color:var(--brass)}
.tag{font-size:.74rem;text-transform:uppercase;letter-spacing:.1em;color:var(--verd);font-weight:700}
.tag.p{color:var(--brass)}

/* creator */
.classes{display:grid;gap:12px;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr))}
.cls{background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:14px;text-align:left;cursor:pointer;display:flex;flex-direction:column;gap:8px}
.cls:hover{border-color:var(--line2)}
.cls.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass)}
.cls p{margin:0;font-size:.93rem;color:var(--mute)}
.hues{display:flex;gap:8px}
.hues button{width:28px;height:28px;border-radius:50%;border:2px solid transparent;cursor:pointer;background:hsl(var(--h) 45% 38%)}
.hues button.on{border-color:var(--fg)}
input[type=text]{background:#efe2c4;border:1px solid var(--line2);border-radius:3px;padding:8px 10px;width:100%;max-width:340px}
textarea{width:100%;min-height:96px;background:#efe2c4;border:1px solid var(--line2);border-radius:3px;padding:8px;font:12px/1.35 ui-monospace,monospace}
select{background:#efe2c4;border:1px solid var(--line2);border-radius:3px;padding:7px 8px;max-width:100%}
input[type=range]{accent-color:var(--brass);width:min(100%,320px)}
input[type=checkbox]{accent-color:var(--brass)}
.hero-intro{max-width:620px;margin:6px 0 22px}
.hero-intro h1{font-size:2.3rem;color:var(--brass);margin-bottom:8px}

/* combat */
.stages{display:grid;grid-template-columns:repeat(auto-fit,minmax(44px,1fr));gap:6px;max-width:560px}
.stg{background:var(--bg3);border:1px solid var(--line2);border-radius:3px;padding:8px 0;cursor:pointer;text-align:center;font-variant-numeric:tabular-nums}
.stg.on{border-color:var(--brass);color:var(--brass);box-shadow:0 0 0 1px var(--brass);font-weight:700}
.stg.done{border-color:var(--verd)}
.stg.boss{font-family:var(--display)}
.stg:disabled{opacity:.35;cursor:not-allowed}
.arena{display:grid;gap:14px}
.side{display:grid;gap:10px;grid-template-columns:repeat(auto-fit,minmax(min(100%,190px),1fr))}
.unit{position:relative;background:var(--bg2);border:1px solid var(--line);border-radius:4px;padding:10px;display:flex;flex-direction:column;gap:7px;min-width:0;transition:opacity .4s,border-color .2s}
.unit.foe{border-color:#9a5a43}
.unit.boss{border-color:var(--blood);box-shadow:0 0 0 1px var(--blood)}
.unit.turn{border-color:var(--brass);box-shadow:0 0 0 2px var(--brass)}
.unit.dead{opacity:.35}
.unit.selectable{cursor:pointer;border-color:var(--blood);box-shadow:0 0 0 2px var(--blood)}
.unit.hit{animation:hit .3s}
@keyframes hit{25%{transform:translateX(-5px)}75%{transform:translateX(5px)}}
.u-top{display:flex;gap:10px;align-items:center}
.u-id b{display:block;line-height:1.15;overflow-wrap:anywhere}
.hp{position:relative;height:16px;background:#4b3826;border:1px solid var(--line2);border-radius:2px;overflow:hidden}
.hp i{position:absolute;inset:0 auto 0 0;background:var(--blood);transition:width .35s}
.unit.ally .hp i{background:var(--verd)}
.hp span{position:relative;display:block;text-align:center;font-size:.76rem;line-height:14px;font-variant-numeric:tabular-nums;color:#fff7e0;text-shadow:0 1px 2px #000}
.stt{display:flex;flex-wrap:wrap;gap:3px;min-height:18px}
.stt em{font-style:normal;font-size:.72rem;border:1px solid var(--line2);border-radius:2px;padding:0 5px;background:var(--bg3)}
.stt .b-dot{border-color:var(--blood);color:var(--blood)}
.stt .b-stun{border-color:var(--r2);color:var(--r2)}
.stt .b-buff{border-color:var(--verd);color:var(--verd)}
.stt .b-taunt{border-color:var(--brass);color:var(--brass)}
.fl{position:absolute;inset:0;pointer-events:none;overflow:visible}
.fnum{position:absolute;left:50%;top:28%;transform:translateX(-50%);font-weight:700;font-size:1.25rem;text-shadow:0 1px 0 #f5e8c6,0 0 6px #f5e8c6;animation:fl 1.1s forwards;color:#8c1f12;white-space:nowrap}
.fnum.crit{color:#b8400a;font-size:1.6rem}
.fnum.heal{color:#2c6a28}
.fnum.miss{color:var(--mute);font-size:1rem}
@keyframes fl{to{transform:translate(-50%,-34px);opacity:0}}
.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.skb{background:var(--bg3);border:1px solid var(--line2);border-radius:3px;padding:8px 12px;cursor:pointer;text-align:left;min-width:128px;display:flex;flex-direction:column}
.acts .btn.sm{align-self:center}
.skb:hover:not(:disabled){border-color:var(--brass)}
.skb.sel{border-color:var(--blood);color:var(--blood)}
.skb:disabled{opacity:.45;cursor:not-allowed}
.skb small{font-size:.78rem}
.log{height:150px;overflow-y:auto;background:#2a1c12;border:1px solid #1d1209;border-radius:3px;padding:8px 10px;font-size:.88rem;color:#c9ae82;box-shadow:inset 0 0 14px #0008}
.log p{margin:0}.log .rd{color:var(--gold);margin-top:4px}.log .cr{color:#f0944f}.log .hl{color:#a4d47f}.log .ev{color:#f3e4c0}
.result{border:1px solid var(--brass);border-radius:4px;padding:16px;background:#7b2a1a0d}
.result.lose{border-color:var(--blood);background:#a5351f12}
.result h2.lose{color:var(--blood)}
.lvup{color:var(--ok);font-weight:700}

/* sites */
.site .rates{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.9rem;color:var(--mute)}
.site .rates span{display:inline-flex;align-items:center;gap:4px}
.stk{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:.92rem}
.stk .lab{display:inline-flex;align-items:center;gap:5px}

/* équipement : mannequin */
.inv-layout{display:grid;gap:16px;grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}
@media (max-width:860px){.inv-layout{grid-template-columns:minmax(0,1fr)}}
.stats.two{grid-template-columns:1fr auto 1fr auto}
.doll{position:relative;width:min(100%,320px);aspect-ratio:300/440;margin:0 auto;user-select:none;-webkit-user-select:none}
.doll .body{position:absolute;inset:0;width:100%;height:100%}
.adv *{stroke:#3a2616;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.adv .cape{fill:hsl(var(--h) 42% 27%)}
.adv .capein{fill:hsl(var(--h) 35% 20%)}
.adv .tun{fill:hsl(var(--h) 30% 42%)}
.adv .tunl{fill:none;stroke:hsl(var(--h) 30% 30%);stroke-width:1.5}
.adv .scf{fill:hsl(var(--h) 48% 52%)}
.adv .skin{fill:#e3b98e}
.adv .hair{fill:#5b3a1e}
.adv .lth{fill:#7a5430}
.adv .dk{fill:#3f2b19}
.adv .pant{fill:#6c5a44}
.adv .roll{fill:#8f7350}
.adv .gold{fill:#d0a548;stroke:#5e4512}
.adv .eye{fill:#2a1a0d;stroke:none}
.adv .cn{fill:none;stroke:var(--line2);stroke-width:1.4;stroke-dasharray:3 3}
.adv .dot{fill:var(--line2);stroke:none}
.dslot{position:absolute;aspect-ratio:1/1;display:grid;place-items:center;padding:0;cursor:pointer;background:#ead9b3;border:1px dashed var(--line2);border-radius:2px;color:var(--line2)}
.dslot.full{touch-action:none;cursor:grab}
.dslot.fit{outline:2px dashed var(--verd);outline-offset:2px}
.dslot.over{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 14px #e8c982}
.dslot.drag{opacity:.35}
.dslot svg{width:58%;height:58%;fill:currentColor;pointer-events:none}
.dslot.full{border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 16%,#ead9b3);color:var(--rc);box-shadow:0 0 10px -3px var(--rc)}
.dslot:hover,.dslot.sel{outline:2px solid var(--brass);outline-offset:2px}
.dslot em{position:absolute;top:1px;right:3px;font-style:normal;font-size:.68rem;font-weight:700;color:var(--brass)}
#tip{position:fixed;z-index:30;width:250px;max-width:calc(100vw - 16px);pointer-events:none;filter:drop-shadow(0 8px 20px #000a);color:var(--fg)}
#tip .it{background:var(--bg2);background-image:linear-gradient(160deg,color-mix(in srgb,var(--rc) 14%,var(--bg2)),var(--bg2) 62%)}

/* inventaire : grille 12 x 4 */
.bagwrap{overflow-x:auto;padding:2px;scrollbar-width:thin}
.bag{display:grid;grid-template-columns:repeat(12,minmax(42px,1fr));gap:4px;min-width:calc(12 * 42px + 11 * 4px + 14px);padding:7px;background:#3a2817;border:1px solid #1d1209;border-radius:3px;box-shadow:inset 0 0 22px #000b,0 1px 0 #f4e8c855;user-select:none;-webkit-user-select:none}
.cell{position:relative;aspect-ratio:1/1;min-width:0;display:grid;place-items:center;padding:0;margin:0;background:linear-gradient(160deg,#4d3621,#35251a);border:1px solid #20150c;border-radius:2px;box-shadow:inset 0 0 8px #0009;color:#f3e4c0}
.cell svg{width:66%;height:66%;pointer-events:none}
.cell.full{cursor:grab;touch-action:none}
.cell.mat{background:linear-gradient(160deg,#6a4c2f,#4a3320);border-color:#8a6a40}
.cell.it{border:2px solid color-mix(in srgb,var(--rc) 75%,#fff 10%);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 45%,#4d3621),#35251a 85%);color:color-mix(in srgb,var(--rc) 30%,#fff0d0)}
.cell.it svg{fill:currentColor;width:58%;height:58%}
.cell .q{position:absolute;right:3px;bottom:0;font-size:.78rem;font-weight:700;font-variant-numeric:tabular-nums;color:#fff3d6;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none}
.cell .u{position:absolute;left:3px;top:0;font-size:.7rem;font-weight:700;color:var(--gold);text-shadow:0 1px 2px #000;pointer-events:none}
.cell.sel{outline:2px solid var(--gold);outline-offset:1px}
.cell.over{box-shadow:inset 0 0 0 2px var(--gold),0 0 10px #e8c98288}
.cell.drag{opacity:.3}
.bag.multi .cell.full{cursor:pointer;touch-action:auto}
.cell.pick{outline:2px solid #e0563a;outline-offset:1px}
.cell.pick::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;background:#a5351f99;color:#fff3d6;font-weight:700;font-size:1.4rem;pointer-events:none}
.btn.warn{background:var(--blood);color:#fff3d6;border-color:#5a1a0e;font-weight:700}
.btn.warn:hover:not(:disabled){background:#8c2a17;color:#fff}
.cell:focus-visible{outline-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:var(--bg3);border:0;padding:8px 18px;cursor:pointer;font-weight:700;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brass);color:#f7e9c6}
.forge-row{display:flex;flex-wrap:wrap;gap:18px 22px;align-items:flex-start}
.fcol{display:flex;flex-direction:column;gap:6px;flex:1 1 220px;min-width:0}
.fcol h3{font-size:.95rem;color:var(--mute);margin:0 0 4px}
.wpick{display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:68px;padding:6px 4px;background:var(--bg3);border:1px solid var(--line2);border-radius:3px;cursor:pointer;font-size:.82rem;color:var(--fg)}
.wpick svg{width:26px;height:26px;fill:currentColor}
.wpick.on{border-color:var(--brass);color:var(--brass);box-shadow:0 0 0 1px var(--brass);font-weight:700}
.carousel{display:flex;align-items:center;gap:8px}
.arw{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--bg3);cursor:pointer;font-size:1.6rem;line-height:1;color:var(--brass);padding:0 0 3px}
.arw:hover{border-color:var(--brass);background:#efe2c4}
.ctr{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:3px;padding:6px 4px;border:1px solid var(--line);border-radius:3px;background:#e8d9b555}
.ctr b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--brass)}
.ctr small{font-size:.8rem}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brass)}
.fslot{position:relative;width:104px;height:104px;display:grid;place-items:center;text-align:center;padding:8px;background:linear-gradient(160deg,#4d3621,#35251a);border:2px dashed #8a6a40;border-radius:3px;box-shadow:inset 0 0 14px #000a;color:#c9ae82;font-size:.8rem}
.fslot.full{border:2px solid color-mix(in srgb,var(--rc) 75%,#fff 10%);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 45%,#4d3621),#35251a 85%);color:color-mix(in srgb,var(--rc) 30%,#fff0d0)}
.fslot svg{width:60%;height:60%;fill:currentColor}
.fslot em{position:absolute;left:5px;top:2px;font-style:normal;font-weight:700;color:var(--gold)}
.fslot.over{border-color:var(--gold);box-shadow:inset 0 0 14px #000a,0 0 14px #e8c982}
.up-acts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.rs2{display:inline-flex;align-items:center;gap:4px}
.fullbar{background:var(--blood);color:#fff3d6;font-weight:700;text-align:center;padding:10px 14px;border-radius:3px;margin-bottom:14px;border:1px solid #5a1a0e;box-shadow:0 0 14px #a5351f66;letter-spacing:.02em}
#ghost{position:fixed;z-index:40;pointer-events:none;transform:translate(-50%,-50%) scale(1.1);box-shadow:0 8px 20px #000a;cursor:grabbing}
.matlist{display:grid;gap:6px}
.matlist>div{display:flex;align-items:center;gap:8px}
.matlist b{margin-left:auto;font-variant-numeric:tabular-nums}

#toasts{position:fixed;left:0;right:0;bottom:calc(14px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;align-items:center;gap:6px;pointer-events:none;z-index:20;padding-inline:16px}
.toast{background:#3d2a1b;color:#f3e4c0;border:1px solid var(--gold);border-radius:3px;padding:8px 14px;box-shadow:0 6px 24px #000a;animation:tin .25s;max-width:560px}
@keyframes tin{from{transform:translateY(8px);opacity:0}}
@media (prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}
@media (min-width:760px){.arena{grid-template-columns:1fr 1fr}}

/* ---- inventaire (48 cases) : null | {mat,n} | objet ---- */
const bagNew=()=>Array(BAG).fill(null);
function bagAddMat(bag,k,n){
  n=Math.max(0,Math.floor(n||0));
  for(const c of bag){ if(n<=0) break; if(c&&c.mat===k&&c.n<STACK){const m=Math.min(STACK-c.n,n);c.n+=m;n-=m} }
  for(let i=0;i<bag.length&&n>0;i++) if(!bag[i]){const m=Math.min(STACK,n);bag[i]={mat:k,n:m};n-=m}
  return n;
}
function bagAddItem(bag,it){const i=bag.indexOf(null); if(i<0) return false; bag[i]=it; return true}
const sellValue=it=>Math.round((5+it.ilvl*2)*(it.rarity+1)*(1+(it.up||0)*.25));
let MIG_MSG='';
function migrate(d){
  if(Array.isArray(d.bag)){
    d.bag=Array.from({length:BAG},(_,i)=>d.bag[i]||null);
  }else{
    const bag=bagNew(),mats=d.mats||{}; let lost=0,gold=0;
    for(const k of MATS) lost+=bagAddMat(bag,k,mats[k]||0);
    const items=(d.inv||[]).slice().sort((a,b)=>b.rarity-a.rarity||b.ilvl-a.ilvl);
    let sold=0; for(const it of items) if(!bagAddItem(bag,it)){gold+=sellValue(it);sold++}
    d.gold=(d.gold||0)+gold; d.bag=bag;
    if(d.mats||d.inv) MIG_MSG='Vos matériaux et objets sont maintenant dans l’onglet Inventaire.'+(sold?` ${sold} objet${sold>1?'s':''} en trop vendu${sold>1?'s':''} pour ${fmt(gold)} or.`:'');
  }
  delete d.mats; delete d.inv;
  if((d.v||1)<3) v3(d);
  if((d.v||1)<4) v4(d);
  d.v=4; return d;
}
/* v4 : plus de butin d’équipement, l’affixe « Butin trouvé » est remplacé */
function v4(d){
  const conv=it=>{ if(!it||it.mat||!it.aff) return; const m=RAR[it.rarity].m;
    it.aff=it.aff.map(a=>{ if(a.s!=='dropRate') return a; const n=pick(affPool(it.cls).filter(x=>!it.aff.some(y=>y.s===x.s))); return n?{s:n.s,v:rollAff(n,it.ilvl,m)}:null }).filter(Boolean);
    if(/ de Fortune$/.test(it.name)) it.name=it.name.replace(/ de Fortune$/,'');
  };
  (d.bag||[]).forEach(conv); for(const h of d.heroes||[]) Object.values(h.equip||{}).forEach(conv);
  for(const k of Object.keys(d.sites||{})) if(d.sites[k]) delete d.sites[k].cache;
}
/* passage au système de classes : Guerrier / Sorcier, objets réservés, Force / Intelligence */
function v3(d){
  const MAPB={'Épée':'Épée','Dague':'Épée','Bâton':'Bâton','Sceptre':'Bâton','Heaume':'Heaume','Couronne':'Heaume','Capuche':'Capuche','Cuirasse':'Cuirasse','Cuir clouté':'Cuirasse','Robe':'Robe','Bottes':'Bottes','Sandales':'Sandales'};
  const conv=it=>{
    if(!it||it.mat) return it;
    const old=it.base||'',nb=it.slot==='ring'?'Anneau':it.slot==='amulet'?'Amulette':(MAPB[old]||BASES.find(b=>b.slot===it.slot).n);
    const base=BASES.find(b=>b.n===nb),m=RAR[it.rarity].m,imp={};
    for(const [s,b,p] of base.imp){const v=(b+p*it.ilvl)*m; imp[s]=PCT.has(s)?Math.max(.5,r1(v)):Math.max(1,Math.round(v))}
    const suffix=old&&it.name.startsWith(old)?it.name.slice(old.length):'';
    Object.assign(it,{base:nb,name:nb+suffix,cls:base.cls||null,imp});
    const pool=affPool(it.cls),ok=s=>pool.some(a=>a.s===s),aff=[];
    for(const a of it.aff||[]){
      if(ok(a.s)&&!aff.some(x=>x.s===a.s)){aff.push(a);continue}
      const n=pick(pool.filter(x=>!aff.some(y=>y.s===x.s)&&!(it.aff||[]).some(y=>y.s===x.s&&ok(y.s)))); if(n) aff.push({s:n.s,v:rollAff(n,it.ilvl,m)});
    }
    it.aff=aff; return it;
  };
  (d.bag||[]).forEach(conv);
  let changed=false;
  for(const h of d.heroes||[]){
    const nc=h.cls==='voleur'?'guerrier':h.cls==='clerc'?'mage':h.cls;
    if(nc!==h.cls){
      changed=true; h.cls=nc; h.learned={}; h.loadout=[]; h.sp=h.lvl;
      const first=CLASSES[nc].skills.find(x=>x.t==='a'&&x.lvl===1); h.learned[first.id]=1; h.loadout=[first.id];
    }
    for(const sl of Object.keys(h.equip||{})){
      const it=conv(h.equip[sl]); if(!it) continue;
      if(it.cls&&it.cls!==h.cls){ delete h.equip[sl]; if(!bagAddItem(d.bag,it)) d.gold=(d.gold||0)+sellValue(it) }
    }
  }
  MIG_MSG=(MIG_MSG?MIG_MSG+' ':'')+'Équipement converti au nouveau système de classes.'+(changed?' Votre héros a changé de classe : ses points de compétence sont remboursés.':'');
}
function newGame(){
  const bag=bagNew(); bagAddMat(bag,'fer',60); bagAddMat(bag,'cuir',30);
  return {v:4,uid:0,heroes:[],party:[],bag,gold:80,
    sites:Object.fromEntries(SITES.map(s=>[s.id,{lvl:s.unlock===0?1:0,stock:{},cache:0}])),
    prog:{zone:0,stage:1},auto:false,farm:false,speed:1,last:Date.now(),kills:0};
}
function soloize(d){
  if(!d.heroes||d.heroes.length<=1){ if(d.heroes&&d.heroes[0]) d.party=[d.heroes[0].id]; return d }
  const first=d.heroes[0];
  for(const h of d.heroes.slice(1)) for(const sl of Object.keys(h.equip||{})) if(h.equip[sl]) bagAddItem(d.bag,h.equip[sl]);
  d.heroes=[first]; d.party=[first.id]; return d;
}
const loadData=d=>soloize(Object.assign(newGame(),migrate(d)));
function save(){try{localStorage.setItem(SAVE_KEY,JSON.stringify(S))}catch(e){}}
function loadSave(){
  try{
    const raw=localStorage.getItem(SAVE_KEY); if(!raw) return null;
    const d=JSON.parse(raw); if(!d||!Array.isArray(d.heroes)) return null;
    return loadData(d);
  }catch(e){return null}
}

/* ============ objets ============ */
function rollAff(a,ilvl,m){
  const v=(a.b+a.p*ilvl)*m*rand(.7,1);
  return PCT.has(a.s)?Math.max(.5,r1(v)):Math.max(1,Math.round(v));
}
function genItem(slot,ilvl,rarity,baseName,cls){
  cls=cls||(S&&S.heroes[0]&&S.heroes[0].cls);
  const base=baseName?BASES.find(b=>b.n===baseName):(baseFor(slot,cls)||pick(BASES.filter(b=>b.slot===slot)));
  const m=RAR[rarity].m, imp={};
  for(const [s,b,p] of base.imp){const v=(b+p*ilvl)*m; imp[s]=PCT.has(s)?Math.max(.5,r1(v)):Math.max(1,Math.round(v))}
  const aff=shuffle(affPool(base.cls).slice()).slice(0,RAR[rarity].aff).map(a=>({s:a.s,v:rollAff(a,ilvl,m)}));
  let ep='';
  if(rarity>=3) ep=' '+pick(EPITHETS);
  else {const a=aff.find(x=>AFXM[x.s].ep); if(a) ep=' '+AFXM[a.s].ep}
  return {id:++S.uid,slot,base:base.n,cls:base.cls||null,ilvl,rarity,imp,aff,up:0,name:base.n+ep};
}
const canWear=it=>!it||!it.cls||!S.heroes[0]||it.cls===S.heroes[0].cls;
const upMul=it=>1+.08*it.up;
function itemStats(it){
  const k=upMul(it), r={};
  for(const [s,v] of Object.entries(it.imp)) r[s]=(r[s]||0)+v*k;
  for(const a of it.aff) r[a.s]=(r[a.s]||0)+a.v*k;
  return r;
}
const invItems=()=>S.bag.filter(c=>c&&!c.mat);
const freeCells=()=>S.bag.reduce((a,c)=>a+(c?0:1),0);
const cellOf=id=>S.bag.findIndex(c=>c&&!c.mat&&c.id===id);
const matCount=k=>S.bag.reduce((a,c)=>a+(c&&c.mat===k?c.n:0),0);
function removeMat(k,n){
  const idx=S.bag.map((c,i)=>c&&c.mat===k?i:-1).filter(i=>i>=0).sort((a,b)=>S.bag[a].n-S.bag[b].n);
  for(const i of idx){ if(n<=0) break; const c=S.bag[i],m=Math.min(c.n,n); c.n-=m; n-=m; if(!c.n) S.bag[i]=null }
}
const LOST={}; let lostT=0;
function noteLost(k,n){
  LOST[k]=(LOST[k]||0)+n;
  if(!lostT) lostT=setTimeout(()=>{toast('Inventaire plein : '+Object.entries(LOST).map(([m,x])=>x+' '+MAT_N[m].toLowerCase()).join(', ')+' perdu(s).');for(const m in LOST)delete LOST[m];lostT=0},60);
}
function findItem(id){
  let it=invItems().find(i=>i.id===id); if(it) return {it,where:'inv'};
  for(const h of S.heroes)for(const s of SLOTS) if(h.equip[s]&&h.equip[s].id===id) return {it:h.equip[s],where:'eq',h};
  return null;
}
function rarityWeights(p){
  return [Math.max(5,60-45*p),30-5*Math.min(p,1.5),8+25*p,1.8+15*p,.2+5*p].map(x=>Math.max(.1,x));
}
function itemCard(it,foot='',delta=null){
  const k=upMul(it);
  const lines=[...Object.entries(it.imp).map(([s,v])=>`<li class="imp">${fmtStat(s,v*k)}</li>`),...it.aff.map(a=>`<li>${fmtStat(a.s,a.v*k)}</li>`)].join('');
  const dl=delta===null?'':`<span class="dl ${delta>=0?'up':'dn'}">${delta>=0?'▲':'▼'} ${Math.abs(Math.round(delta))}</span>`;
  return `<article class="it" style="--rc:var(--r${it.rarity})"><header><b>${esc(it.name)}${it.up?` <em>+${it.up}</em>`:''}</b> ${dl}<small>${SLOT_N[it.slot]}${it.cls?` · <span style="${canWear(it)?'':'color:var(--blood);font-weight:700'}">${CLASSES[it.cls].n}</span>`:''} · ${RAR[it.rarity].n}</small><small>Niveau d’objet <b class="num">${it.ilvl}</b></small></header><ul>${lines}</ul>${foot?`<div class="foot">${foot}</div>`:''}</article>`;
}
/* coût de création : réel pour les objets forgés/travaillés, estimé sinon (forge équivalente à la rareté + améliorations) */
function estCost(it){
  const t=TIERS[[0,0,1,2,3][it.rarity]],c={};
  for(const [k,v] of Object.entries(t.cost)) c[k]=Math.round(v*(1+it.ilvl/15));
  for(let u=0;u<(it.up||0);u++) for(const [k,v] of Object.entries(upCost({ilvl:it.ilvl,up:u}))) if(v) c[k]=(c[k]||0)+v;
  return c;
}
const itemCost=it=>it.cost||estCost(it);
function addCost(it,c){ if(!it.cost) it.cost=estCost(it); for(const [k,v] of Object.entries(c)) if(v) it.cost[k]=(it.cost[k]||0)+v }
function salvageValue(it){
  const v={}; for(const [k,x] of Object.entries(itemCost(it))){const n=Math.floor(x*.25); if(n>0) v[k]=n}
  return v;
}
const resTxt=v=>Object.entries(v).map(([k,n])=>fmt(n)+' '+MAT_N[k].toLowerCase()).join(', ')||'rien';
const resChips=v=>Object.entries(v).map(([k,n])=>matChip(k,n)).join('')||'<span class="mute">rien</span>';
function addInv(it){
  if(bagAddItem(S.bag,it)){markNew();return true}
  gain(salvageValue(it)); return false;
}
function markNew(){ if(UI.tab!=='bag') S.bagDot=true }
function gain(c){for(const [k,v] of Object.entries(c)){ if(k==='gold')S.gold+=v; else {const left=bagAddMat(S.bag,k,v); if(left>0) noteLost(k,left); if(Math.floor(v)-left>0) markNew()} }}
const canPay=c=>Object.entries(c).every(([k,v])=>(k==='gold'?S.gold:matCount(k))>=v);
function pay(c){for(const [k,v] of Object.entries(c)){ if(k==='gold')S.gold-=v; else removeMat(k,v) }}
const costHTML=c=>`<span class="cost">${Object.entries(c).filter(([,v])=>v>0).map(([k,v])=>{const have=k==='gold'?S.gold:matCount(k);return `<span class="${have>=v?'ok':'no'}" title="${MAT_N[k]}">${matIcon(k)}${fmt(v)}<span class="sr">${MAT_N[k]}</span></span>`}).join('')}</span>`;

/* ============ héros ============ */
const xpNeed=l=>Math.round(30*Math.pow(l,1.6));
function newHero(name,cls,hue,lvl=1){
  const h={id:++S.uid,name,cls,hue,lvl,xp:0,sp:lvl,stars:0,learned:{},loadout:[],equip:{}};
  const first=CLASSES[cls].skills.find(s=>s.t==='a'&&s.lvl===1);
  h.learned[first.id]=1; h.loadout.push(first.id);
  h.equip.weapon=genItem('weapon',lvl,0,null,cls);
  h.equip.armor=genItem('armor',lvl,0,null,cls);
  return h;
}
const partyHeroes=()=>S.party.map(id=>S.heroes.find(h=>h.id===id)).filter(Boolean);
function gearStats(h){
  const t={};
  for(const s of SLOTS){const it=h.equip[s]; if(it) for(const [k,v] of Object.entries(itemStats(it))) t[k]=(t[k]||0)+v}
  return t;
}
function passMods(h){
  const t={};
  for(const sk of CLASSES[h.cls].skills){
    if(sk.t!=='p') continue; const r=h.learned[sk.id]||0; if(!r) continue;
    for(const [k,v] of Object.entries(sk.mods)) t[k]=(t[k]||0)+v*r;
  }
  return t;
}
function heroStats(h){
  const c=CLASSES[h.cls],lv=h.lvl-1,star=1+.1*h.stars,g=gearStats(h),p=passMods(h);
  const b=k=>(c.base[k]+c.grow[k]*lv)*star;
  const pc=k=>(g[k+'Pct']||0)+(p[k+'Pct']||0);
  return {
    hp:(b('hp')+(g.hp||0))*(1+pc('hp')/100),
    atk:(b('atk')+(g.atk||0))*(1+pc('atk')/100),
    mag:(b('mag')+(g.mag||0))*(1+pc('mag')/100),
    def:(b('def')+(g.def||0))*(1+pc('def')/100),
    res:(b('res')+(g.res||0))*(1+pc('res')/100),
    spd:(b('spd')+(g.spd||0))*(1+pc('spd')/100),
    crit:5+(g.crit||0)+(p.crit||0),
    critDmg:150+(g.critDmg||0)+(p.critDmg||0),
    dodge:Math.min(45,(g.dodge||0)+(p.dodge||0)),
    lifesteal:(g.lifesteal||0)+(p.lifesteal||0),
    dmgPct:g.dmgPct||0,goldFind:g.goldFind||0,dropRate:g.dropRate||0,
    regen:p.regen||0,healPow:p.healPow||0,
  };
}
function heroPower(h){
  const s=heroStats(h);
  return s.hp/8+Math.max(s.atk,s.mag)*2.2+s.def+s.res+s.spd*2+s.crit*1.5+s.critDmg*.2+s.dodge*2+s.lifesteal*3+s.dmgPct*3;
}
function gainXp(h,xp){
  h.xp+=xp; let ups=0;
  while(h.lvl<MAXL&&h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);h.lvl++;h.sp++;ups++}
  if(h.lvl>=MAXL)h.xp=0;
  return ups;
}
const sc=r=>1+.12*(r-1);
function skDesc(sk,rank,role){
  const k=sc(rank),p=x=>Math.round(x*100*k),stN=(sk.st||role)==='mag'?'INT':'FOR';
  const tgN={one:'un ennemi',all:'tous les ennemis',self:'vous',allies:'tous les alliés',lowAlly:'l’allié le plus blessé'}[sk.tg];
  const out=[];
  if(sk.mult) out.push(`Inflige ${p(sk.mult)}% ${stN}${sk.hits>1?' ×'+sk.hits:''} à ${tgN}${sk.exec?` (dégâts doublés sous ${sk.exec.thr}% PV)`:''}.`);
  const sn={atk:'Force',def:'Défense',res:'Résistance',spd:'Vitesse',mag:'Intelligence'};
  for(const f of sk.fx||[]){

    if(f.k==='heal') out.push(`Soigne ${p(f.v)}% INT${f.on==='allies'?' à tous les alliés':''}.`);
    if(f.k==='buff') out.push(`+${Math.round(f.v*k)}% ${sn[f.stat]} pendant ${f.dur} tours.`);
    if(f.k==='debuff') out.push(`${Math.round(f.v*k)}% ${sn[f.stat]} pendant ${f.dur} tours.`);

function mkEnemies(z,st,n){

    def:enStat('def',L)*t.def,res:enStat('def',L)*.9*t.def,spd:(8+.15*L)*(t.spd||1)*rand(.95,1.05),
    crit:5,critDmg:150,dodge:0,lifesteal:0,dmgPct:0,regen:0,healPow:0,

function dmg(t,d,crit,src,label){
  let left=d;
  if(t.shield>0){const a=Math.min(t.shield,left);t.shield-=a;left-=a}
  t.hp-=left; if(t.hp<0)t.hp=0;
  floatTxt(t,(crit?'✦ ':'')+d,crit?'crit':'');
  const el=unitEl(t); if(el){el.classList.add('hit');setTimeout(()=>el.classList.remove('hit'),300)}
  logLine(`${t.name} subit ${d} dégâts${label?' ('+label+')':''}${crit?' — coup critique !':''}`,crit?'cr':'');
  if(t.hp<=0){logLine(`${t.name} est vaincu.`,'ev');t.st=[]}
  refresh(t);
}
function heal(t,a,silent){
  a=Math.round(a); if(a<=0||t.hp<=0) return;
  const real=Math.min(a,t.maxHp-t.hp); t.hp+=real;
  floatTxt(t,'+'+real,'heal'); if(!silent||real>0) logLine(`${t.name} récupère ${real} PV.`,'hl'); refresh(t);
}
function hit(u,t,mult,st,sk){
  if(Math.random()*100<(t.dodge||0)){floatTxt(t,'Esquive','miss');logLine(`${t.name} esquive l’attaque.`);return}
  const ds=st==='mag'?'res':'def';
  let d=effStat(u,st)*mult*100/(100+effStat(t,ds));
  d*=1+(u.dmgPct||0)/100;
  if(u.team==='e'&&C.round>30) d*=1+(C.round-30)*.1;
  if(sk&&sk.exec&&t.hp/t.maxHp<sk.exec.thr/100) d*=1+sk.exec.bonus;
  d*=rand(.92,1.08);
  const crit=Math.random()*100<(u.crit||0); if(crit) d*=(u.critDmg||150)/100;
  d=Math.max(1,Math.round(d));
  dmg(t,d,crit,u);
  if(u.lifesteal&&u.hp>0) heal(u,d*u.lifesteal/100,true);
}
function applyFx(u,t,f,k,sk){
  if(t.hp<=0) return;
  const st=sk.st||u.role;
  if(f.k==='dot'){
    t.st=t.st.filter(s=>!(s.k==='dot'&&s.n===f.n));
    t.st.push({k:'dot',n:f.n,v:effStat(u,st)*f.v*k,dur:f.dur});
  }else if(f.k==='stun'){
    const ch=(f.ch||100)*(t.boss?.5:1);
    if(Math.random()*100<ch&&!t.st.some(s=>s.k==='stun')){t.st.push({k:'stun',dur:f.dur});logLine(`${t.name} est étourdi !`,'ev')}
  }else if(f.k==='shield'){
    const a=f.of==='hp'?t.maxHp*f.v*k:effStat(u,'mag')*f.v*k;
    t.shield=Math.min(t.maxHp,t.shield+a); floatTxt(t,'Bouclier','heal');
  }else if(f.k==='heal'){
    heal(t,effStat(u,f.of||'mag')*f.v*k*(1+(u.healPow||0)/100)*rand(.95,1.05));
  }else if(f.k==='buff'||f.k==='debuff'){
    const v=f.v*(f.k==='buff'?k:Math.abs(k));
    t.st=t.st.filter(s=>!(s.k==='buff'&&s.stat===f.stat&&Math.sign(s.v)===Math.sign(v)));
    t.st.push({k:'buff',stat:f.stat,v:f.k==='debuff'?-Math.abs(v):v,dur:f.dur});
  }else if(f.k==='taunt'){
    t.st=t.st.filter(s=>s.k!=='taunt'); t.st.push({k:'taunt',dur:f.dur});
  }
  refresh(t);
}
async function exec(u,sk,tgt){
  const rank=sk.id==='atk'?1:(u.ranks[sk.id]||1),k=sc(rank);
  if(sk.cd) u.cds[sk.id]=sk.cd+1;
  const foesA=alive(foes(u)),friA=alive(friends(u));
  if((sk.tg==='one')&&(!tgt||tgt.hp<=0)) tgt=foesA[0];
  let fT=[],aT=[];
  if(sk.tg==='one') fT=tgt?[tgt]:[];
  else if(sk.tg==='all') fT=foesA;
  else if(sk.tg==='self') aT=[u];
  else if(sk.tg==='allies') aT=friA;
  else if(sk.tg==='lowAlly') aT=[friA.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]];
  logLine(sk.id==='atk'?`${u.name} attaque${tgt?' '+tgt.name:''}.`:`${u.name} utilise ${sk.n}.`);
  const el=unitEl(u); if(el){el.style.transform='scale(1.03)';setTimeout(()=>{el.style.transform=''},220)}
  await sleep(260);
  const st=sk.st||u.role;
  if(sk.mult) for(const t of fT) for(let i=0;i<(sk.hits||1);i++){ if(t.hp<=0)break; hit(u,t,sk.mult*k,st,sk) }
  for(const f of sk.fx||[]){
    const on=f.on||(sk.tg==='one'||sk.tg==='all'?'foe':'friend');
    const ts=on==='foe'?fT:on==='allies'?alive(friends(u)):aT;
    for(const t of ts) applyFx(u,t,f,k,sk);
  }
  refreshAll();
  await sleep(420);
}
function tauntOf(list){return list.find(x=>x.hp>0&&x.st.some(s=>s.k==='taunt'))}
function ai(u){
  const foesA=alive(foes(u)),friA=alive(friends(u));
  const usable=u.skills.filter(id=>(u.cds[id]||0)===0).map(id=>({sk:SK[id],rank:u.ranks[id]||1}));
  const isHeal=x=>x.sk.tg==='lowAlly'&&x.sk.fx&&x.sk.fx.some(f=>f.k==='heal');
  const low=friA.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0];
  const healer=usable.find(isHeal);
  if(healer&&low&&low.hp/low.maxHp<.55) return {skill:healer.sk,target:low};
  let best=null,bs=1;
  for(const x of usable){
    const sk=x.sk; if(isHeal(x)) continue;
    let s=(sk.mult||0)*(sk.tg==='all'?foesA.length*.8:1)*sc(x.rank);
    if(sk.exec) s*=foesA.some(f=>f.hp/f.maxHp<sk.exec.thr/100)?1.8:.8;
    if(!sk.mult){
      const need=(sk.fx||[]).some(f=>(f.k==='buff'&&friA.every(a=>!a.st.some(q=>q.k==='buff'&&q.stat===f.stat)))||(f.k==='shield'&&u.shield<u.maxHp*.1&&(sk.tg!=='self'||true)));
      s=need?1.7:0;
    }
    s*=rand(.85,1.15);
    if(u.team==='e'&&Math.random()<.25) s*=.5;
    if(s>bs){bs=s;best=x}
  }
  const skill=best?best.sk:SK.atk;
  let target=null;
  if(skill.tg==='one'){
    if(u.team==='h') target=foesA.slice().sort((a,b)=>a.hp-b.hp)[0];
    else target=tauntOf(foesA)||(Math.random()<.3?foesA.slice().sort((a,b)=>a.hp/a.maxHp-b.hp/b.maxHp)[0]:pick(foesA));
  }
  return {skill,target};
}
function playerChoice(u){

}
async function turn(u){
  C.turn=u.id; refreshAll();

  if(u.regen&&u.hp>0) heal(u,u.maxHp*u.regen/100,true);
  if(u.hp<=0){C.turn=null;refreshAll();return}
  let skip=false;
  if(u.st.some(s=>s.k==='stun')){logLine(`${u.name} est étourdi et passe son tour.`,'ev');skip=true;await sleep(500)}

function checkEnd(){

async function loop(id){

    if(C.abort||C.id!==id) return;
    C.round++; logLine(`Tour ${C.round}`,'rd');
    if(C.round===31) logLine('Les ennemis entrent en rage : leurs dégâts augmentent à chaque tour.','cr');
    const order=alive(C.units).sort((a,b)=>effStat(b,'spd')-effStat(a,'spd')||Math.random()-.5);
    for(const u of order){
      if(C.abort||C.id!==id) return;
      if(u.hp<=0) continue;
      await turn(u);
      if(C.abort||C.id!==id) return;

    }
  }

const f=n=>n*(1+.12*(n-1));
const siteRate=(si,lvl,m)=>(si.out[m]||0)*f(lvl);
const siteCap=(si,lvl,m)=>(si&&si.caps&&si.caps[m])||50;
const siteUpCost=lvl=>Math.round(60*Math.pow(1.7,lvl-1));
function produce(dt){
  for(const si of SITES){
    const st=S.sites[si.id]; if(!st||st.lvl<1) continue;
    for(const m of Object.keys(si.out)){
      const cap=siteCap(si,st.lvl,m);
      st.stock[m]=Math.min(cap,(st.stock[m]||0)+siteRate(si,st.lvl,m)*dt);
    }
  }
}
function collectSite(id,quiet){
  const si=SITES.find(s=>s.id===id),st=S.sites[id]; let got={};
  let full=false;
  for(const [m,v] of Object.entries(st.stock)){
    const n=Math.floor(v); if(n<=0) continue;
    const left=m==='gold'?0:bagAddMat(S.bag,m,n); if(m==='gold') S.gold+=n;
    if(left) full=true;
    if(n-left>0){got[m]=n-left; if(m!=='gold') markNew()} st.stock[m]=v-(n-left);
  }
  const items=[];
  if(full&&!quiet) setTimeout(()=>toast('Inventaire plein : une partie de la récolte reste dans la zone de collecte.'),50);
  return {got,items};
}
/* place restante pour un matériau dans l’inventaire */
const matRoom=k=>S.bag.reduce((a,c)=>a+(!c?STACK:c.mat===k?STACK-c.n:0),0);
/* une ressource attend en zone de collecte mais l’inventaire n’a plus de place */
function collectBlocked(){
  for(const si of SITES){const st=S.sites[si.id]; if(!st||st.lvl<1) continue;
    for(const m of Object.keys(si.out)){ if(m==='gold') continue; const v=st.stock[m]||0;
      if(Math.floor(v)>=1&&matRoom(m)===0&&(S.autoCollect||v>=siteCap(si,st.lvl,m)-1e-6)) return true }}
  return false;
}
let lastBlocked=false;
function autoCollect(){
  const got={};
  for(const si of SITES){const st=S.sites[si.id]; if(!st||st.lvl<1) continue;
    const capped=Object.keys(si.out).some(m=>(st.stock[m]||0)>=siteCap(si,st.lvl,m)-1e-6&&(m==='gold'||matRoom(m)>0));
    if(!capped) continue;
    const r=collectSite(si.id,true); for(const [k,v] of Object.entries(r.got)) got[k]=(got[k]||0)+v;
  }
  if(Object.keys(got).length){ save(); renderHeader(); if(UI.tab==='bag'||UI.tab==='forge') render(); else renderTabs();
    toast('Collecte automatique : '+Object.entries(got).map(([k,n])=>n+' '+MAT_N[k].toLowerCase()).join(', ')) }
}
function tick(){
  const now=Date.now(),dt=Math.max(0,(now-S.last)/1000); S.last=now;
  if(!S||!S.heroes.length) return;
  produce(dt);
  if(S.autoCollect) autoCollect();
  const b=collectBlocked(); if(b!==lastBlocked){lastBlocked=b; if(UI.tab==='sites') render(); else renderTabs()}
  if(UI.tab==='sites') liveSites();
}

function renderActbar(){

function multiBar(){

function sortBag(){
  const {k,dir}=UI.bagSort,tot={},ent=[];
  for(const c of S.bag){ if(!c) continue; if(c.mat) tot[c.mat]=(tot[c.mat]||0)+c.n; else ent.push(c) }
  for(const [m,n] of Object.entries(tot)){let r=n;while(r>0){const s=Math.min(STACK,r);ent.push({mat:m,n:s});r-=s}}
  const q=c=>c.mat?c.n:1;
  const byName=(a,b)=>cellName(a).localeCompare(cellName(b),'fr',{sensitivity:'base'});
  const tie=(a,b)=>(b.rarity||0)-(a.rarity||0)||(b.ilvl||0)-(a.ilvl||0);
  ent.sort(k==='name'?(a,b)=>dir*(byName(a,b)||q(b)-q(a)||tie(a,b)):(a,b)=>dir*(q(b)-q(a)||byName(a,b)||tie(a,b)));
  S.bag=bagNew(); ent.forEach((c,i)=>{S.bag[i]=c});
}
function moveCell(a,b){
  if(a===b) return; const A=S.bag[a],B=S.bag[b]; if(!A) return;
  if(!B){S.bag[b]=A;S.bag[a]=null}
  else if(A.mat&&B.mat===A.mat&&B.n<STACK){const m=Math.min(STACK-B.n,A.n);B.n+=m;A.n-=m;if(!A.n)S.bag[a]=null}
  else {S.bag[a]=B;S.bag[b]=A}
  if(UI.bagSel===a) UI.bagSel=S.bag[b]?b:null; else if(UI.bagSel===b) UI.bagSel=S.bag[a]?a:null;
  save(); render();
}

let DRAG=null,noClick=false;

function equipFromCell(i,slot){
  const h=S.heroes[0],it=S.bag[i]; if(!it||it.mat) return;
  if(slotType(slot)!==it.slot){toast('Cet objet ne va pas dans cet emplacement.');return}
  if(!canWear(it)){toast(`Réservé au ${CLASSES[it.cls].n}.`);return}
  const old=h.equip[slot]; h.equip[slot]=it; S.bag[i]=old||null;
  if(UI.bagSel===i&&!old) UI.bagSel=null; save(); render();
}
function unequipTo(slot,i){
  const h=S.heroes[0],it=h.equip[slot]; if(!it) return;
  const tgt=i==null?null:S.bag[i];
  if(i!=null&&!tgt){S.bag[i]=it;delete h.equip[slot]}
  else if(tgt&&!tgt.mat&&tgt.slot===it.slot&&canWear(tgt)){h.equip[slot]=tgt;S.bag[i]=it}
  else if(!bagAddItem(S.bag,it)){toast('Inventaire plein.');return}

}
document.addEventListener('pointerdown',e=>{

});
document.addEventListener('pointermove',e=>{
  if(!DRAG) return;

    DRAG.on=true; hideTip();
    const g=DRAG.el.cloneNode(true); g.id='ghost'; g.removeAttribute('data-act'); g.removeAttribute('data-tip'); g.classList.remove('sel');
    g.style.width=DRAG.el.offsetWidth+'px'; g.style.height=DRAG.el.offsetHeight+'px'; document.body.append(g); DRAG.ghost=g; DRAG.el.classList.add('drag');

  }
  e.preventDefault();

  const t=document.elementFromPoint(e.clientX,e.clientY),cell=t&&t.closest&&t.closest('#bag .cell, #doll .dslot, #fslot');
  const ok=cell&&cell!==DRAG.el?cell:null;
  if(DRAG.over&&DRAG.over!==ok) DRAG.over.classList.remove('over');

function endDrag(e,drop){
  if(!DRAG) return; const d=DRAG; DRAG=null;
  if(!d.on) return;
  noClick=true; setTimeout(()=>{noClick=false},0);

  }
}

/* ============ actions ============ */
const A={
  tab:d=>{UI.tab=d.t;if(d.t==='bag')S.bagDot=false;if(d.t==='forge')UI.fMode='forge';UI.recruit=false;UI.multi=false;UI.pick=new Set();if(UI.confirm!=='reset')UI.confirm=null;render()},
  pickClass:d=>{UI.cc=d.c;render()},
  pickHue:d=>{UI.chue=+d.h;render()},
  createHero:()=>{
    const name=(UI.cname||'').trim()||'Héros';
    S.heroes=[newHero(name,UI.cc,UI.chue,1)]; S.party=[S.heroes[0].id]; S.last=Date.now();
    UI.tab='combat'; UI.cname=''; save(); render(); toast('Bienvenue, '+name+'. Lancez votre premier combat.');
  },
  zone:d=>{UI.zone=+d.i;UI.stage=UI.zone===S.prog.zone?S.prog.stage:1;render()},
  stage:d=>{UI.stage=+d.s;render()},
  fight:()=>startBattle(),
  auto:()=>{S.auto=!S.auto;if(!S.auto)S.farm=false;if(S.auto&&C.waiting){const w=C.waiting;C.waiting=null;C.pending=null;w.res(ai(w.u))}render()},
  farm:()=>{S.farm=!S.farm;render()},
  speed:()=>{S.speed=S.speed===1?2:S.speed===2?4:1;renderActbar()},
  flee:()=>{C.abort=true;C.id++;if(C.waiting){const w=C.waiting;C.waiting=null;w.res({})}C.phase='idle';C.pending=null;S.farm=false;render()},
  back:()=>{C.phase='idle';render()},
  again:()=>{C.phase='idle';startBattle()},
  next:()=>{C.phase='idle';startBattle()},
  skill:d=>{
    const w=C.waiting; if(!w) return; const sk=SK[d.id];
    if(sk.tg==='one'){
      const en=alive(C.units.filter(u=>u.team==='e'));
      if(en.length>1){C.pending=sk;renderActbar();refreshAll();return}
      C.waiting=null;C.pending=null;w.res({skill:sk,target:en[0]});return;
    }
    C.waiting=null;C.pending=null;w.res({skill:sk,target:null});
  },
  pick:d=>{
    if(!C.pending||!C.waiting) return; const t=C.units.find(u=>u.id===d.u); if(!t||t.team!=='e'||t.hp<=0) return;
    const w=C.waiting,sk=C.pending;C.waiting=null;C.pending=null;w.res({skill:sk,target:t});
  },
  cancelPick:()=>{C.pending=null;renderActbar();refreshAll()},
  learn:d=>{
    const h=S.heroes[0]; const sk=SK[d.id]; if(h.sp<1||(h.learned[d.id]||0)>=5||h.lvl<sk.lvl) return;
    h.sp--; h.learned[d.id]=(h.learned[d.id]||0)+1;
    if(sk.t==='a'&&!h.loadout.includes(d.id)&&h.loadout.length<3) h.loadout.push(d.id);
    save();render();
  },
  equipSk:d=>{
    const h=S.heroes[0];
    if(h.loadout.includes(d.id)){ if(h.loadout.length>1)h.loadout=h.loadout.filter(x=>x!==d.id); else toast('Gardez au moins une compétence active.') }
    else if(h.loadout.length<3) h.loadout.push(d.id);
    save();render();
  },
  ascend:()=>{
    const h=S.heroes[0],c={gold:300*Math.pow(h.stars+1,2),rune:(h.stars+1)*2};
    if(h.stars>=5||h.lvl<(h.stars+1)*8||!canPay(c)) return; pay(c); h.stars++; save(); render(); toast(h.name+' atteint l’ascension '+h.stars+'.');
  },
  unequip:d=>{
    const h=S.heroes[0],it=h.equip[d.slot]; if(!it) return;
    if(!bagAddItem(S.bag,it)){toast('Inventaire plein.');return} delete h.equip[d.slot]; save(); render();
  },
  bagCell:d=>{const i=+d.i;UI.confirm=null;
    if(UI.multi){UI.pick.has(i)?UI.pick.delete(i):UI.pick.add(i);render();return}
    UI.bagSel=UI.bagSel===i?null:i;UI.invSel=null;render()},
  noConfirm:()=>{UI.confirm=null;render()},
  matDel:d=>{
    const i=+d.i,c=S.bag[i]; if(!c||!c.mat) return;
    if(UI.confirm!=='mat'+i){UI.confirm='mat'+i;render();return}
    UI.confirm=null; S.bag[i]=null; UI.bagSel=null; save(); render(); toast(`${c.n} × ${MAT_OBJ[c.mat]} détruit${c.n>1?'s':''}.`);
  },
  multiToggle:()=>{UI.multi=!UI.multi;UI.pick=new Set();UI.confirm=null;UI.bagSel=null;render()},
  multiPick:d=>{UI.confirm=null;UI.pick=new Set();S.bag.forEach((c,i)=>{if(c&&(d.w==='items'&&!c.mat||d.w==='mats'&&c.mat))UI.pick.add(i)});render()},
  multiDel:()=>{
    if(!UI.pick.size) return;
    if(UI.confirm!=='multi'){UI.confirm='multi';render();return}
    const tot={};let n=0;
    for(const i of UI.pick){const c=S.bag[i]; if(!c) continue; if(!c.mat) for(const [k,v] of Object.entries(salvageValue(c)))tot[k]=(tot[k]||0)+v; if(UI.fItem===c.id)UI.fItem=null; S.bag[i]=null; n++}
    gain(tot); UI.pick=new Set(); UI.confirm=null; save(); render();
    toast(`${n} case${n>1?'s':''} détruite${n>1?'s':''}. Récupéré : ${resTxt(tot)}.`);
  },
  bagSort:d=>{
    if(UI.bagSort.k===d.k) UI.bagSort.dir*=-1; else UI.bagSort={k:d.k,dir:1};
    sortBag(); UI.bagSel=null; save(); render();
  },
  bagSplit:d=>{
    const i=+d.i,c=S.bag[i],j=S.bag.indexOf(null); if(!c||!c.mat||c.n<2||j<0) return;
    const half=Math.floor(c.n/2); c.n-=half; S.bag[j]={mat:c.mat,n:half}; save(); render();
  },
  changeItem:d=>{UI.invSel=d.slot;UI.bagSel=null;UI.tab='bag';render()},
  dollSlot:d=>{UI.invSel=UI.invSel===d.slot?null:d.slot;UI.bagSel=null;render()},
  equip:d=>{
    const h=S.heroes[0],i=cellOf(+d.id); if(i<0) return;
    const it=S.bag[i]; if(!canWear(it)){toast(`Réservé au ${CLASSES[it.cls].n}.`);return}
    const ts=targetSlot(h,it),old=h.equip[ts]; S.bag[i]=old||null; h.equip[ts]=it;
    if(!old&&UI.bagSel===i) UI.bagSel=null; save(); render();
  },
  salv:d=>{
    const i=cellOf(+d.id); if(i<0) return; const it=S.bag[i];
    if(UI.confirm!=='del'+it.id){UI.confirm='del'+it.id;render();return}
    UI.confirm=null; if(UI.fItem===it.id)UI.fItem=null; if(UI.bagSel===i)UI.bagSel=null;
    S.bag[i]=null; const v=salvageValue(it); gain(v); save(); render();
    toast(`${it.name} détruit. Récupéré : ${resTxt(v)}.`);
  },
  toForge:d=>{UI.fItem=+d.id;UI.fMode='up';UI.tab='forge';render()},
  fMode:d=>{UI.fMode=d.m;render()},
  fPut:d=>{UI.fItem=+d.id;UI.fMode='up';render()},
  fClear:()=>{UI.fItem=null;render()},
  forgeTierStep:d=>{UI.fTier=(UI.fTier+(+d.d)+TIERS.length)%TIERS.length;render()},
  forgeSlot:d=>{UI.fSlot=d.s;render()},
  forgeTier:d=>{UI.fTier=+d.i;render()},
  forgeDo:()=>{
    const t=TIERS[UI.fTier],fl=forgeLvl(),cost=tierCost(UI.fTier,fl);
    if(!canPay(cost)) return; pay(cost);
    const it=genItem(UI.fSlot,fl,wpick(t.odds)); it.cost={...cost}; const ok=addInv(it); UI.fLast=it; UI.fLast.where=ok?'inv':'lost';
    save(); render();
    toast(ok?`${it.name} ajouté à l’inventaire.`:'Inventaire plein : objet détruit automatiquement (25 % des ressources rendues).');
  },
  upItem:()=>{
    const r=findItem(UI.fItem); if(!r||r.it.up>=10) return; const c=upCost(r.it); if(!canPay(c)) return; pay(c); addCost(r.it,c); r.it.up++; save(); render();
  },
  rerollVals:()=>{
    const r=findItem(UI.fItem); if(!r) return; const c=rerollCost(r.it); if(!canPay(c)) return; pay(c); addCost(r.it,c);
    const m=RAR[r.it.rarity].m; for(const a of r.it.aff) a.v=rollAff(AFXM[a.s],r.it.ilvl,m); save(); render();
  },
  replAff:d=>{
    const r=findItem(UI.fItem); if(!r) return; const c=replCost(r.it); if(!canPay(c)) return; pay(c); addCost(r.it,c);
    const have=new Set(r.it.aff.map(a=>a.s)),pool=affPool(r.it.cls).filter(a=>!have.has(a.s)),n=pick(pool); if(!n) return;
    r.it.aff[+d.i]={s:n.s,v:rollAff(n,r.it.ilvl,RAR[r.it.rarity].m)}; save(); render();
  },
  salvBelow:d=>{
    const rr=+d.r,tot={}; let n=0;
    S.bag=S.bag.map(it=>{ if(it&&!it.mat&&it.rarity<=rr){const v=salvageValue(it);for(const [k,x] of Object.entries(v))tot[k]=(tot[k]||0)+x;n++;return null} return it });
    gain(tot); if(UI.bagSel!=null&&!S.bag[UI.bagSel])UI.bagSel=null; if(UI.fItem&&!findItem(UI.fItem))UI.fItem=null; save(); render();
    toast(n?`${n} objets détruits. Récupéré : ${resTxt(tot)}.`:'Rien à détruire.');
  },
  siteBuy:d=>{const si=SITES.find(s=>s.id===d.id);if(S.gold<si.unlock)return;S.gold-=si.unlock;S.sites[d.id].lvl=1;S.sites[d.id].last=Date.now();save();render()},
  siteUp:d=>{const st=S.sites[d.id],c=siteUpCost(st.lvl);if(S.gold<c)return;S.gold-=c;st.lvl++;save();render()},
  siteCollect:d=>{
    const r=collectSite(d.id); const t=Object.entries(r.got).map(([k,v])=>`${v} ${MAT_N[k].toLowerCase()}`);
    if(r.items.length)t.push(`${r.items.length} objet${r.items.length>1?'s':''}`);
    save();render();toast(t.length?'Récolté : '+t.join(', '):'Rien à collecter pour l’instant.');
  },
  autoCol:()=>{S.autoCollect=!S.autoCollect; if(S.autoCollect) autoCollect(); save(); render()},
  siteAll:()=>{
    let n=0,it=0; for(const si of SITES) if(S.sites[si.id].lvl>0){const r=collectSite(si.id);n+=Object.values(r.got).reduce((a,b)=>a+b,0);it+=r.items.length}
    save();render();toast(n||it?`Récolté : ${n} ressources${it?`, ${it} objet${it>1?'s':''}`:''}.`:'Rien à collecter pour l’instant.');
  },
  copyExp:()=>{
    const t=$('#expTxt'); t.select();
    try{navigator.clipboard.writeText(t.value).then(()=>toast('Code copié.'),()=>toast('Sélectionnez le code et copiez-le.'))}catch(e){toast('Sélectionnez le code et copiez-le.')}
  },
  import:()=>{
    const raw=($('#impTxt').value||'').trim(); if(!raw) return;
    try{
      let d; try{d=JSON.parse(decodeURIComponent(escape(atob(raw))))}catch(e){d=JSON.parse(raw)}
      if(!d||!Array.isArray(d.heroes)||!d.heroes.length) throw 0;
      S=loadData(d); S.last=Date.now(); UI.bagSel=null; if(MIG_MSG){setTimeout(()=>toast(MIG_MSG),400);MIG_MSG=''} C.phase='idle'; UI.zone=S.prog.zone; UI.stage=S.prog.stage; UI.hero=null; UI.invHero=null; save(); UI.tab='combat'; render(); toast('Sauvegarde importée.');
    }catch(e){toast('Ce code n’est pas une sauvegarde valide.')}
  },
  reset:()=>{
    if(UI.confirm!=='reset'){UI.confirm='reset';render();return}
    C.abort=true;C.id++;C.phase='idle'; try{localStorage.removeItem(SAVE_KEY)}catch(e){}
    S=newGame(); UI.confirm=null; UI.bagSel=null; UI.tab='combat'; UI.zone=0; UI.stage=1; UI.hero=null; UI.invHero=null; UI.fItem=null; UI.fLast=null; render();
  },
  cancelReset:()=>{UI.confirm=null;render()},
};
document.addEventListener('click',e=>{
  if(noClick){noClick=false;return}
  const b=e.target.closest('[data-act]'); if(!b) return;
  if(b.tagName==='INPUT'&&b.type==='checkbox'){A[b.dataset.act](b.dataset);return}
  if(b.tagName==='INPUT') return;
  if(A[b.dataset.act]) A[b.dataset.act](b.dataset);
});
document.addEventListener('input',e=>{
  if(e.target.id==='cname') UI.cname=e.target.value;
});
document.addEventListener('change',e=>{
  if(e.target.id==='flvl'){UI.fLvl=+e.target.value;render()}
});

/* ============ démarrage ============ */
S=loadSave()||newGame();
if(S.heroes.length){
  const away=(Date.now()-S.last)/1000;
  if(away>0) produce(Math.min(away,8*3600));
  S.last=Date.now();
  UI.zone=S.prog.zone; UI.stage=S.prog.stage;
  if(MIG_MSG){const m=MIG_MSG;MIG_MSG='';setTimeout(()=>toast(m),900);save()}
  if(away>120){const h=Math.floor(away/3600),m=Math.floor(away%3600/60);setTimeout(()=>toast(`Absent ${h?h+' h ':''}${m} min : vos zones de collecte ont travaillé.`),400)}
}
S.speed=S.speed||1;
render();
setInterval(tick,1000);
setInterval(()=>{if(S.heroes.length)save()},10000);
document.addEventListener('visibilitychange',()=>{if(document.hidden&&S.heroes.length)save()});
</script>

</body></html>
