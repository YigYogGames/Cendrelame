<style>
/* Concept : un bureau de cuir brun, une grande feuille de parchemin au centre, encre brune et sceau de cire rouge pour l'action principale. */
:root{

/* generic */
.panel{background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:16px;min-width:0;box-shadow:inset 0 0 26px #9a6a2a22}

.grid{display:grid;gap:14px}
.g2{grid-template-columns:repeat(auto-fit,minmax(min(100%,320px),1fr))}
.g3{grid-template-columns:repeat(auto-fit,minmax(min(100%,260px),1fr))}
.row{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.between{justify-content:space-between}
.btn{background:var(--bg3);border:1px solid var(--line2);border-radius:3px;padding:7px 13px;cursor:pointer;font-weight:500;color:var(--fg)}

input[type=text]{background:#efe2c4;border:1px solid var(--line2);border-radius:3px;padding:8px 10px;width:100%;max-width:340px}

.acts{display:flex;flex-wrap:wrap;gap:8px;align-items:stretch}
.skpanel .skh{margin:14px 0 8px;font-size:1.05rem;text-align:center}
.skrow{display:flex;gap:14px;justify-content:center;flex-wrap:wrap;padding:6px 0}
.sktile{position:relative;width:52px;height:52px;padding:0;border-radius:9px;border:2px solid #1d1209;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--co) 70%,#fff),var(--co) 55%,#1d1209 130%);display:grid;place-items:center;cursor:pointer;color:#fff8e6;box-shadow:inset 0 0 8px #0007,0 2px 4px #0005;transition:transform .12s}
.sktile:hover{transform:translateY(-2px)}
.sktile svg{width:30px;height:30px;fill:currentColor;filter:drop-shadow(0 1px 1px #000b)}
.sktile.pas{border-radius:50%}
.sktile:not(.got){filter:saturate(.35) brightness(.85)}
.sktile.lock{filter:grayscale(1) brightness(.55)}
.sktile.avail{box-shadow:0 0 0 2px var(--gold),0 0 12px #e8c982cc}
.sktile.sel{outline:3px solid var(--blood);outline-offset:3px}
.sktile .rk{position:absolute;bottom:-7px;right:-9px;font-size:.66rem;line-height:1.3;background:#1d1209;color:var(--gold);border-radius:8px;padding:0 5px;font-weight:700;font-variant-numeric:tabular-nums}
.sktile .eqm{position:absolute;top:-7px;left:-7px;width:17px;height:17px;border-radius:50%;background:var(--verd);color:#fff;font-size:.7rem;display:grid;place-items:center;border:1px solid #1d1209}
.specs{display:grid;grid-template-columns:1fr 1fr;gap:16px}.specs.one{grid-template-columns:1fr;max-width:420px;margin:0 auto}
.speccol{display:flex;flex-direction:column;align-items:center;gap:6px;border:1px solid var(--line);border-radius:6px;padding:10px;background:#e8d9b522}
.speccol h4{display:flex;align-items:center;gap:6px;margin:0;font-size:1.15rem;color:var(--co)}.speccol h4 svg{width:22px;height:22px;fill:currentColor}
.speccol .hint{text-align:center;margin:0}
.speccol.lockd .tree{opacity:.75}
.tree{position:relative;width:300px;height:570px;margin:6px auto}
.tree .links line.sep{stroke:var(--line2);stroke-width:1;stroke-dasharray:3 4;opacity:.6}
.tlab{position:absolute;left:0;right:0;text-align:center;font-size:.7rem;font-weight:700;text-transform:uppercase;letter-spacing:.1em;color:var(--mute)}
.sktile.ultn{width:60px;height:60px}
.tree .links{position:absolute;inset:0;width:100%;height:100%}
.tree .links line{stroke:#7a6040;stroke-width:3;stroke-linecap:round;opacity:.45}
.tree .links line.on{stroke:var(--co);opacity:1}
.tree .sktile{position:absolute}
.skdet{max-width:460px;margin:14px auto 0;display:flex;flex-direction:column;gap:8px}
.skdet .it{max-width:none}
.it.skt .lockr{color:var(--blood);font-weight:700}
.forget{justify-content:space-between;gap:10px;margin-top:16px;border-top:1px solid var(--line);padding-top:10px;flex-wrap:wrap}
.skcbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.skc{position:relative;width:50px;height:50px;padding:0;border-radius:9px;border:2px solid #1d1209;background:radial-gradient(circle at 35% 30%,color-mix(in srgb,var(--co) 70%,#fff),var(--co) 55%,#1d1209 130%);display:grid;place-items:center;cursor:pointer;color:#fff8e6;box-shadow:inset 0 0 8px #0007,0 2px 4px #0005}
.skc svg{width:28px;height:28px;fill:currentColor;filter:drop-shadow(0 1px 1px #000b)}
.skc:hover:not(.off){box-shadow:0 0 0 2px var(--gold),inset 0 0 8px #0007}
.skc.sel{outline:3px solid var(--blood);outline-offset:2px}
.skc.off{filter:grayscale(.85) brightness(.6);cursor:not-allowed}
.skc .apk{position:absolute;bottom:-6px;left:-6px;font-style:normal;font-size:.68rem;font-weight:700;background:#d39a1c;color:#1d1209;border-radius:8px;padding:0 5px;border:1px solid #7a5310}
.skc .cdo{position:absolute;inset:0;display:grid;place-items:center;font-size:1.3rem;font-weight:700;color:#fff;text-shadow:0 1px 3px #000}
@media (max-width:620px){.specs{grid-template-columns:1fr}}
.skb{background:var(--bg3);border:1px solid var(--line2);border-radius:3px;padding:8px 12px;cursor:pointer;text-align:left;min-width:128px;display:flex;flex-direction:column}
.acts .btn.sm{align-self:center}
.skb:hover:not(:disabled){border-color:var(--brass)}
.skb.sel{border-color:var(--blood);color:var(--blood)}
.skb:disabled{opacity:.45;cursor:not-allowed}
.skb small{font-size:.78rem}
.log{height:150px;overflow-y:auto;background:#2a1c12;border:1px solid #1d1209;border-radius:3px;padding:8px 10px;font-size:.88rem;color:#c9ae82;box-shadow:inset 0 0 14px #0008}
.log p{margin:0}.log .rd{color:var(--gold);margin-top:4px}.log .cr{color:#f0944f}.log .hl{color:#a4d47f}.log .ev{color:#f3e4c0}
.result{border:1px solid var(--brass);border-radius:4px;padding:16px;background:#7b2a1a0d}
.result.lose{border-color:var(--blood);background:#a5351f12}
.result h2.lose{color:var(--blood)}
.lvup{color:var(--ok);font-weight:700}

/* sites */
.site .rates{display:flex;flex-wrap:wrap;gap:2px 14px;font-size:.9rem;color:var(--mute)}
.site .rates span{display:inline-flex;align-items:center;gap:4px}
.stk{display:grid;grid-template-columns:96px 1fr auto;gap:8px;align-items:center;font-size:.92rem}
.stk .lab{display:inline-flex;align-items:center;gap:5px}

/* équipement : mannequin */
.det{position:relative;margin-top:12px;border-color:var(--brass)}
.det .x{position:absolute;top:6px;right:8px;width:28px;height:28px;border-radius:50%;border:1px solid var(--line);background:transparent;color:var(--mute);font-size:1.1rem;line-height:1;cursor:pointer}
.det .x:hover{color:var(--fg)}
.det h3{margin:0 30px 8px 0}
.det .it{max-width:none}

.inv-layout{display:grid;gap:16px;grid-template-columns:minmax(0,360px) minmax(0,1fr);align-items:start}
@media (max-width:860px){.inv-layout{grid-template-columns:minmax(0,1fr)}}
.stats.two{grid-template-columns:1fr auto 1fr auto}
.doll{position:relative;width:min(100%,320px);aspect-ratio:300/440;margin:0 auto;user-select:none;-webkit-user-select:none}
.doll .body{position:absolute;inset:0;width:100%;height:100%}
.adv *{stroke:#3a2616;stroke-width:2;stroke-linejoin:round;stroke-linecap:round}
.adv .cape{fill:hsl(var(--h) 42% 27%)}
.adv .capein{fill:hsl(var(--h) 35% 20%)}
.adv .tun{fill:hsl(var(--h) 30% 42%)}
.adv .tunl{fill:none;stroke:hsl(var(--h) 30% 30%);stroke-width:1.5}
.adv .scf{fill:hsl(var(--h) 48% 52%)}
.adv .skin{fill:#e3b98e}
.adv .hair{fill:#5b3a1e}
.adv .lth{fill:#7a5430}
.adv .dk{fill:#3f2b19}
.adv .pant{fill:#6c5a44}
.adv .roll{fill:#8f7350}
.adv .gold{fill:#d0a548;stroke:#5e4512}
.adv .eye{fill:#2a1a0d;stroke:none}
.adv .cn{fill:none;stroke:var(--line2);stroke-width:1.4;stroke-dasharray:3 3}
.adv .dot{fill:var(--line2);stroke:none}
.dslot{position:absolute;aspect-ratio:1/1;display:grid;place-items:center;padding:0;cursor:pointer;background:#ead9b3;border:1px dashed var(--line2);border-radius:2px;color:var(--line2)}
.dslot.full{touch-action:none;cursor:grab}
.dslot.fit{outline:2px dashed var(--verd);outline-offset:2px}
.dslot.over{outline:3px solid var(--gold);outline-offset:2px;box-shadow:0 0 14px #e8c982}
.dslot.drag{opacity:.35}
.dslot svg{width:58%;height:58%;fill:currentColor;pointer-events:none}
.dslot.full{border:2px solid var(--rc);background:color-mix(in srgb,var(--rc) 16%,#ead9b3);color:var(--rc);box-shadow:0 0 10px -3px var(--rc)}
.dslot:hover,.dslot.sel{outline:2px solid var(--brass);outline-offset:2px}
.dslot em{position:absolute;top:1px;right:3px;font-style:normal;font-size:.68rem;font-weight:700;color:var(--brass)}
#tip{position:fixed;z-index:100;width:250px;max-width:calc(100vw - 16px);pointer-events:none;filter:drop-shadow(0 8px 20px #000a);color:var(--fg)}
#tip .it{background:var(--bg2);background-image:linear-gradient(160deg,color-mix(in srgb,var(--rc) 14%,var(--bg2)),var(--bg2) 62%)}

/* inventaire : grille 12 x 4 */
.bagwrap{overflow-x:auto;padding:2px;scrollbar-width:thin}
.bag{position:relative;display:grid;grid-template-columns:repeat(14,minmax(30px,60px));width:fit-content;margin-left:auto;margin-right:auto;gap:3px;min-width:calc(14 * 30px + 13 * 3px + 16px);padding:7px;background:#3a2817;border:1px solid #1d1209;border-radius:3px;box-shadow:inset 0 0 22px #000b,0 1px 0 #f4e8c855;user-select:none;-webkit-user-select:none}
.cell{position:relative;aspect-ratio:1/1;min-width:0;display:grid;place-items:center;padding:0;margin:0;background:linear-gradient(160deg,#4d3621,#35251a);border:1px solid #20150c;border-radius:2px;box-shadow:inset 0 0 8px #0009;color:#f3e4c0}
.cell svg{width:66%;height:66%;pointer-events:none}
.cell.full{cursor:grab;touch-action:none}
.cell.mat{background:linear-gradient(160deg,#6a4c2f,#4a3320);border-color:#8a6a40}
.cell.it{border:2px solid color-mix(in srgb,var(--rc) 75%,#fff 10%);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 45%,#4d3621),#35251a 85%);color:color-mix(in srgb,var(--rc) 30%,#fff0d0)}
.cell.it svg{fill:currentColor;width:58%;height:58%}
.cell .q{position:absolute;right:2px;bottom:0;font-size:.66rem;font-weight:700;font-variant-numeric:tabular-nums;color:#fff3d6;text-shadow:0 1px 2px #000,0 0 3px #000;pointer-events:none}
.cell .u{position:absolute;left:2px;top:0;font-size:.64rem;font-weight:700;color:var(--gold);text-shadow:0 1px 2px #000;pointer-events:none}
.cell.sel{outline:2px solid var(--gold);outline-offset:1px}
.cell.over{box-shadow:inset 0 0 0 2px var(--gold),0 0 10px #e8c98288}
.cell.drag{opacity:.3}
.bag.multi .cell.full{cursor:pointer;touch-action:auto}
.cell.pick{outline:2px solid #e0563a;outline-offset:1px}
.cell.pick::after{content:"✕";position:absolute;inset:0;display:grid;place-items:center;background:#a5351f99;color:#fff3d6;font-weight:700;font-size:1.4rem;pointer-events:none}
.btn.warn{background:var(--blood);color:#fff3d6;border-color:#5a1a0e;font-weight:700}
.btn.warn:hover:not(:disabled){background:#8c2a17;color:#fff}
.cell:focus-visible{outline-color:var(--gold)}
.seg{display:inline-flex;border:1px solid var(--line2);border-radius:3px;overflow:hidden}
.seg button{background:var(--bg3);border:0;padding:8px 18px;cursor:pointer;font-weight:700;color:var(--mute)}
.seg button+button{border-left:1px solid var(--line2)}
.seg button.on{background:var(--brass);color:#f7e9c6}
.forge-row{display:flex;flex-wrap:wrap;gap:18px 22px;align-items:flex-start}
.fcol{display:flex;flex-direction:column;gap:6px;flex:1 1 220px;min-width:0}
.fcol h3{font-size:.95rem;color:var(--mute);margin:0 0 4px}
.wpick{display:inline-flex;flex-direction:column;align-items:center;gap:2px;width:68px;padding:6px 4px;background:var(--bg3);border:1px solid var(--line2);border-radius:3px;cursor:pointer;font-size:.82rem;color:var(--fg)}
.wpick svg{width:26px;height:26px;fill:currentColor}
.wpick.on{border-color:var(--brass);color:var(--brass);box-shadow:0 0 0 1px var(--brass);font-weight:700}
.carousel{display:flex;align-items:center;gap:8px}
.arw{flex:none;width:38px;height:38px;border-radius:50%;border:1px solid var(--line2);background:var(--bg3);cursor:pointer;font-size:1.6rem;line-height:1;color:var(--brass);padding:0 0 3px}
.arw:hover{border-color:var(--brass);background:#efe2c4}
.ctr{flex:1;min-width:0;text-align:center;display:flex;flex-direction:column;gap:3px;padding:6px 4px;border:1px solid var(--line);border-radius:3px;background:#e8d9b555}
.ctr b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:var(--brass)}
.ctr small{font-size:.8rem}
.dots{display:flex;gap:5px;justify-content:center}
.dots i{width:7px;height:7px;border-radius:50%;background:var(--line)}
.dots i.on{background:var(--brass)}
.fslot{position:relative;width:104px;height:104px;display:grid;place-items:center;text-align:center;padding:8px;background:linear-gradient(160deg,#4d3621,#35251a);border:2px dashed #8a6a40;border-radius:3px;box-shadow:inset 0 0 14px #000a;color:#c9ae82;font-size:.8rem}
.fslot.full{border:2px solid color-mix(in srgb,var(--rc) 75%,#fff 10%);background:linear-gradient(160deg,color-mix(in srgb,var(--rc) 45%,#4d3621),#35251a 85%);color:color-mix(in srgb,var(--rc) 30%,#fff0d0)}
.fslot svg{width:60%;height:60%;fill:currentColor}
.fslot em{position:absolute;left:5px;top:2px;font-style:normal;font-weight:700;color:var(--gold)}
.fginv{justify-content:space-between;gap:10px;margin:14px 0 0;flex-wrap:wrap}
#fslot.full{cursor:grab;touch-action:none}
.fslot.over{border-color:var(--gold);box-shadow:inset 0 0 14px #000a,0 0 14px #e8c982}
.up-acts{display:grid;gap:8px;grid-template-columns:repeat(auto-fit,minmax(min(100%,220px),1fr))}
.rs2{display:inline-flex;align-items:center;gap:4px}
.fullbar{background:var(--blood);color:#fff3d6;font-weight:700;text-align:center;padding:10px 14px;border-radius:3px;margin-bottom:14px;border:1px solid #5a1a0e;box-shadow:0 0 14px #a5351f66;letter-spacing:.02em}
.prism{display:flex;align-items:center;gap:6px;margin-top:10px;padding:6px 8px;border:1px dashed var(--r5);border-radius:3px;cursor:pointer;font-weight:500}

.prism input{accent-color:var(--r5)}
.shopgrid{display:grid;gap:12px;grid-template-columns:repeat(auto-fill,minmax(min(100%,280px),1fr))}
.shopc{background:var(--bg2);border:1px solid var(--line);border-radius:3px;padding:12px 14px;box-shadow:inset 0 0 20px #9a6a2a22}

.potico{display:grid;place-items:center;width:52px;height:52px;flex:none;background:linear-gradient(160deg,#6a4c2f,#4a3320);border:1px solid #8a6a40;border-radius:3px}

.potbar{display:flex;flex-wrap:wrap;gap:6px;align-items:center}

.potb span{position:absolute;right:2px;bottom:0;font-size:.68rem;font-weight:700;color:#fff3d6;text-shadow:0 1px 2px #000}
.potb:hover:not(:disabled){border-color:var(--gold)}
.potb:disabled{opacity:.4;cursor:not-allowed}
.seg button.hero.on{background:var(--blood)}
.heropanel{border-color:var(--blood);box-shadow:inset 0 0 30px #a5351f33}
.mythpanel{border-color:var(--r3);box-shadow:inset 0 0 34px #6a2f9e40}
.seg button.myth.on{background:var(--r3)}
.seg button:disabled{opacity:.5;cursor:not-allowed}
.herotag.myth{background:var(--r3)}
.herotag{font-family:var(--body);font-size:.75rem;font-weight:700;letter-spacing:.08em;text-transform:uppercase;color:#fff3d6;background:var(--blood);border-radius:2px;padding:2px 7px;vertical-align:middle}
.adv-layout{display:grid;gap:16px;grid-template-columns:minmax(0,280px) minmax(0,1fr);align-items:start}
@media (max-width:760px){.adv-layout{grid-template-columns:minmax(0,1fr)}}
.herocol{display:flex;flex-direction:column;align-items:center;text-align:center}
.herocol h2{margin-top:10px}
.herocol .stats{text-align:left}
.herocol label{align-self:flex-start}
.tile.xl{width:88px;height:88px}.tile.xl svg{width:54px;height:54px}
.seg.wide{display:flex;width:100%}.seg.wide button{flex:1;padding:10px 8px}
.zgrid{display:grid;gap:8px;grid-template-columns:repeat(auto-fill,minmax(min(100%,200px),1fr));margin-top:14px}
.ztile{display:flex;flex-direction:column;gap:2px;text-align:left;padding:10px 12px;background:var(--bg3);border:1px solid var(--line2);border-radius:2px;cursor:pointer;color:var(--fg)}
.ztile b{font-family:var(--display);font-weight:400;font-size:1.05rem;letter-spacing:.03em}
.ztile small{font-size:.8rem}
.ztile .zp{font-size:.75rem;font-weight:700;text-transform:uppercase;letter-spacing:.06em;color:var(--mute);margin-top:2px}
.ztile.clear .zp{color:var(--verd)}
.ztile:hover:not(:disabled){border-color:var(--brass)}
.ztile.on{border-color:var(--brass);box-shadow:0 0 0 1px var(--brass);background:#efe2c4}
.ztile.on b{color:var(--brass)}
.ztile:disabled{opacity:.45;cursor:not-allowed}
.sheethead{display:flex;flex-direction:column;align-items:center;text-align:center;gap:6px;margin-bottom:14px}
.sheethead h2{font-size:1.7rem}
.invhead h2{font-size:2.2rem;font-weight:700;letter-spacing:.02em}
.portrait{width:114px;height:114px;display:block;filter:drop-shadow(0 3px 6px #0006)}
.sheethead .stars{color:var(--r2);letter-spacing:.15em}
.hsec{background:var(--bg2);border:1px solid var(--line);border-radius:3px;margin-bottom:10px}

.hbody{padding:10px 14px 14px}

.htab{overflow-x:auto}

.htab tbody th{white-space:nowrap;color:var(--fg)}
.hbody .b-dot{color:var(--blood);font-weight:700}.hbody .b-stun{color:var(--r2);font-weight:700}.hbody .b-buff{color:var(--verd);font-weight:700}.hbody .b-taunt{color:var(--brass);font-weight:700}
.doll.img{aspect-ratio:300/450;border-radius:4px;overflow:hidden;box-shadow:0 4px 14px #0006}
.doll .dollbg{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;pointer-events:none;user-select:none}
.doll.img .dslot:not(.full){background:#1a1410aa;border:1px dashed #c9b48acc;color:#d8c8a4}

.doll.rune{aspect-ratio:300/340;width:min(100%,330px);border-radius:4px;overflow:hidden;box-shadow:0 4px 14px #0006}

.doll.rune .dslot.full{background:color-mix(in srgb,var(--rc) 45%,#4a3420);border:2px solid color-mix(in srgb,var(--rc) 70%,#fff 15%);color:color-mix(in srgb,var(--rc) 25%,#fff0d0);box-shadow:0 0 12px var(--rc)}

.fA{display:grid;gap:16px;grid-template-columns:minmax(0,200px) minmax(0,1fr) minmax(0,270px);align-items:stretch}

.ftypes button{display:flex;align-items:center;gap:10px;padding:7px 10px;border:1px solid var(--line2);border-radius:3px;background:var(--bg3);cursor:pointer;color:var(--fg);text-align:left;font:inherit}

/* cadres scintillants */
@property --pa{syntax:'<angle>';inherits:false;initial-value:0deg}
@property --pp{syntax:'<percentage>';inherits:false;initial-value:-30%}
.pc1top .mpport,.pc1top .mpunk,.pc2l .mpport,.pc2l .mpunk{border-width:3px}
.pcfx{border-color:transparent!important}
.pcfx .pc1top .mpport,.pcfx .pc1top .mpunk,.pcfx .pc2l .mpport,.pcfx .pc2l .mpunk{border-color:transparent!important}
/* fond de bordure : le contenu garde son fond, la bordure montre l'effet */
.pc1.pcfx,.pc2.pcfx{background-origin:border-box;background-clip:padding-box,border-box}
.pc1.pcfx{background-color:transparent;background-image:linear-gradient(#140b05,#140b05),var(--fxg)}
.pc2.pcfx{background-image:linear-gradient(#140b05,#140b05),var(--fxg)}
.pcfx .pc1top .mpport,.pcfx .pc2l .mpport,.pcfx .pc1top .mpunk,.pcfx .pc2l .mpunk{background-origin:border-box;background-clip:padding-box,border-box;background-image:linear-gradient(#000,#000),var(--fxg)}
.pcfx .pc1top .mpunk,.pcfx .pc2l .mpunk{background-image:radial-gradient(circle at 50% 35%,#4a3a2a,#120a05),var(--fxg)}
/* 1 reflet balayant */
[data-fx=sweep]{--fxg:linear-gradient(115deg,var(--fr) 0%,var(--fr) calc(var(--pp) - 14%),var(--fl) var(--pp),var(--fr) calc(var(--pp) + 14%),var(--fr) 100%)}
.pcfx[data-fx=sweep],.pcfx[data-fx=sweep] .pc1top .mpport,.pcfx[data-fx=sweep] .pc2l .mpport,.pcfx[data-fx=sweep] .mpunk,.pcfr[data-fx=sweep]{animation:pcSweep 3s ease-in-out infinite}
.pcfx[data-fx=sweep] .mpport,.pcfx[data-fx=sweep] .mpunk{--fxg:linear-gradient(115deg,var(--fr) 0%,var(--fr) calc(var(--pp) - 14%),var(--fl) var(--pp),var(--fr) calc(var(--pp) + 14%),var(--fr) 100%)}
@keyframes pcSweep{0%{--pp:-30%}55%,100%{--pp:130%}}
/* 2 halo tournant */
[data-fx=halo],.pcfx[data-fx=halo] .mpport,.pcfx[data-fx=halo] .mpunk{--fxg:conic-gradient(from var(--pa),var(--fr),var(--fl) 12%,var(--fr) 25%,color-mix(in srgb,var(--fr) 35%,#000) 50%,var(--fr) 75%,var(--fl) 87%,var(--fr))}
.pcfx[data-fx=halo],.pcfx[data-fx=halo] .mpport,.pcfx[data-fx=halo] .mpunk,.pcfr[data-fx=halo]{animation:pcSpin 4s linear infinite}
@keyframes pcSpin{to{--pa:360deg}}
/* 3 étincelles */
[data-fx=spark],.pcfx[data-fx=spark] .mpport,.pcfx[data-fx=spark] .mpunk{--fxg:linear-gradient(135deg,var(--fr),color-mix(in srgb,var(--fr) 65%,#fff),var(--fr))}
.pcsp{position:absolute;z-index:4;width:18px;height:18px;background:#fff;clip-path:polygon(50% 0,58% 42%,100% 50%,58% 58%,50% 100%,42% 58%,0 50%,42% 42%);filter:drop-shadow(0 0 4px var(--fr));opacity:0;animation:pcTw 2.4s ease-in-out infinite;pointer-events:none}
.pc1 .s1{top:18px;left:calc(50% - 66px)}.pc1 .s2{top:12px;left:calc(50% + 46px);animation-delay:.9s}.pc1 .s3{top:96px;left:calc(50% + 52px);animation-delay:1.6s}.pc1 .s4{top:90px;left:calc(50% - 70px);animation-delay:.5s}.pc1 .s5{top:6px;left:calc(50% - 6px);animation-delay:1.3s;width:12px;height:12px}
.pc2 .s1{top:10px;left:18px}.pc2 .s2{top:14px;left:112px;animation-delay:.9s}.pc2 .s3{bottom:12px;left:110px;animation-delay:1.6s}.pc2 .s4{bottom:16px;left:14px;animation-delay:.5s}.pc2 .s5{top:10px;right:24px;animation-delay:1.3s}
@keyframes pcTw{0%,100%{opacity:0;transform:scale(.3) rotate(0)}50%{opacity:1;transform:scale(1) rotate(45deg)}}
/* 4 braise vivante */
[data-fx=pulse],.pcfx[data-fx=pulse] .mpport,.pcfx[data-fx=pulse] .mpunk{--fxg:linear-gradient(135deg,var(--fr),var(--fl),var(--fr))}
.pcfx[data-fx=pulse],.pcfr[data-fx=pulse]{animation:pcPulse 2.2s ease-in-out infinite}
.pcfx[data-fx=pulse] .mpport,.pcfx[data-fx=pulse] .mpunk{animation:pcPulseR 2.2s ease-in-out infinite}
@keyframes pcPulse{0%,100%{box-shadow:0 12px 28px #000a,0 0 10px color-mix(in srgb,var(--fr) 30%,transparent);filter:brightness(.92)}50%{box-shadow:0 12px 28px #000a,0 0 30px var(--fr),0 0 56px color-mix(in srgb,var(--fr) 40%,transparent);filter:brightness(1.18)}}
@keyframes pcPulseR{0%,100%{box-shadow:0 0 6px color-mix(in srgb,var(--fr) 40%,transparent)}50%{box-shadow:0 0 24px var(--fr)}}
/* 5 prisme holographique */
[data-fx=holo],.pcfx[data-fx=holo] .mpport,.pcfx[data-fx=holo] .mpunk{--fxg:conic-gradient(from var(--pa),#ff6a8a,#ffd36a,#8fff8a,#6ae0ff,#8a7aff,#ff6ad8,#ff6a8a)}
.pcfx[data-fx=holo],.pcfx[data-fx=holo] .mpport,.pcfx[data-fx=holo] .mpunk,.pcfr[data-fx=holo]{animation:pcSpin 6s linear infinite}
.pcfx[data-fx=holo]::after{content:'';position:absolute;inset:0;z-index:5;background:linear-gradient(115deg,transparent 30%,#ffffff1f 45%,#9ff3ff24 50%,#ffb0f024 55%,transparent 70%);background-size:250% 100%;animation:pcHol 4s linear infinite;pointer-events:none;border-radius:inherit}
@keyframes pcHol{from{background-position:120% 0}to{background-position:-120% 0}}
.pcfx{box-shadow:0 0 0 2px #21150b,0 12px 28px #000a,0 0 24px color-mix(in srgb,var(--fr) 45%,transparent)}

.mfwork{display:grid;grid-template-columns:minmax(230px,.9fr) minmax(320px,1.2fr) minmax(260px,1fr);gap:14px;height:calc(100vh - 310px);min-height:430px}
.mabody.noside{grid-template-columns:1fr!important}
.mfl,.mfr{background:#efe2c0;border:1px solid #c9ad7a;border-radius:12px;padding:14px 16px;overflow:auto;color:#2a1a0c}
.mfl h3,.mfr h3{margin:0 0 6px;color:#7b2a1a}.mfl h4,.mfr h4{margin:12px 0 6px;color:#7b2a1a;font-size:.95rem}
.mfsteps{margin:0;padding-left:20px;display:flex;flex-direction:column;gap:7px;font-size:.9rem;line-height:1.35}.mfsteps ul{margin:4px 0 0;padding-left:16px;display:flex;flex-direction:column;gap:3px}
.mftip{margin:10px 0 0;padding:8px 10px;border-radius:8px;background:#7b2a1a14;border-left:3px solid #7b2a1a;font-size:.85rem}
.mfc{position:relative;border-radius:14px;overflow:hidden;background:radial-gradient(ellipse at 50% 40%,#4a3020,#140d08 75%);border:2px solid #6b4a22;display:flex;flex-direction:column;align-items:center;padding:14px;color:#f0dfb8}
.mfc:before{content:'';position:absolute;inset:0;background:radial-gradient(circle at 50% 42%,#e8a13a22,#0000 55%);pointer-events:none}
.mfhead{position:relative;display:flex;align-items:center;gap:10px;flex-wrap:wrap;justify-content:center;padding:6px 14px;border-radius:20px;background:#0008;border:1px solid #d6aa5544}
.mfhead b{font-family:var(--display);font-weight:400;font-size:1.15rem;color:#f6e6bd}.mfhead small{font-weight:700}
.mfaffc{display:flex;align-items:center;gap:6px;font-size:.85rem;color:#cdb68a;padding-left:10px;border-left:1px solid #d6aa5544}.mfaffc b{color:#f6e6bd}
.mfpips{display:flex;gap:3px}.mfpips i{width:12px;height:12px;border-radius:50%;border:2px solid #8a6a44;background:#0006}.mfpips i.on{background:#e8c060;border-color:#f0d48a}.mfpips i.on.main{background:#e8a13a}

const bagNew=()=>[];
/* S.bag = liste d'entrées {x,y,o} ; o = {mat,n} ou objet d'équipement */
function occGrid(bag,skip,W=GW,H=GH){
  const g=Array.from({length:H},()=>Array(W).fill(-1));
  bag.forEach((e,i)=>{ if(skip&&skip.includes(e)) return; const [w,h]=SIZE(e.o);
    for(let y=e.y;y<e.y+h&&y<H;y++) for(let x=e.x;x<e.x+w&&x<W;x++) g[y][x]=i });
  return g;
}
function fitsAt(bag,x,y,w,h,skip,W=GW,H=GH){
  if(x<0||y<0||x+w>W||y+h>H) return false;
  const g=occGrid(bag,skip,W,H);
  for(let yy=y;yy<y+h;yy++) for(let xx=x;xx<x+w;xx++) if(g[yy][xx]>=0) return false;
  return true;
}
function findSpot(bag,w,h,W=GW,H=GH){
  const g=occGrid(bag,null,W,H);
  for(let x=0;x<=W-w;x++) for(let y=0;y<=H-h;y++){
    let ok=true; for(let yy=y;yy<y+h&&ok;yy++) for(let xx=x;xx<x+w;xx++) if(g[yy][xx]>=0){ok=false;break}
    if(ok) return [x,y];
  }
  return null;
}
function bagAddMat(bag,k,n){
  n=Math.max(0,Math.floor(n||0));

function addCost(it,c){ if(!it.cost) it.cost=estCost(it); for(const [k,v] of Object.entries(c)) if(v) it.cost[k]=(it.cost[k]||0)+v }
function salvageValue(it){
  const v={}; for(const [k,x] of Object.entries(itemCost(it))){const n=Math.floor(x*.25); if(n>0) v[k]=n}
  v.pd_rune=(it.rarity||0)+1;
  return v;
}
const resTxt=v=>Object.entries(v).map(([k,n])=>fmt(n)+' '+MAT_N[k].toLowerCase()).join(', ')||'rien';
const resChips=v=>Object.entries(v).map(([k,n])=>matChip(k,n)).join('')||'<span class="mute">rien</span>';
function addInv(it){
  if(bagAddItem(S.bag,it)){markNew();return true}
  gain(salvageValue(it)); return false;
}
function markNew(){ if(UI.tab!=='heroes') S.bagDot=true }
function gain(c){for(const [k,v] of Object.entries(c)){ if(k==='gold')S.gold+=v; else if(isMatK(k)){const left=storeMat(k,v); if(left>0) noteLost(k,left)} else {const left=bagAddMat(S.bag,k,v); if(left>0) noteLost(k,left); if(Math.floor(v)-left>0) markNew()} }}
const DBG=()=>ACC.dbg||(ACC.dbg={});
const FREE=()=>!!DBG().free;
const hasGold=c=>FREE()||S.gold>=c;
const canPay=c=>FREE()||Object.entries(c).every(([k,v])=>(k==='gold'?S.gold:matAll(k))>=v);
function pay(c){if(FREE())return;for(const [k,v] of Object.entries(c)){ if(k==='gold')S.gold-=v; else removeMat(k,v) }}
const costHTML=c=>`<span class="cost">${Object.entries(c).filter(([,v])=>v>0).map(([k,v])=>{const have=k==='gold'?S.gold:matAll(k);return `<span class="${have>=v?'ok':'no'}" title="${MAT_N[k]}">${matIcon(k)}${fmt(v)}<span class="sr">${MAT_N[k]}</span></span>`}).join('')}</span>`;

function gearStats(h){
  const t={};
  for(const s of SLOTS){const it=h.equip[s]; if(it) for(const [k,v] of Object.entries(itemStats(it))) t[k]=(t[k]||0)+v}

function passMods(h){
  const t={};
  for(const sk of heroSkills(h)){
    if(sk.t!=='p'||!sk.mods) continue; const r=h.learned[sk.id]||0; if(!r) continue;
    for(const [k,v] of Object.entries(sk.mods)) t[k]=(t[k]||0)+v*r;
  }
  return t;
}
function heroStats(h){
  const c=CLASSES[h.cls],lv=h.lvl-1,star=1+.1*h.stars,g=gearStats(h),p=passMods(h);
  const b=k=>(c.base[k]+c.grow[k]*lv)*star;
  const pc=k=>(g[k+'Pct']||0)+(p[k+'Pct']||0);
  return {
    hp:(b('hp')+(g.hp||0))*(1+pc('hp')/100),
    atk:(b('atk')+(g.atk||0))*(1+pc('atk')/100),
    mag:(b('mag')+(g.mag||0))*(1+pc('mag')/100),
    def:(b('def')+(g.def||0))*(1+pc('def')/100),
    res:(b('res')+(g.res||0))*(1+pc('res')/100),
    spd:(b('spd')+(g.spd||0))*(1+pc('spd')/100),
    crit:Math.min(CRIT_CAP,5+(g.crit||0)+(p.crit||0)),
    critDmg:Math.min(CDMG_CAP,150+(g.critDmg||0)+(p.critDmg||0)),
    dodge:Math.min(30,(g.dodge||0)+(p.dodge||0)),
    lifesteal:Math.min(20,(g.lifesteal||0)+(p.lifesteal||0)),
    dmgPct:g.dmgPct||0,goldFind:g.goldFind||0,dropRate:g.dropRate||0,
    regen:p.regen||0,healPow:p.healPow||0,
    ap:5+(g.ap||0)+(p.ap||0),
    ...Object.fromEntries(RES_K.map(k=>[k,Math.min(RES_CAP,(g[k]||0)+(p[k]||0))])),
  };
}
function heroPower(h){
  const s=heroStats(h);
  return s.hp/8+Math.max(s.atk,s.mag)*2.2+s.def+s.res+s.spd*2+s.crit*1.5+s.critDmg*.2+s.dodge*2+s.lifesteal*3+s.dmgPct*3;
}
function gainXp(h,xp){
  h.xp+=xp; let ups=0;
  while(h.lvl<MAXL&&h.xp>=xpNeed(h.lvl)){h.xp-=xpNeed(h.lvl);h.lvl++;h.sp++;ups++}
  if(h.lvl>=MAXL)h.xp=0;
  return ups;
}
const sc=r=>1+.12*(r-1);
function skDesc(sk,rank,role,gx,asLines){

  const tgN={one:'un ennemi',all:'tous les ennemis',self:'vous',allies:'tous les alliés',lowAlly:'l’allié le plus blessé'}[sk.tg];
  const out=[];
  if(sk.ap&&!asLines) out.push(`Coût : ${sk.ap} PA.`);
  if(sk.el&&ELEM[sk.el]&&!asLines) out.push(`Élément : ${ELEM[sk.el].n}.`);
  if(sk.self) out.push(`Sacrifie ${Math.round(sk.self*100)} % de vos PV max.`);
  if(sk.mult) out.push(`Inflige ${p(sk.mult)}% ${stN}${sk.hits>1?' ×'+sk.hits:''} à ${tgN}${sk.exec?` (dégâts doublés sous ${sk.exec.thr}% PV)`:''}.`);
  if(sk.lowHp) out.push(`+${r1(sk.lowHp*10)} % de dégâts par tranche de 10 % de PV manquants.`);
  if(sk.ifSt) out.push(`+${Math.round(sk.ifSt.v*100)} % de dégâts contre une cible ${stTxt(sk.ifSt)}.`);
  if(sk.ls) out.push(`Vous rend ${sk.ls} % des dégâts infligés en PV.`);
  const sn={atk:'Force',def:'Défense',res:'Résistance',spd:'Vitesse',mag:'Intelligence'};
  for(const f of sk.fx||[]){
    if(f.k==='dot'){ const ch=fxCh(f,sk,gx); out.push(`${ch<100?ch+' % de chances d’infliger ':''}${f.n} : ${Math.round(p(f.v)*fxPow(f,gx))}% ${stN} par tour, ${fxDur(f,gx)} tours.`) }
    if(f.k==='para') out.push(`${fxCh(f,sk,gx)} % de chances de paralyser ${f.dur} tours : à chaque tour, la cible a ${paraPow(gx)} % de chances de perdre son tour (chances d’application réduites de moitié sur les boss).`);
    if(f.k==='det') out.push(`Fait exploser la ${f.n} de la cible : inflige immédiatement ${p(f.m)} % des dégâts qu’elle devait encore infliger.`);
    if(f.k==='stun') out.push(`${f.ch||100}% de chances d’étourdir ${f.dur} tour.`);
    if(f.k==='shield') out.push(f.of==='hp'?`Bouclier de ${p(f.v)}% des PV max.`:`Bouclier de ${p(f.v)}% INT.`);
    if(f.k==='heal') out.push(`Soigne ${p(f.v)}% INT${f.on==='allies'?' à tous les alliés':''}.`);
    if(f.k==='buff') out.push(`+${Math.round(f.v*k)}% ${sn[f.stat]} pendant ${f.dur} tours.`);
    if(f.k==='debuff') out.push(`${Math.round(f.v*k)}% ${sn[f.stat]} pendant ${f.dur} tours.`);
    if(f.k==='taunt') out.push(`Provoque les ennemis ${f.dur} tours.`);
  }
  if(!sk.mult&&!(sk.fx||[]).length) out.push('');
  if(asLines) return out.filter(Boolean);

}
const MOD_N={hpPct:'PV',atkPct:'Force',magPct:'Intelligence',defPct:'Défense',resPct:'Résistance',spdPct:'Vitesse',crit:'Critique',critDmg:'Dégâts critiques',dodge:'Esquive',lifesteal:'Vol de vie',regen:'PV max par tour',healPow:'Puissance des soins'};

const GX_N={bleedP:['+',' % de dégâts des Saignements'],burnP:['+',' % de dégâts des Brûlures'],vsBleed:['+',' % de dégâts contre les cibles qui saignent'],vsBurn:['+',' % de dégâts contre les cibles en feu'],vsPara:['+',' % de dégâts contre les cibles paralysées'],
  lowHpDmg:['+',' % de dégâts par tranche de 10 % de PV manquants'],lowHpDef:['−',' % de dégâts subis sous 35 % de PV'],paraCh:['+',' % de chances de paralyser (toutes vos compétences)'],paraPow:['+',' % de chances qu’une cible paralysée perde son tour'],
  bleedDur:['+',' tour de durée des Saignements'],burnDur:['+',' tour de durée des Brûlures']};
function heroGx(h){
  const g={sxCh:{}}; if(!h) return g;
  for(const sk of heroSkills(h)){ if(sk.t!=='p'||!(sk.gx||sk.ult)) continue; const r=h.learned[sk.id]||0; if(!r) continue;
    if(sk.ult){ g.ult=sk.ult; continue }
    for(const [k,v] of Object.entries(sk.gx)){ if(k==='sxCh'){ for(const [id,x] of Object.entries(v)) g.sxCh[id]=(g.sxCh[id]||0)+x*r } else g[k]=(g[k]||0)+v*r } }
  return g;
}
function pasLines(sk,r){
  const out=[];
  if(sk.ud) out.push(sk.ud.replace(/\.$/,''));
  for(const [k,v] of Object.entries(sk.mods||{})) out.push(`+${r1(v*r)} % ${MOD_N[k]}`);
  for(const [k,v] of Object.entries(sk.gx||{})){
    if(k==='sxCh'){ for(const [id,x] of Object.entries(v)){ const f=(SK[id].fx||[]).find(q=>q.ch!=null); out.push(`+${x*r} % de chances d’infliger ${f&&f.k==='para'?'la Paralysie':f?f.n:'l’effet'} avec ${SK[id].n}`) } }

}
const pasDesc=(sk,r)=>pasLines(sk,r).join(', ')+'.';
const hasSt=(t,k,n)=>!!(t&&t.st&&t.st.some(s=>s.k===k&&(!n||s.n===n)));

const fxDur=(f,g)=>f.dur+((g||{})[f.n==='Brûlure'?'burnDur':f.n==='Saignement'?'bleedDur':'x']||0);
const fxPow=(f,g)=>1+(((g||{})[f.n==='Brûlure'?'burnP':f.n==='Saignement'?'bleedP':'x']||0)/100);
const fxCh=(f,sk,g)=>f.ch==null?100:Math.min(100,f.ch+(((g||{}).sxCh||{})[sk.id]||0)+(f.k==='para'?((g||{}).paraCh||0):0));
const paraPow=g=>Math.min(90,50+((g||{}).paraPow||0));
/* multiplicateur de dégâts lié aux talents et aux effets (PvE, duels, raids) */
function skMul(u,t,sk){
  const g=u.gx||{}; let m=1; const miss=Math.max(0,1-Math.max(0,u.hp)/(u.maxHp||1));
  if(g.lowHpDmg) m*=1+g.lowHpDmg/100*miss*10;
  if(sk&&sk.lowHp) m*=1+sk.lowHp*miss;
  if(g.vsBurn&&hasSt(t,'dot','Brûlure')) m*=1+g.vsBurn/100;
  if(g.vsBleed&&hasSt(t,'dot','Saignement')) m*=1+g.vsBleed/100;
  if(g.vsPara&&hasSt(t,'para')) m*=1+g.vsPara/100;
  if(sk&&sk.ifSt&&(sk.ifSt.k==='para'?hasSt(t,'para'):hasSt(t,'dot',sk.ifSt.n))) m*=1+sk.ifSt.v;
  const tg=t.gx||{}; if(tg.lowHpDef&&t.hp/t.maxHp<.35) m*=Math.max(.3,1-tg.lowHpDef/100);
  for(const q of u.st||[]) if(q.k==='ult'&&q.dmg&&(!q.el||(sk&&sk.el===q.el))) m*=1+q.dmg/100;
  for(const q of t.st||[]) if(q.k==='ult'&&q.def) m*=1-q.def/100;
  return m;
}

  if(sk.cd) u.cds[sk.id]=sk.cd+1; if(sk.ap) u.ap=Math.max(0,u.ap-sk.ap); if(sk.id==='atk') u.atkUsed=true;
  L.push(sk.id==='atk'?`${u.name} attaque.`:`${u.name} utilise ${sk.n}.`); pvSelf(u,sk,L);
  if(sk.mult) for(let i=0;i<(sk.hits||1)&&t.hp>0;i++) pvHit(u,t,sk.mult*k,st,sk,L);
  for(const f of sk.fx||[]){
    const on=f.on||(sk.tg==='one'||sk.tg==='all'?'foe':'friend'),tg=on==='foe'?t:u; pvFx(u,tg,f,k,sk,L);
  }
  ultAfterCast(u,sk,[t],m=>L.push(m));
}
function pvFx(u,tg,f,k,sk,L){
  const st=sk.st||u.role; if(tg.hp<=0) return;
  {
    if(f.k==='dot'){ if(Math.random()*100>=fxCh(f,sk,u.gx)) return; tg.st=tg.st.filter(s=>!(s.k==='dot'&&s.n===f.n)); tg.st.push({k:'dot',n:f.n,v:Math.round(pvEff(u,st)*f.v*k*resMul(tg,st,sk.el)*fxPow(f,u.gx)),dur:fxDur(f,u.gx)}); L.push(`${tg.name} subit ${f.n}.`)}
    else if(f.k==='para'){ if(Math.random()*100<(fxCh(f,sk,u.gx)+ulPara(u))*(tg.boss?.5:1)){ tg.st=tg.st.filter(s=>s.k!=='para'); tg.st.push({k:'para',p:paraPow(u.gx),dur:f.dur}); L.push(`${tg.name} est paralysé !`) } }
    else if(f.k==='det'){ const q=tg.st.find(x=>x.k==='dot'&&x.n===f.n); if(q){ tg.st=tg.st.filter(x=>x!==q); let a=Math.max(1,Math.round(q.v*q.dur*f.m*k)); const d0=a; if(tg.shield>0){const z=Math.min(tg.shield,a); tg.shield-=z; a-=z} tg.hp=Math.max(0,tg.hp-a); L.push(`${f.n} : détonation, ${tg.name} subit ${d0} dégâts.`) } }
    else if(f.k==='taunt'){tg.st=tg.st.filter(s=>s.k!=='taunt'); tg.st.push({k:'taunt',dur:f.dur}); L.push(`${tg.name} provoque l’adversaire.`)}
    else if(f.k==='stun'){ if(Math.random()*100<(f.ch||100)*(tg.boss?.5:1)){tg.st=tg.st.filter(s=>s.k!=='stun'); tg.st.push({k:'stun',dur:f.dur}); L.push(`${tg.name} est étourdi !`)} }
    else if(f.k==='shield'){const a=f.of==='hp'?tg.maxHp*f.v*k:pvEff(u,'mag')*f.v*k; tg.shield=Math.round(Math.min(tg.maxHp,(tg.shield||0)+a)); L.push(`${tg.name} gagne un bouclier.`)}
    else if(f.k==='heal'){const a=Math.round(Math.min(tg.maxHp-tg.hp,pvEff(u,f.of||'mag')*f.v*k)); tg.hp+=a; L.push(`${tg.name} récupère ${a} PV.`)}
    else if(f.k==='buff'||f.k==='debuff'){const v=f.k==='debuff'?-Math.abs(f.v):f.v*k; tg.st=tg.st.filter(s=>!(s.k==='buff'&&s.stat===f.stat&&Math.sign(s.v)===Math.sign(v))); tg.st.push({k:'buff',stat:f.stat,v:Math.round(v),dur:f.dur})}
  }
}

function potFx(U,k,L,ctx){

  if(k==='p_vie'){const a=Math.round(Math.min(U.maxHp-U.hp,U.maxHp*.4)); U.hp+=a; L.push(`${U.name} boit une Potion de vie (+${a} PV).`)}
  else if(k==='p_res'){U.st=U.st.filter(s=>!(s.k==='buff'&&(s.stat==='def'||s.stat==='res')&&s.v>0)); U.st.push({k:'buff',stat:'def',v:40,dur:3},{k:'buff',stat:'res',v:40,dur:3}); L.push(`${U.name} boit une Potion de résistance.`)}

  stTick(U); for(const k in U.cds) U.cds[k]=Math.max(0,U.cds[k]-1); for(const q in (U.pcd||{})) U.pcd[q]=Math.max(0,U.pcd[q]-1); U.stun=false; U.atkUsed=false;

/* moteur (calculé par le joueur actif) */
const rdHeroes=x=>x.m.players.map(p=>x.u[p]);
const rdAliveH=x=>rdHeroes(x).filter(h=>h&&h.hp>0&&!h.left);
const rdOver=x=>x.u.boss.hp<=0?'win':!rdAliveH(x).length?'lose':null;
function rdState(){ const m=RD.match,me=pvpMe(),u=JSON.parse(JSON.stringify(m.u)); return {m,me,u,U:u[me],L:[],round:m.round||1} }
function rdEndOf(V){ stTick(V); for(const k in V.cds) V.cds[k]=Math.max(0,V.cds[k]-1); for(const q in (V.pcd||{})) V.pcd[q]=Math.max(0,V.pcd[q]-1); V.atkUsed=false; V.stun=false }
function rdExec(u,sk,tgt,x){
  const L=x.L,B=x.u.boss,heroes=rdAliveH(x),foesA=u.boss?heroes:(B.hp>0?[B]:[]),friA=u.boss?[B]:heroes;

  if(sk.cd) u.cds[sk.id]=sk.cd+1; if(sk.ap) u.ap=Math.max(0,u.ap-sk.ap); if(sk.id==='atk') u.atkUsed=true;

    const us=B.skills.filter(id=>!(B.cds[id]||0)&&B.ap>=(SK[id].ap||0)&&!(SK[id].tg==='allies'&&B.st.some(s=>s.k==='buff'&&s.v>0)));

/* coffre : placement simulé puis réel (tout ou rien) */
function mlPlace(att){
  const d=stashD(),tabs=d.tabs.map(T=>({T,bag:T.bag.map(e=>({x:e.x,y:e.y,o:Object.assign({},e.o)}))}));
  for(const [k,v0] of Object.entries(att)){ if(k==='gold'||!(v0>0)) continue; let n=Math.floor(v0);
    for(const t of tabs){ for(const e of t.bag){ if(n<=0) break; if(e.o.mat===k&&e.o.n<STACK){const m=Math.min(STACK-e.o.n,n);e.o.n+=m;n-=m} } }
    for(const t of tabs){ while(n>0){ const sp=findSpot(t.bag,1,1,SW,SH); if(!sp) break; const m=Math.min(STACK,n); t.bag.push({x:sp[0],y:sp[1],o:{mat:k,n:m}}); n-=m } if(n<=0) break }
    if(n>0) return null }
  return tabs;
}

  const tabs=mlPlace(tot);
  if(!tabs){ toast('Pas assez de place dans le coffre du compte : libérez des cases ou achetez un onglet, puis réessayez. Rien n’a été récupéré.'); return }
  for(const t of tabs) t.T.bag=t.bag;
  if(tot.gold) S.gold+=tot.gold;

/* ===== détection d'une nouvelle version déployée ===== */
const UPD={found:false,busy:false};
async function updCheck(){
  if(UPD.found||UPD.busy||!/^https?:$/.test(location.protocol)) return; UPD.busy=true;
  try{ const r=await fetch(location.pathname+'?v='+Date.now(),{cache:'no-store'}); if(r.ok){ const t=await r.text(),m=t.match(/const BUILD='(\d+)'/); if(m&&m[1]!==BUILD&&m[1]>BUILD) updShow(t.match(/const VERSION='(\d[^']*)'/)) } }catch(e){}
  UPD.busy=false;
}
function updShow(vm){ UPD.found=true; const b=$('#updbar'); if(!b) return; if(vm&&vm[1]&&vm[1]!==VERSION) b.querySelector('b').textContent=`La version ${vm[1]} de Cendrelame est disponible.`; b.hidden=false; document.body.classList.add('hasupd') }
setInterval(updCheck,120000); setTimeout(updCheck,15000);
document.addEventListener('visibilitychange',()=>{ if(!document.hidden) updCheck() });

/* ---------- sac de combat ---------- */
const CB_LIM={p_vie:10,p_res:3,p_for:3,p_int:3,p_pa:2,p_xp:1,p_loot:1};
const cbBag=()=>{ if(!S.cbag||typeof S.cbag!=='object') S.cbag={}; return S.cbag };
const cbCount=k=>(S&&S.cbag&&S.cbag[k])||0;
const cbTake=k=>{ const b=cbBag(); b[k]=Math.max(0,(b[k]||0)-1); if(!b[k]) delete b[k] };
const cbKeys=(cls)=>Object.keys(CB_LIM).filter(k=>POTS[k]&&!POTS[k].nocombat&&(!POTS[k].cls||POTS[k].cls===cls));
const cbTotal=()=>Object.values(S&&S.cbag||{}).reduce((a,b)=>a+b,0);
const cbBusy=()=>inFight()||[PV.match,RD.match].some(m=>m&&['prep','fight'].includes(m.state));
function cbIn(k,n){
  if(cbBusy()){ toast('Impossible pendant un combat.'); return }
  const room=CB_LIM[k]-cbCount(k),have=matAll(k),q=Math.min(n,room,have);
  if(q<=0){ toast(room<=0?'Limite atteinte pour cette potion.':'Vous n’avez plus de cette potion.'); return }
  removeMat(k,q); cbBag()[k]=cbCount(k)+q; save(); renderInvPop();
}
function cbOut(k,n){
  if(cbBusy()){ toast('Impossible pendant un combat.'); return }
  const q=Math.min(n,cbCount(k)); if(q<=0) return;
  if(matRoom(k)<q){ toast('Inventaire plein.'); return }
  bagAddMat(S.bag,k,q); const b=cbBag(); b[k]-=q; if(b[k]<=0) delete b[k]; save(); renderInvPop();
}
function cbPanel(){
  const lock=cbBusy(),h=S.heroes[0];

    return `<div class="cbrow"><span class="cbic" data-tip="pot:${k}">${matIcon(k)}</span><span class="cbn"><b>${esc(P.n)}</b><small>Réserve : <span class="num">${fmt(a)}</span></small></span>
     <span class="cbq num ${c>=L?'full':''}"><b>${c}</b>/${L}</span>
     <span class="cbbt"><button class="btn sm" data-act="cbOut" data-k="${k}" ${lock||!c?'disabled':''} ${ttip('Retirer 1','Remet une potion dans l’inventaire.')}>−</button><button class="btn sm" data-act="cbIn" data-k="${k}" data-n="1" ${lock||c>=L||!a?'disabled':''} ${ttip('Ajouter 1','Prend une potion dans l’inventaire ou le coffre.')}>+</button><button class="btn sm pri" data-act="cbIn" data-k="${k}" data-n="99" ${lock||c>=L||!a?'disabled':''} ${ttip('Remplir','Complète jusqu’à la limite.')}>Max</button></span></div>`}).join('');

function viewCombat(){
  if(C.phase==='idle') return viewCombatIdle();
  const al=C.units.filter(u=>u.team==='h').slice(0,3),en=C.units.filter(u=>u.team==='e').slice(0,3);
  const U=u=>`<div class="unit ftu ${u.team==='h'?'ally':'foe'} ${u.boss?'boss':''}" data-u="${u.id}" data-act="pick"><div class="ftpl"><b>${esc(u.name)} <small>niv. ${u.lvl}${u.boss?' · Boss':''}</small></b>${ftHp()}<div class="apbar" ${ttip('Points d’action')}>${Array.from({length:u.maxAp||0},()=>'<i></i>').join('')}</div><div class="stt"></div></div><div class="ftfig">${fighterArt(u.hero?{cls:u.hero.cls,skin:u.hero.skin}:{name:u.name,boss:u.boss,ic:u.ic,hue:u.hue,foe:1})}<i class="ftgr"></i></div><div class="fl"></div></div>`;
  return `<div class="cv ftc ${UI.cbOpen?'bagopen':''}"><div class="ftwrap"><div class="ftsc">${zoneScene(C.zone,'ft')}
    <div class="fttop"><h2>${ZONES[C.zone].n} · étape ${C.stage}${C.stage===10?' · Boss':''}${C.hero?` <span class="herotag ${C.diff}">${DIFF[C.diff].n}</span>`:''}</h2><span class="cvround num">Tour <b>${C.round}</b></span></div>
    <div class="cvinit ftinit" id="cvinit">${initBar()}</div>
    <div class="ftfield"><div class="ftside l">${al.map(U).join('')}</div><div class="ftside r">${en.map(U).join('')}</div></div></div>
    <button class="ftend" id="ftend" data-act="endTurn"></button></div>
   <div class="ftbot"><div id="actbar" class="ftbar"></div><div class="log" id="log">${C.logs.map(l=>`<p class="${l.cls}">${esc(l.t)}</p>`).join('')}</div><div id="cbslot"></div></div></div>`;
}
function ftTools(){
  return `<div class="fttools"><button class="ftsq ${S.auto?'on':''}" data-act="auto" aria-pressed="${!!S.auto}" ${ttip('Combat automatique : '+(S.auto?'activé':'désactivé'),'Votre héros joue seul. Cliquez pour '+(S.auto?'reprendre la main.':'l’activer.'))}>${uic('auto')}</button><button class="ftsq num" data-act="speed" ${ttip('Vitesse ×'+S.speed,'Accélère les animations du combat (×1, ×2, ×4).')}>×${S.speed}</button>${quitBtn('giveUp',UI.confirm==='pveGiveUp')}</div>`;
}
const quitBtn=(act,arm)=>`<button class="ftsq quit ${arm?'arm':''}" data-act="${act}" ${ttip(arm?'Confirmer l’abandon':'Abandonner',arm?'Cliquez à nouveau : le combat sera compté comme une défaite.':'Quitter le combat (compté comme une défaite).')}>${uic(arm?'check':'flag')}</button>`;
function ftEnd(b,{act,label,dis,tip}){ if(!b) return; b.hidden=!act; if(!act) return; b.dataset.act=act; b.disabled=!!dis; b.innerHTML=`<span>${label}</span>`; b.dataset.tip='tx:'+tip; b.setAttribute('aria-label',label.replace(/<br>/g,' ')) }
function renderActbar(){
  const el=$('#actbar'); if(!el) return; const end=$('#ftend'),slot=$('#cbslot');
  el.classList.remove('res');
  if(C.phase==='result'){ UI.cbOpen=false; if(slot) slot.innerHTML=''; $('.ftc')&&$('.ftc').classList.remove('bagopen'); renderActbar0(); el.classList.add('res'); ftEnd(end,{}); return }
  const h=C.units.find(x=>x.team==='h'),w=C.waiting,u=w?w.u:h;
  if(C.phase==='prep'){
    el.innerHTML=`${cbBtn()}<div class="ftprep"><b>Préparation <span class="num" data-prep>${Math.max(0,Math.ceil((C.prepEnd-Date.now())/1000))} s</span></b><small>Buvez vos potions avant le début du combat : leurs effets et leur recharge commencent maintenant.</small></div>${ftTools()}`;
    ftEnd(end,{act:'prepGo',label:'Combattre',tip:'Commencer le combat|Lance le combat sans attendre la fin de la préparation.'});
  }else{
    const ids=u?['atk',...u.skills]:[];
    el.innerHTML=`${cbBtn()}<div class="skcbar ${w?'':'wait'}">${u?ids.map(id=>cTile(id,u,'skill',C.pending&&C.pending.id===id)).join(''):''}</div>${C.pending?`<button class="btn sm" data-act="cancelPick" ${ttip('Annuler','Annule la compétence en cours de ciblage.')}>Annuler</button>`:''}${w?'':`<small class="ftwait">${S.auto?'Combat automatique en cours…':'Les ennemis agissent…'}</small>`}${ftTools()}`;
    ftEnd(end,{act:'endTurn',label:'Fin de<br>tour',dis:!w,tip:'Fin de tour|Termine votre tour. Les PA non utilisés sont perdus.'});
  }
  if(slot){ const keys=ownPotKeys(); slot.innerHTML=UI.cbOpen?cbPopHTML({keys,act:'usePot',state:k=>{const used=(k==='p_xp'&&C.bonus.xp)||(k==='p_loot'&&C.bonus.loot),cd=potLeft(k);return {off:!!(used||cd),lab:cd?potShow(k,cd):used?'✓':''}}}):''; $('.ftc')&&$('.ftc').classList.toggle('bagopen',!!UI.cbOpen) }
}
const ownPotKeys=()=>cbKeys(S.heroes[0].cls);

/* ---------- duel et raid ---------- */
function fArena(m,kind){
  const p=kind==='pvp'?'pvp':'rd',me=pvpMe(),nm=m.names||{},U=m.u[me],r=kind==='raid'?(RAIDS.find(x=>x.id===m.boss)||RAIDS[0]):null;
  const left=kind==='pvp'?[me]:m.players.slice(0,3),right=kind==='pvp'?[pvpOp(m)]:['boss'];
  const my=m.state==='fight'&&m.turn===me,tn=m.turn&&m.u[m.turn];
  const lim=kind==='pvp'?PVP_TURN:RD_TURN,tl=Math.max(0,lim-Math.floor((Date.now()-tsMs(m.turnAt))/1000)),late=m.state==='fight'&&!my&&Date.now()-tsMs(m.turnAt)>lim*1000;
  const unit=(id,foe)=>{const u=m.u[id]; if(!u) return `<div class="ftu wait"><div class="ftpl"><b>${esc(nm[id]||'?')}</b><small>En attente…</small></div></div>`;
    const aps=Array.from({length:u.maxAp||0},(_,i)=>`<i class="${i<u.ap?'on':''}"></i>`).join(''),sh=Math.min(Math.max(0,u.shield||0),u.maxHp||1),st=Math.min(Math.max(0,u.hp),(u.maxHp||1)-sh);
    const sts=(u.st||[]).map(s=>`<em class="b-${s.k}">${esc(s.k==='stk'?s.n+' '+s.v+'/'+(s.max||5):s.k==='ult'||s.k==='dot'?s.n:s.k==='para'?'Paralysie':s.k==='stun'?'Étourdi':s.k==='taunt'?'Provoque':s.k==='apb'?'PA +'+s.v:(s.v>0?'+':'')+Math.round(s.v)+'% '+({atk:'FOR',def:'DEF',res:'RÉS',spd:'VIT',mag:'INT'}[s.stat]||''))} ${s.dur!=null?s.dur:''}</em>`).join('');
    return `<div class="ftu ${foe?'foe':'ally'} ${id===me?'me':''} ${m.turn===id&&m.state==='fight'?'turn':''} ${u.hp<=0?'dead':''} ${u.boss?'boss':''}" data-pu="${id}"><div class="ftpl"><b>${esc(u.boss?u.name:u.name)} <small>niv. ${u.lvl}</small></b>${u.boss?'':`<small class="ftacct">${esc(u.acct||'')}${u.left?' · parti':''}</small>`}
      <div class="hp"><i style="width:${Math.max(0,u.hp/u.maxHp*100)}%"></i>${sh>0?`<b class="shl" style="left:${st/u.maxHp*100}%;width:${sh/u.maxHp*100}%"></b>`:''}<span>${Math.ceil(Math.max(0,u.hp))} / ${Math.ceil(u.maxHp)}${u.shield>0?' (+'+Math.ceil(u.shield)+')':''}</span></div><div class="apbar" ${ttip('Points d’action',u.ap+' / '+u.maxAp)}>${aps}</div><div class="stt">${sts}</div></div>
      <div class="ftfig">${fighterArt(u.boss?{boss:1,ic:'boss',hue:8}:{cls:u.cls,skin:u.skin,foe})}<i class="ftgr"></i></div></div>`};
  const ord=kind==='pvp'?(m.state==='fight'||m.state==='done'?[m.turn,m.turn===me?pvpOp(m):me]:[me,pvpOp(m)]):(m.order||[]);
  const init=`<div class="cvinit ftinit"><span class="mute">Ordre du tour</span>${ord.map(id=>{const q=m.u[id];return q?`<span class="cvo ${id==='boss'||(kind==='pvp'&&id!==me)?'foe':'ally'} ${m.turn===id&&m.state==='fight'?'now':''} ${q.hp<=0?'dead':''}" ${ttip(q.boss?q.name:(q.name+' ('+(q.acct||'')+')'))}>${PORTRAIT[q.cls]?`<img class="cvp" src="${PORTRAIT[q.cls]}" alt="" width="34" height="34">`:`<span class="tile cvt" style="--h:40">${icon('boss')}</span>`}</span>`:''}).join('<i aria-hidden="true">›</i>')}</div>`;
  /* barre du bas */
  let bar='',end={};
  const quit=m.state==='fight'&&U&&!U.left?`<div class="fttools">${quitBtn(p+'GiveUp',UI.confirm===(kind==='pvp'?'giveup':'rdgiveup'))}</div>`:'';
  if(m.state==='done'){ bar=`<div class="pvwin">${kind==='pvp'?`🏆 ${esc(nm[m.winner]||'')} remporte le duel !`:m.win?'🏆 Raid réussi !':'💀 Le raid a échoué.'}</div>`; UI.cbOpen=false }
  else if(m.state==='prep'){ const left=Math.max(0,Math.ceil((PREP_MS-(Date.now()-tsMs(m.prepAt)))/1000)),rd=m.ready&&m.ready[me],ot=m.players.filter(x=>x!==me).every(x=>m.ready&&m.ready[x]);
    bar=`${U&&U.hp>0?cbBtn():''}<div class="ftprep"><b>Préparation <span class="num" data-prep>${left} s</span></b><small>${rd?'Prêt — en attente…':'Buvez vos potions avant le début du combat.'}${ot?' Votre '+(kind==='pvp'?'adversaire':'partenaire')+' est prêt.':''}</small></div>`;
    end={act:p+'Ready',label:rd?'Prêt':'Je suis<br>prêt',dis:rd,tip:'Je suis prêt|Le combat commence quand tous les joueurs sont prêts ou à la fin du compte à rebours.'} }
  else if(U&&U.hp<=0) bar=`<small class="ftwait">Votre héros est tombé. Encouragez ${kind==='pvp'?'…':'votre partenaire'} !</small>${quit}`;
  else if(my&&U.stun){ bar=`${cbBtn()}<small class="ftwait">Vous êtes étourdi : vous passez ce tour.</small>${quit}`; end={act:p+'EndT',label:'Fin de<br>tour',tip:'Fin de tour|Termine votre tour.'} }
  else if(my){ bar=`${cbBtn()}<div class="skcbar">${['atk',...U.skills].map(id=>cTile(id,U,p+'Sk')).join('')}</div>${quit}`; end={act:p+'EndT',label:'Fin de<br>tour',tip:'Fin de tour|Termine votre tour. Les PA non utilisés sont perdus.'} }
  else { bar=`${cbBtn()}<small class="ftwait">Tour de <b>${esc(tn?(tn.boss?tn.name:(tn.acct||tn.name)):'')}</b>… <span class="num" ${kind==='pvp'?'data-pvt':'data-rdt'}>(${tl} s)</span></small>${late?`<button class="btn sm pri" data-act="${kind==='pvp'?'pvpClaim':'rdSkip'}">${kind==='pvp'?'Réclamer la victoire':'Passer son tour'}</button>`:''}${quit}`; end={act:p+'EndT',label:'Fin de<br>tour',dis:1,tip:'Fin de tour|Ce n’est pas votre tour.'} }
  const eb=end.act?`<button class="ftend" data-act="${end.act}" ${end.dis?'disabled':''} data-tip="${esc('tx:'+end.tip)}" aria-label="${esc(end.label.replace(/<br>/g,' '))}"><span>${end.label}</span></button>`:'';
  const pk=U?['p_vie','p_res',CLASSES[U.cls].role==='mag'?'p_int':'p_for','p_pa']:[],paLock=kind==='pvp'&&m.state==='fight'&&(m.round||1)>1;
  const pop=UI.cbOpen&&U&&m.state!=='done'?cbPopHTML({keys:pk,act:p+'Pot',state:k=>{const cd=Math.min((U.pcd||{})[k]||0,POTS[k].cd||99),lk=k==='p_pa'&&paLock;return {off:!!(cd||lk),lab:cd?cd:lk?'✕':''}}}):'';
  const title=kind==='pvp'?`Duel · ${esc(nm[pvpOp(m)]||'')}`:`Raid · ${esc(r.n)} <small>palier +${m.tier||0}</small>`;
  return `<div class="ftc fta2 ${pop?'bagopen':''}"><div class="ftwrap"><div class="ftsc">${kind==='pvp'?zoneScene(6,'pv'):zoneScene(raidSc(r),'rd')}
     <div class="fttop"><h2>${title}</h2><span class="cvround num">Tour <b>${m.round||1}</b></span></div>${init}
     <div class="ftfield"><div class="ftside l">${left.map(id=>unit(id,false)).join('')}</div><div class="ftside r">${right.map(id=>unit(id,true)).join('')}</div></div></div>${eb}</div>
    <div class="ftbot"><div class="ftbar">${bar}</div><div class="pvlog log">${(m.log||[]).slice(-14).map(l=>`<p>${esc(l)}</p>`).join('')}</div>${pop}</div></div>`;
}

/* --- inventaire --- */
function targetSlot(h,it){
  if(it.slot!=='ring') return it.slot;
  if(UI.invSel==='ring'||UI.invSel==='ring2') return UI.invSel;
  if(!h.equip.ring) return 'ring';
  if(!h.equip.ring2) return 'ring2';
  return 'ring';
}
function swapDelta(h,it){
  if(!canWear(it)) return null;
  const ts=targetSlot(h,it),old=h.equip[ts],p0=heroPower(h);
  h.equip[ts]=it; const p1=heroPower(h); h.equip[ts]=old;
  return p1-p0;
}

function dollImgHTML(h,D){
  const slots=D.slots.map(([k,x,y,sz])=>{const it=h.equip[k];
    return `<button class="dslot ${it?'full':''} ${UI.invSel===k?'sel':''}" data-act="dollSlot" data-slot="${k}" data-tip="${k}" aria-label="${SLOT_N[k]}${it?' : '+esc(it.name):' (vide)'}" style="left:${x/3}%;top:${y/4.5}%;width:${sz/3}%;${it?`--rc:var(--r${it.rarity})`:''}">${icon(it?itemIcon(it):slotIcon(k))}${it&&it.up?`<em>+${it.up}</em>`:''}</button>`}).join('');
  return `<div class="doll img" id="doll"><img class="dollbg" src="${D.src}" alt="" aria-hidden="true">${slots}</div>`;
}
/* mannequin « cercle runique » : portrait de la classe au centre, emplacements en cercle (sens horaire depuis le haut) */
const RUNE_ORDER=['helm','amulet','armor','legs','boots','ring2','weapon','ring'];
function runeDollHTML(h,forge){
  const W=300,H=340,cx=150,cy=170,R=122,sz=48,c=CLASSES[h.cls];
  const slots=RUNE_ORDER.map((k,i)=>{const a=-Math.PI/2+i*2*Math.PI/RUNE_ORDER.length,x=cx+R*Math.cos(a)-sz/2,y=cy+R*Math.sin(a)-sz/2,it=h.equip[k];
    return `<button class="dslot ${it?'full':''} ${(forge?it&&it.id===UI.fItem:UI.invSel===k)?'sel':''}" data-act="${forge?'fPutSlot':'dollSlot'}" data-slot="${k}" data-tip="${k}" aria-label="${SLOT_N[k]}${it?' : '+esc(it.name):' (vide)'}" style="left:${x/W*100}%;top:${y/H*100}%;width:${sz/W*100}%;${it?`--rc:var(--r${it.rarity})`:''}">${icon(it?itemIcon(it):slotIcon(k))}${it&&it.up?`<em>+${it.up}</em>`:''}</button>`}).join('');
  const center=PORTRAIT[h.cls]?`<image href="${PORTRAIT[h.cls]}" x="${cx-72}" y="${cy-72}" width="144" height="144"/>`:`<circle cx="${cx}" cy="${cy}" r="60" fill="hsl(${h.hue} 30% 26%)"/>`;
  const runes='ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊ'.split('').map((r,i)=>{const a=i*2*Math.PI/16+Math.PI/16;return `<text x="${cx+96*Math.cos(a)}" y="${cy+96*Math.sin(a)+4}" text-anchor="middle">${r}</text>`}).join('');
  return `<div class="doll rune" id="doll"><svg class="body" viewBox="0 0 ${W} ${H}" aria-hidden="true">
    <defs><radialGradient id="rg" cx="50%" cy="50%" r="62%"><stop offset="0" stop-color="#8a6842"/><stop offset=".65" stop-color="#6a4c2f"/><stop offset="1" stop-color="#4e3622"/></radialGradient></defs>
    <rect width="${W}" height="${H}" rx="4" fill="url(#rg)"/>
    <circle cx="${cx}" cy="${cy}" r="${R+6}" fill="none" stroke="#d6aa55" stroke-width="1.5" opacity=".75"/>
    <circle cx="${cx}" cy="${cy}" r="${R-6}" fill="none" stroke="#d6aa55" stroke-width="1" stroke-dasharray="2 6" opacity=".6"/>
    <g fill="#d6aa55" opacity=".55" font-size="11" font-family="serif">${runes}</g>
    <circle cx="${cx}" cy="${cy}" r="80" fill="none" stroke="#d6aa55" stroke-width="1" opacity=".5"/>
    ${center}</svg>${slots}</div>`;
}
/* roue d’équipement : grande roue + liste de l’équipement porté */
/* variantes de la roue d'équipement (mise en page plein cadre) */
function dvSlot(h,k,x,y,sz,W,H,forge,cap){

function sortBag(){
  const {k,dir}=UI.bagSort,tot={},ent=[],old=S.bag;
  for(const e of S.bag){ if(e.o.mat) tot[e.o.mat]=(tot[e.o.mat]||0)+e.o.n; else ent.push(e.o) }
  for(const [m,n] of Object.entries(tot)){let r=n;while(r>0){const q=Math.min(STACK,r);ent.push({mat:m,n:q});r-=q}}
  const q=c=>c.mat?c.n:1;
  const byName=(a,b)=>cellName(a).localeCompare(cellName(b),'fr',{sensitivity:'base'});
  const tie=(a,b)=>(b.rarity||0)-(a.rarity||0)||(b.ilvl||0)-(a.ilvl||0);
  ent.sort(k==='name'?(a,b)=>dir*(byName(a,b)||q(b)-q(a)||tie(a,b)):(a,b)=>dir*(q(b)-q(a)||byName(a,b)||tie(a,b)));
  const place=list=>{const b=[];for(const o of list){const sp=findSpot(b,...SIZE(o)); if(!sp) return null; b.push({x:sp[0],y:sp[1],o})} return b};
  const area=o=>{const [w,h]=SIZE(o);return w*h};
  S.bag=place(ent)||place(ent.slice().sort((a,b)=>area(b)-area(a)))||old;
  if(S.bag===old) toast('Impossible de tout ranger : faites un peu de place.');
}

function overlaps(x,y,w,h,skip){return S.bag.filter(e=>{ if(e===skip) return false; const [ew,eh]=SIZE(e.o); return x<e.x+ew&&e.x<x+w&&y<e.y+eh&&e.y<y+h })}
function moveEntry(i,tx,ty){
  const E=S.bag[i]; if(!E) return; const [w,h]=SIZE(E.o);
  if(tx===E.x&&ty===E.y) return;
  if(tx<0||ty<0||tx+w>GW||ty+h>GH){toast('Pas assez de place ici.');return}
  const ov=overlaps(tx,ty,w,h,E);
  if(!ov.length){E.x=tx;E.y=ty}
  else if(ov.length===1&&E.o.mat&&ov[0].o.mat===E.o.mat){
    const B=ov[0].o; if(B.n>=STACK){toast('Cette pile est pleine.');return}
    const m=Math.min(STACK-B.n,E.o.n); B.n+=m; E.o.n-=m; if(!E.o.n){S.bag.splice(i,1); if(UI.bagSel===E.o) UI.bagSel=B}
  }else if(ov.length===1){
    const B=ov[0],ox=E.x,oy=E.y,bx=B.x,by=B.y,[bw,bh]=SIZE(B.o);
    E.x=tx;E.y=ty;
    const rest=S.bag.filter(e=>e!==E&&e!==B);
    if(fitsAt(rest,tx,ty,w,h)&&fitsAt([...rest,E],ox,oy,bw,bh)){B.x=ox;B.y=oy}
    else{ const sp=fitsAt(rest,tx,ty,w,h)?findSpot([...rest,E],bw,bh):null;
      if(sp){B.x=sp[0];B.y=sp[1]} else {E.x=ox;E.y=oy;B.x=bx;B.y=by;toast('Pas assez de place pour échanger.');return} }
  }else{toast('Pas assez de place ici.');return}
  save(); render();
}

    <p class="amnote">${p.d}</p><dl class="mpst"><dt>Possédées</dt><dd>${matAll(sel)}${stashCount(sel)?` <small class="mute">(${stashCount(sel)} au coffre)</small>`:''}</dd><dt>Recharge</dt><dd>${p.cd?p.cd+' tours':'—'}</dd><dt>Prix</dt><dd>${p.fix?'voir ci-dessous':fmt(pr)+' or'}</dd><dt>Votre or</dt><dd>${fmt(S.gold)}</dd></dl>
    ${p.fix?'':`<h4>Quantité</h4><div class="mcqty"><button class="btn" data-act="shopQd" data-d="-1" aria-label="Moins" ${q<=1?'disabled':''}>${uic('minus')}</button><b class="num" aria-live="polite">${q}</b><button class="btn" data-act="shopQd" data-d="1" aria-label="Plus" ${q>=99?'disabled':''}>${uic('plus')}</button><span class="mcq">${[1,5,10,25].map(n=>`<button class="btn sm ${q===n?'on':''}" data-act="shopQ" data-q="${n}">×${n}</button>`).join('')}<button class="btn sm" data-act="shopQ" data-q="max" title="Le maximum possible">Max</button></span></div>`}
    <div class="amfight"><div class="mctot"><span>Total</span><b class="num">${p.fix?costHTML(p.fix):`${fmt(tot)} ${matIcon('gold')}`}</b></div>
     <button class="btn pri amgo" data-act="buyPot" data-k="${sel}" data-q="${q}" ${canBuy?'':'disabled'}>${uic('coin')} Acheter${p.fix?'':' ×'+q}</button>${why?`<small class="mclk">${why}</small>`:''}
     <small class="mute">Les potions vont dans le sac et se boivent en combat sans utiliser votre tour. Les prix augmentent avec votre niveau.</small></div></div></aside></div>`;

const autoCost=id=>Math.round((SITE_M[id]||1)*8000);
function cycTxt(st){
  const R=siteRes(st),rd=st.ready||0;
  if(rd>=R) return R>1?`Réserve pleine : ${rd} récoltes prêtes`:'Récolte prête : appuyez sur Collecter';
  return (rd?`${rd} récolte${rd>1?'s':''} prête${rd>1?'s':''} · `:'')+'Prochaine récolte dans '+mmss(cycleDur(st)-(st.t||0));

    :`<label class="optrow lock"><input type="checkbox" disabled> Récupérer automatiquement les récoltes de cette zone</label><p class="hint" style="margin:8px 0 0">🔒 À débloquer dans l’arbre d’améliorations, à partir du niveau de zone ${AUTO_L} (niveau actuel : <b>${lv}</b>).</p><div class="row" style="justify-content:center;margin-top:12px"><button class="btn" data-act="siteTreeFromOpt" data-id="${id}">Ouvrir l’arbre</button></div>`;

function treeModal(id){

    return `<div class="tcol">

        <span class="tpips">${pips}</span><span class="trank num">${r} / ${b.max}</span>
        <small class="teff"><span>${r?b.per(r):'Aucun bonus'}</span>${full?'':`<b>→ ${b.per(r+1)}</b>`}</small>
        <div class="tact">${full?'<span class="tmax">Maximum</span>':`<button class="btn sm pri" data-act="talBuy" data-id="${id}" data-k="${b.k}" ${hasGold(c)?'':'disabled'}>Améliorer</button>${costHTML({gold:c})}`}</div></div>
      <span class="tlink ${full?'on':''}" aria-hidden="true"></span>

        <div class="tact">${have?'<span class="tmax">Acquis</span>':full?`<button class="btn sm pri" data-act="talBuy" data-id="${id}" data-k="${cx.k}" ${hasGold(cc)?'':'disabled'}>Débloquer</button>${costHTML({gold:cc})}`:`<small class="mute">🔒 ${b.n} ${b.max}/${b.max} requis</small>`}</div></div>
    </div>`}).join('');
  const lv=zoneLvl(st),ac=autoCost(id),R=siteRes(st);

  const auto=`<div class="tnode tauto ${t.auto?'got max':''} ${lv>=AUTO_L?'':'lock'}"><span class="tic">${GEARI}</span><div class="tautotx"><b class="tn">Récolte automatique</b><small class="td">Débloque l’option de l’engrenage : les récoltes de la zone sont récupérées toutes seules.</small></div>

    <p class="hint" style="margin:12px 0 0">Chaque rang coûte un peu plus cher. Le talent étoilé se débloque quand sa branche est au maximum. Chaque amélioration achetée augmente le niveau de la zone de 1.</p></div></div>`;
}
function liveSites(){
  for(const si of SITES){
    const st=S.sites[si.id]; if(st.lvl<1) continue;
    const D=cycleDur(st),full=(st.ready||0)>=siteRes(st),cb=$(`[data-cyc="${si.id}"]`),ct=$(`[data-cyct="${si.id}"]`);
    if(cb){const w=full?100:Math.min(100,(st.t||0)/D*100),o=parseFloat(cb.style.width)||0; if(w<o){cb.style.transition='none';cb.style.width=w+'%';void cb.offsetWidth;cb.style.transition=''} else cb.style.width=w+'%'}
    if(ct) ct.textContent=cycTxt(st);
  }
}

function viewHelp(){
  const T=(head,rows)=>`<div class="htab"><table><thead><tr>${head.map(h=>`<th>${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr>${r.map((c,i)=>i?`<td>${c}</td>`:`<th scope="row">${c}</th>`).join('')}</tr>`).join('')}</tbody></table></div>`;

    ['Points d’action (PA)','Énergie pour lancer les compétences.','5 PA de base pour chaque classe. Chaque compétence coûte des PA (l’attaque de base est gratuite, une fois par tour) et tous vos PA sont rechargés au début de chacun de vos tours. Vous pouvez enchaîner plusieurs actions dans le même tour tant qu’il vous reste des PA, puis appuyer sur « Fin de tour ». Barre jaune segmentée sous la barre de vie.'],
    ['Résistance physique','Réduit les dégâts physiques reçus en %.','S’applique après la Défense. Plafonnée à 75 %.'],
    ['Résistance magique','Réduit les dégâts magiques reçus en %.','S’applique après la Défense magique. Plafonnée à 75 %.'],
    ['Résistances élémentaires','Feu, Glace, Foudre, Terre.','Réduisent en % les dégâts des compétences de cet élément (brûlures comprises). Plafonnées à 75 %. Une résistance négative est une faiblesse : les dégâts sont augmentés.'],
    ['Vitesse','Ordre d’action.','À chaque tour, les unités agissent de la plus rapide à la plus lente.'],
    ['Critique','Chance de coup critique.','5 % de base, plafonnée à 70 %. Un coup critique multiplie les dégâts par les Dégâts critiques.'],
    ['Dégâts critiques','Puissance des critiques.','150 % de base, plafonnés à 200 % : un critique inflige de 1,5 à 2 fois les dégâts.'],
    ['Esquive','Chance d’éviter une attaque.','L’attaque est annulée entièrement. Plafonnée à 30 %.'],
    ['Vol de vie','Soin sur les dégâts infligés.','Rend ce pourcentage des dégâts infligés en PV. Plafonné à 20 %.'],
    ['Dégâts bonus','Augmente tous vos dégâts.','+X % appliqué après la réduction par la Défense ou la Résistance.'],
    ['PV %','Augmente vos PV max.','S’applique sur le total (base + équipement).'],
    ['Or trouvé','Plus d’or en fin de combat.','+X % d’or gagné après une victoire.'],
    ['Puissance','Score global.','Indicateur qui résume vos statistiques pour comparer deux équipements (▲ / ▼ dans les infobulles). Il n’a pas d’effet en combat.'],
  ]);
  const dmg=`<p>Pour chaque coup : <b>stat d’attaque × multiplicateur de la compétence × K / (K + Défense ou Résistance de la cible)</b>, puis :</p>

    <p>K vaut 100 + 15 × niveau de l’attaquant. Les boucliers absorbent les dégâts avant les PV. Une Esquive réussie annule le coup.</p>`;
  const aff=T(['Effet','Type','Fonctionnement'],[

    ['<span class="b-dot">Brûlure</span>','Dégâts sur la durée','Comme le Saignement. Appliquée par la Boule de feu ou par les ennemis de feu.'],
    ['<span class="b-dot">Poison</span>','Dégâts sur la durée','Comme le Saignement, souvent plus long (4 tours).'],
    ['<span class="b-stun">Étourdi</span>','Contrôle','La cible passe son prochain tour. Les boss n’ont que la moitié des chances d’être étourdis.'],
    ['<span class="b-stun">Paralysie</span>','Contrôle (2 tours)','À chaque tour, la cible a 50 % de chances de perdre son tour (plus avec le talent Choc nerveux). Les boss n’ont que la moitié des chances d’être paralysés.'],

    ['<span class="b-buff">FOR +X %</span>','+25 % (rang 1) pendant 3 tours','Cri de guerre (Guerrier) ; Hurlement des ennemis : +30 %.'],
    ['<span class="b-buff">FOR / INT +30 %</span>','3 tours','Potion de force ou d’intelligence.'],

  const rar=T(['Rareté','Affixes','Multiplicateur de stats'],RAR.map((r,i)=>[`<span style="color:var(--r${i});font-weight:700">${r.n}</span>`,r.aff+(r.leg?' + pouvoir légendaire':'')+(r.max?' (au maximum de la plage)':''),'×'+String(r.m).replace('.',',')]))
    +`<p class="hint">Niveau d’objet : il augmente toutes les valeurs de l’objet. Chaque amélioration (+1 à +10) ajoute 5 % à toutes ses stats. Les armes donnent Force ou Intelligence, les armures de la vie, de la défense et de la résistance magique, les bijoux uniquement des affixes aléatoires.</p>`
